(function () {
  const { GAMES, T, shuffle } = PG;

  const EASY = `Apfel,Banane,Birne,Erdbeere,Kirsche,Zitrone,Ananas,Wassermelone,Karotte,Tomate,Gurke,Kartoffel,Pilz,Brot,Käse,Ei,Pizza,Hamburger,Eis,Kuchen,Schokolade,Brezel,Wurst,Suppe,Spaghetti,Popcorn,Lutscher,Hund,Katze,Maus,Pferd,Kuh,Schwein,Schaf,Hase,Fuchs,Bär,Löwe,Tiger,Elefant,Giraffe,Affe,Pinguin,Eule,Adler,Ente,Huhn,Fisch,Hai,Wal,Krebs,Schlange,Frosch,Schildkröte,Schmetterling,Biene,Spinne,Schnecke,Marienkäfer,Ameise,Hai,Haus,Tür,Fenster,Dach,Treppe,Brücke,Turm,Burg,Zelt,Leuchtturm,Stuhl,Tisch,Bett,Sofa,Lampe,Schrank,Spiegel,Uhr,Kerze,Besen,Schere,Hammer,Säge,Schlüssel,Regenschirm,Brille,Hut,Mütze,Schuh,Socke,Jacke,Krawatte,Ring,Krone,Rucksack,Koffer,Auto,Fahrrad,Bus,Zug,Flugzeug,Schiff,Hubschrauber,Rakete,Traktor,Motorrad,Boot,Sonne,Mond,Stern,Wolke,Regenbogen,Blitz,Schneemann,Baum,Blume,Berg,Vulkan,Insel,Palme,Kaktus,Feuer,Welle,Ball,Puppe,Drache,Ballon,Geschenk,Trommel,Gitarre,Klavier,Trompete,Buch,Stift,Handy,Computer,Fernseher,Kamera,Telefon,Herz,Auge,Nase,Ohr,Mund,Hand,Fuß,Zahn,Haare,Daumen`.split(',');
  const MID = `Fallschirm,Schaukel,Rutsche,Karussell,Riesenrad,Zirkus,Clown,Zauberer,Pirat,Ritter,Prinzessin,Gespenst,Vampir,Roboter,Astronaut,Feuerwehr,Polizist,Koch,Arzt,Bauer,Angler,Taucher,Skifahrer,Schwimmen,Tanzen,Schlafen,Duschen,Telefonieren,Angeln,Klettern,Fußball,Tennis,Basketball,Boxen,Golf,Bogenschießen,Eishockey,Schlittschuh,Skateboard,Snowboard,Hängematte,Wecker,Taschenlampe,Kompass,Fernglas,Lupe,Mikroskop,Thermometer,Staubsauger,Waschmaschine,Kühlschrank,Toaster,Mixer,Bügeleisen,Zahnbürste,Seife,Handtuch,Wasserhahn,Badewanne,Windmühle,Pyramide,Eiffelturm,Freiheitsstatue,Wasserfall,Höhle,Wüste,Dschungel,Iglu,Floß,Ufo,Komet,Planet,Satellit,Kamel,Nilpferd,Nashorn,Krokodil,Känguru,Eichhörnchen,Igel,Fledermaus,Papagei,Pfau,Flamingo,Qualle,Seepferdchen,Oktopus,Delfin,Skorpion,Raupe,Libelle,Einhorn,Meerjungfrau,Weihnachtsmann,Osterhase,Kürbis,Lagerfeuer,Schatzkarte,Zauberstab,Sanduhr,Flaschenpost,Kuckucksuhr,Leiter,Schubkarre,Gießkanne,Vogelscheuche,Briefkasten,Ampel,Tankstelle,Zebrastreifen,Fahrstuhl,Rolltreppe,Gipfelkreuz,Sandburg,Schneeball,Regentropfen`.split(',');
  const POOL = { easy: [...new Set(EASY)], mix: [...new Set(EASY.concat(MID))] };

  const norm = (s) => String(s || '').toLowerCase().replace(/ä/g, 'a').replace(/ö/g, 'o').replace(/ü/g, 'u').replace(/ß/g, 'ss').replace(/[^a-z0-9]/g, '');
  function lev(a, b) {
    if (Math.abs(a.length - b.length) > 1) return 2;
    const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
    for (let j = 1; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d[a.length][b.length];
  }
  /** 'ok' = richtig, 'close' = knapp daneben, sonst null */
  function judge(guess, word) {
    let g = norm(guess);
    const w = norm(word);
    if (!g) return null;
    for (const art of ['der', 'die', 'das', 'ein', 'eine']) if (g.startsWith(art) && g.length > art.length + 2 && g.slice(art.length) === w) g = w;
    if (g === w) return 'ok';
    const d = lev(g, w);
    if (d <= 1 && w.length >= 7) return 'ok'; // Tippfehler bei langen Wörtern verzeihen
    if (d <= 1 && w.length >= 4) return 'close';
    return null;
  }
  const pattern = (word, shown) => Array.from(word).map((ch, i) => (ch === ' ' ? ' ' : shown.has(i) ? ch : '_'));

  const pl = (room, id) => room.players.find((p) => p.id === id);
  const MAX_POINTS = 24000; // Schutz vor übergroßen Zeichnungen

  function nextTurn(room, g) {
    room.clearTimers();
    // nächster Zeichner: der Reihe nach, Offline-Spieler werden übersprungen
    while (g.turnNo < g.order.length * g.rounds) {
      const id = g.order[g.turnNo % g.order.length];
      g.turnNo++;
      const p = pl(room, id);
      if (p && p.connected) return startPick(room, g, id);
    }
    endGame(room, g);
  }

  function startPick(room, g, drawer) {
    g.drawer = drawer;
    g.phase = 'pick';
    g.ops = [];
    g.points = 0;
    g.boardId++;
    g.guessed = {};
    g.gained = {};
    g.feed = [];
    g.word = null;
    g.shown = new Set();
    const pool = POOL[g.cfg.words];
    g.choices = shuffle(pool.filter((w) => !g.used.has(w))).slice(0, 3);
    if (g.choices.length < 3) { g.used.clear(); g.choices = shuffle(pool).slice(0, 3); }
    const dp = pl(room, drawer);
    if (dp && dp.bot) {
      const drawable = PG.Bots.DRAWABLE.filter((w) => pool.includes(w));
      const free = drawable.filter((w) => !g.used.has(w));
      g.choices = [PG.Bots.pick(free.length ? free : drawable)];
      g.total = T(1500);
      g.deadline = Date.now() + g.total;
      room.after(g.total, () => choose(room, g, g.drawer, 0));
      room.raw && room.raw({ t: 'dr', k: 'reset', b: g.boardId });
      room.changed();
      return;
    }
    g.total = T(g.cfg.pickTime * 1000);
    g.deadline = Date.now() + g.total;
    room.after(g.total, () => choose(room, g, g.drawer, null));
    room.raw && room.raw({ t: 'dr', k: 'reset', b: g.boardId });
    room.changed();
  }

  function choose(room, g, pid, idx) {
    if (g.phase !== 'pick' || pid !== g.drawer) return;
    room.clearTimers();
    const w = idx != null && g.choices[idx] ? g.choices[idx] : g.choices[Math.floor(Math.random() * g.choices.length)];
    g.word = w;
    g.used.add(w);
    g.phase = 'draw';
    g.total = T(g.cfg.time * 1000);
    g.startedAt = Date.now();
    g.deadline = g.startedAt + g.total;
    const letters = Array.from(w).map((c, i) => (c === ' ' ? -1 : i)).filter((i) => i >= 0);
    g.hintOrder = shuffle(letters);
    g.hintsGiven = 0;
    // Hinweise bei 45 % und 70 % der Zeit (nicht bei sehr kurzen Wörtern)
    const hint = (frac, n) => room.after(g.total * frac, () => { if (g.phase === 'draw' && g.letters > 3) { g.hintsGiven = Math.min(g.hintsGiven + n, Math.floor(g.letters / 2)); g.hintOrder.slice(0, g.hintsGiven).forEach((i) => g.shown.add(i)); room.changed(); } });
    g.letters = letters.length;
    hint(0.45, 1);
    hint(0.7, 1);
    room.after(g.total, () => endRound(room, g));
    botsAfterChoose(room, g);
    room.changed();
  }

  function guessers(room, g) { return g.order.filter((id) => id !== g.drawer && pl(room, id) && pl(room, id).connected); }

  function endRound(room, g) {
    if (g.phase !== 'draw') return;
    room.clearTimers();
    // Zeichner bekommt Punkte für jede richtige Antwort
    g.phase = 'reveal';
    g.total = T(7000);
    g.deadline = Date.now() + g.total;
    room.after(g.total, () => nextTurn(room, g));
    room.changed();
  }

  function endGame(room, g) {
    room.clearTimers();
    g.phase = 'end';
    g.deadline = 0;
    g.total = 0;
    room.changed();
  }

  /** Komplette Zeichnung in kleinen Stücken schicken (Datenkanäle vertragen große Nachrichten nicht überall) */
  function chunkFull(room, pid, g) {
    if (!room.rawTo) return;
    room.rawTo(pid, { t: 'dr', k: 'full0', b: g.boardId });
    for (const op of g.ops) {
      if (op.k !== 's') { room.rawTo(pid, { t: 'dr', b: g.boardId, o: op }); continue; }
      for (let i = 0; i < op.p.length; i += 200) room.rawTo(pid, { t: 'dr', b: g.boardId, o: Object.assign({}, op, { p: op.p.slice(i, i + 200) }) });
      if (!op.p.length) room.rawTo(pid, { t: 'dr', b: g.boardId, o: Object.assign({}, op, { p: [0, 0] }) });
    }
  }

  const MAX_OPS = 900;

  /** Operation (Strich-Häppchen, Form oder Füllung) prüfen, speichern und an alle anderen verteilen */
  function addOp(room, g, msg, except) {
    if (g.phase !== 'draw') return;
    const op = PG.DrawKit.cleanOp(msg, { mono: g.cfg.mode === 'mono' });
    if (!op || g.points > MAX_POINTS) return;
    if (op.k === 's') {
      let s = g.ops[g.ops.length - 1];
      if (!s || s.k !== 's' || s.sid !== op.sid) {
        if (g.ops.length >= MAX_OPS) return;
        s = Object.assign({}, op, { p: [] });
        g.ops.push(s);
      }
      s.p.push(...op.p);
    } else {
      if (g.ops.length >= MAX_OPS) return;
      g.ops.push(op);
    }
    g.points += op.p.length + (op.k === 's' ? 0 : 20);
    room.raw && room.raw({ t: 'dr', b: g.boardId, o: op }, except);
  }

  /** Eine Vermutung auswerten (von Menschen oder Bots) */
  function submitGuess(room, g, pid, raw) {
    if (g.phase !== 'draw' || pid === g.drawer || !g.order.includes(pid) || g.guessed[pid]) return;
    const text = String(raw || '').replace(/[\u0000-\u001f<>]/g, '').trim().slice(0, 30);
    if (!text) return;
    const r = judge(text, g.word);
    const me = pl(room, pid);
    if (r === 'ok') {
      const left = Math.max(0, g.deadline - Date.now());
      const pts = 50 + Math.round(150 * (left / g.total));
      g.guessed[pid] = true;
      g.gained[pid] = pts;
      g.scores[pid] += pts;
      const dp = 40 + Math.round(30 * (left / g.total));
      g.gained[g.drawer] = (g.gained[g.drawer] || 0) + dp;
      g.scores[g.drawer] += dp;
      g.feed.push({ k: 'ok', name: me ? me.name : '?', text: 'hat es erraten!' });
      if (guessers(room, g).every((id) => g.guessed[id])) endRound(room, g);
    } else {
      g.feed.push({ k: 'g', name: me ? me.name : '?', text, pid });
      if (r === 'close') g.feed.push({ k: 'close', to: pid, text: 'Knapp daneben!' });
    }
    if (g.feed.length > 30) g.feed.splice(0, g.feed.length - 30);
    room.changed();
  }

  /** Bots: zeichnen (nur Motive, die sie können) und raten (zeitlich plausibel) */
  function botsAfterChoose(room, g) {
    const B = PG.Bots;
    const drawer = pl(room, g.drawer);
    if (drawer && drawer.bot) {
      const ch = B.chunks(g.word);
      const span = g.total * 0.55;
      ch.forEach((c, i) => room.after(Math.max(50, (span * (i + 1)) / (ch.length + 1)), () => addOp(room, g, c, null)));
    }
    for (const q of room.players) {
      if (!q.bot || q.id === g.drawer || !g.order.includes(q.id)) continue;
      const L = B.LEVEL[q.bot];
      const wrongN = Math.random() < 0.6 ? 1 + Math.floor(Math.random() * 2) : 0;
      for (let i = 0; i < wrongN; i++) {
        const w = B.pick(POOL.easy.filter((x) => norm(x) !== norm(g.word)));
        room.after(g.total * B.rnd(0.12, 0.5), () => submitGuess(room, g, q.id, w));
      }
      if (Math.random() < L.guess) {
        const at = g.total * B.rnd(L.guessAt[0], L.guessAt[1]);
        const fire = (late) => () => {
          if (g.phase !== 'draw') return;
          if (!g.ops.length && !late) { room.after(T(3500), fire(true)); return; } // erst raten, wenn etwas zu sehen ist
          submitGuess(room, g, q.id, g.word);
        };
        room.after(at, fire(false));
      }
    }
  }

  GAMES.draw = {
    id: 'draw',
    name: 'Kritzelrunde',
    emoji: '✏️',
    order: 3,
    ready: true,
    teams: false,
    blurb: 'Einer zeichnet, alle raten. Wer schneller richtig liegt, bekommt mehr Punkte.',
    setSetting(room, key, val) {
      const c = room.settings.draw;
      if (key === 'rounds' && [1, 2, 3].includes(val)) c.rounds = val;
      if (key === 'time' && [45, 60, 80, 100, 120, 180].includes(val)) c.time = val;
      if (key === 'words' && (val === 'easy' || val === 'mix')) c.words = val;
      if (key === 'pickTime' && [10, 15, 25].includes(val)) c.pickTime = val;
      if (key === 'mode' && ['free', 'mono', 'blind'].includes(val)) c.mode = val;
    },
    canStart(room) {
      if (room.players.filter((p) => p.connected).length < 2) return 'Du brauchst mindestens 2 Spieler.';
      return null;
    },
    init(room) {
      const cfg = JSON.parse(JSON.stringify(room.settings.draw));
      const ps = shuffle(room.players.filter((p) => p.connected));
      const ids = ps.map((p) => p.id);
      return {
        cfg, rounds: cfg.rounds, order: ids, names: Object.fromEntries(ps.map((p) => [p.id, p.name])), scores: Object.fromEntries(ids.map((i) => [i, 0])),
        phase: 'pick', turnNo: 0, drawer: null, word: null, choices: [], ops: [], points: 0, boardId: 0, guessed: {}, gained: {}, feed: [], shown: new Set(), used: new Set(),
        deadline: 0, total: 0, startedAt: 0, letters: 0, hintsGiven: 0, hintOrder: [], close: {},
      };
    },
    begin(room) { nextTurn(room, room.game); },
    act(room, pid, msg) {
      const g = room.game;
      const isHost = pid === room.hostId;
      if (msg.a === 'again') { if (isHost && g.phase === 'end') room.restartGame(); return; }
      if (msg.a === 'skip') {
        if (isHost && g.phase === 'reveal') nextTurn(room, g);
        else if (isHost && g.phase === 'draw' && Object.keys(g.guessed).length) endRound(room, g);
        return;
      }
      if (msg.a === 'pick') { choose(room, g, pid, msg.i | 0); return; }
      if (msg.a === 'sync') { room.rawTo && chunkFull(room, pid, g); return 'quiet'; }
      if (pid === g.drawer && g.phase === 'draw') {
        if (msg.a === 'op') { addOp(room, g, msg.o, pid); return 'quiet'; } // keine Neuzeichnung der ganzen Oberfläche
        if (msg.a === 'undo') { g.ops.pop(); room.raw && room.raw({ t: 'dr', k: 'undo', b: g.boardId }, pid); room.changed(); return; }
        if (msg.a === 'clear') { g.ops = []; room.raw && room.raw({ t: 'dr', k: 'clear', b: g.boardId }, pid); room.changed(); return; }
        return;
      }
      if (msg.a === 'guess') submitGuess(room, g, pid, msg.text);
    },
    gone(room, pid) {
      const g = room.game;
      if (!g) return;
      if (g.phase === 'pick' && pid === g.drawer) nextTurn(room, g);
      else if (g.phase === 'draw') {
        if (pid === g.drawer) endRound(room, g);
        else if (guessers(room, g).length && guessers(room, g).every((id) => g.guessed[id])) endRound(room, g);
      }
    },
    view(room, pid) {
      const g = room.game;
      const isDrawer = pid === g.drawer;
      const reveal = g.phase === 'reveal' || g.phase === 'end';
      const v = {
        phase: g.phase, drawer: g.drawer, isDrawer, boardId: g.boardId, rounds: g.rounds, turn: Math.min(g.turnNo, g.order.length * g.rounds), turns: g.order.length * g.rounds,
        remaining: g.deadline ? Math.max(0, g.deadline - Date.now()) : 0, total: g.total,
        players: g.order.map((id) => { const p = pl(room, id) || { name: g.names[id], color: '#888', connected: false }; return { id, name: p.name, color: p.color, connected: p.connected, score: g.scores[id], guessed: !!g.guessed[id], gained: g.gained[id] || 0 }; }),
        feed: g.feed.filter((f) => f.k !== 'close' || f.to === pid).slice(-12),
        strokeN: g.ops.length, mode: g.cfg.mode || 'free',
      };
      if (g.phase === 'pick' && isDrawer) v.choices = g.choices;
      if (g.phase === 'draw') {
        v.pattern = pattern(g.word, g.shown);
        if (isDrawer) v.word = g.word;
        v.iGuessed = !!g.guessed[pid];
        if (v.iGuessed) v.word = g.word;
      }
      if (reveal && g.word) v.word = g.word;
      return v;
    },
  };
})();

/* Kritzelrunde: Oberfläche. Zeichenfläche und Eingabefeld bleiben zwischen den Aktualisierungen bestehen (patch). */
(function () {
  const { h, UI, LobbyUI } = PG;
  const K = PG.DrawKit;

  /* ---------- Zeichenbrett (Daten) ---------- */

  const B = { id: -1, board: null, pad: null, lastSync: 0, get ops() { return this.board ? this.board.ops : []; } };
  PG.__B = B; // nur für Tests

  /* Zeichenbrett-Designs (nur lokal): Hintergrund kommt per CSS, der Radierer löscht echte Striche */
  const BOARDS = [['papier', 'Papier'], ['karo', 'Karo'], ['tafel', 'Tafel'], ['neon', 'Neon']];
  const boardSkin = () => { try { const v = localStorage.getItem('pg.drawSkin'); return BOARDS.some((b) => b[0] === v) ? v : 'papier'; } catch (e) { return 'papier'; } };
  const darkBoard = () => boardSkin() === 'tafel' || boardSkin() === 'neon';

  PG.rawHandlers = PG.rawHandlers || {};
  PG.rawHandlers.dr = (m) => {
    if (!B.board) return;
    if (m.k === 'reset' || m.k === 'full0') { B.id = m.b; B.board.reset([]); return; }
    if (m.b !== B.id) { B.id = m.b; B.board.reset([]); }
    if (m.o) B.board.remote(m.o);
    else if (m.k === 'undo') B.board.undo();
    else if (m.k === 'clear') B.board.clear();
  };

  /* ---------- Lobby ---------- */

  LobbyUI.draw = (v, isHost, send, rerender) => {
    const c = v.settings.draw;
    const seg = (label, key, values, cur, fmt) => h('div', { class: 'seg' }, h('b', null, label),
      values.map((x) => h('button', { 'aria-pressed': String(cur === x), disabled: !isHost, onclick: () => send({ t: 'setting', game: 'draw', key, value: x }) }, fmt(x))));
    return h('div', { class: 'card', style: { marginTop: '12px' } },
      seg('Durchgänge', 'rounds', [1, 2, 3], c.rounds, (x) => x + (x === 1 ? ' Mal' : ' Mal')),
      seg('Bedenkzeit Wortwahl', 'pickTime', [10, 15, 25], c.pickTime || 15, (x) => x + ' s'),
      seg('Zeit pro Zeichnung', 'time', [45, 60, 80, 100, 120, 180], c.time, (x) => x + ' s'),
      seg('Wörter', 'words', ['easy', 'mix'], c.words, (x) => (x === 'easy' ? 'Leicht' : 'Gemischt')),
      seg('Modus', 'mode', ['free', 'mono', 'blind'], c.mode || 'free', (x) => ({ free: 'Frei', mono: 'Schwarz-Weiß', blind: 'Blind' }[x])),
      h('p', { class: 'hint small', style: { marginTop: '10px' } }, (c.mode === 'mono' ? 'Schwarz-Weiß: Alle Werkzeuge sind da, aber nur in Schwarz und ohne Deckkraft.' : c.mode === 'blind' ? 'Blind: Wer zeichnet, sieht die eigenen Striche nicht. Alle anderen schon.' : 'Frei: alle Farben.') + ' Jede Person zeichnet pro Durchgang einmal.'),
      h('div', { class: 'seg skinseg' }, h('b', null, 'Zeichenbrett (nur für dich)'),
        BOARDS.map(([id, label]) => h('button', { 'aria-pressed': String(boardSkin() === id), onclick: () => { try { localStorage.setItem('pg.drawSkin', id); } catch (e) { /* egal */ } rerender(); } }, label))));
  };

  /* ---------- Spielansicht ---------- */

  const initial = (p) => p.name.slice(0, 1).toUpperCase();
  const btn = (label, cls, fn) => h('button', { class: 'btn ' + cls, onclick: fn }, label);
  const timerEl = (v) => (v.total ? h('div', { class: 'timer', 'data-remaining': v.remaining, 'data-total': v.total }, h('i')) : null);

  function build() {
    const S = { ctx: null, v: null };
    const board = new K.Board({ dark: darkBoard() });

    const pad = new K.Pad({

      onUndo: () => S.ctx.send({ a: 'undo' }),
      onClear: () => S.ctx.send({ a: 'clear' }),
    });
    B.pad = pad;
    const feed = h('div', { class: 'kfeed', 'aria-live': 'polite' });
    const input = h('input', { class: 'input kin', maxlength: 30, autocomplete: 'off', autocapitalize: 'sentences', enterkeyhint: 'send', placeholder: 'Deine Vermutung …', 'aria-label': 'Deine Vermutung' });
    const form = h('form', { class: 'kguess', onsubmit: (e) => { e.preventDefault(); const t = input.value.trim(); if (!t) return; S.ctx.send({ a: 'guess', text: t }); input.value = ''; input.focus(); } },
      input, h('button', { class: 'btn', type: 'submit' }, 'Raten'));

    const root = h('div', { class: 'kritzel' },
      h('div', { class: 'kscore' }), h('div', { class: 'khead' }),
      h('div', { class: 'kboard kb-' + boardSkin() }, board.el, h('div', { class: 'koverlay' })),
      pad.tb, form, feed, h('div', { class: 'kfoot' }));
    root.__k = { S, tools: pad.tb, feed, form, input, board, pad };
    return root;
  }

  const SND = { key: '', guessed: false, n: 0 };
  function sounds(v) {
    const k = v.turn + ':' + v.phase;
    const n = v.players.filter((p) => p.guessed).length;

/*
 * Schätzrunde: Ein Gegenstand wird gezeigt, alle schätzen seine Größe oder seinen Preis. Je näher dran, desto mehr Punkte.
 * Solo: jede Person für sich. Team: Rot gegen Blau, jedes Teammitglied schätzt selbst; sind sich die Schätzungen im Team
 * uneinig, wird eine der abgegebenen Schätzungen ausgelost (jedes Mitglied zählt gleich).
 * Der wahre Wert steht nur im Host und wird erst bei der Auflösung in die Ansichten geschrieben.

(function () {
  const { h, T, shuffle, pick, TEAMS, GAMES, UI } = PG;

  const SIGMA = { easy: 0.9, mid: 0.5, hard: 0.25 }; // Streuung der Bot-Schätzungen (logarithmisch)

  /* ---------- Hilfsfunktionen (auch für Tests) ---------- */

  /** Punkte je Schätzung: 1000 bei exakt, 0 bei Faktor 4 oder mehr daneben (logarithmisch, also fair für kleine und große Zahlen) */
  function score(guess, truth) {
    if (!(guess > 0) || !(truth > 0)) return 0;

  }

  /** Zahl aus Texteingabe lesen. Komma oder Punkt als Dezimalzeichen; „1.000“ und „12.345.678“ zählen als Tausenderpunkte. */
  function parseNum(text) {
    let t = String(text == null ? '' : text).replace(/[\s ']/g, '');
    if (!t) return null;
    if (t.includes(',') && t.includes('.')) t = t.replace(/\./g, '').replace(',', '.');
    else if (t.includes(',')) t = t.replace(',', '.');
    else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
    if (!/^\d*\.?\d+$/.test(t) && !/^\d+\.$/.test(t)) return null;
    const v = Number(t);
    return Number.isFinite(v) && v > 0 && v <= MAX_VAL ? v : null;

  const sig2 = (x) => { const p = Math.pow(10, Math.floor(Math.log10(x)) - 1); return Math.round(x / p) * p; };
  function botGuess(truth, level) {

  /** Team-Entscheid: eine Schätzung wird gewählt. Einigkeit = alle abgegebenen Werte gleich, sonst entscheidet das Los. */
  function teamPick(guesses) {

    if (guesses.length === 1) return { chosen: guesses[0], how: 'single' };

  const fmt = (v, u) => {

    if (r >= 2) return '×' + (Math.round(r * 10) / 10).toLocaleString('de-DE') + ' zu hoch';
    if (r <= 0.5) return '×' + (Math.round(10 / r) / 10).toLocaleString('de-DE') + ' zu niedrig';
    return Math.round(Math.abs(r - 1) * 100) + ' % zu ' + (r > 1 ? 'hoch' : 'niedrig');

  PG.helpScreen = (opts) => h('div', { class: 'help' },

'use strict';
/* App: Start, Lobby, Verbindungen und der Rahmen um die einzelnen Spiele. */
(function () {
  const { h, TEAMS, UI, TEST } = PG;

  const ss = {
    get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { /* egal */ } },
    del(k) { try { sessionStorage.removeItem(k); } catch (e) { /* egal */ } },
  };
  const ls = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* egal */ } },
  };
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  const app = {
    mode: 'home', // home | connecting | reconnect | room
    role: null, // host | client
    pid: ss.get('pg.pid') || PG.rid(12),
    sec: ss.get('pg.sec') || PG.rid(32), // geheimer Schlüssel: beweist bei Wiederanmeldung, dass man dieselbe Person ist
    name: '',
    code: '',
    draft: { name: ls.get('pg.name') || '', code: '' },
    room: null,
    hostLink: null,
    client: null,
    view: null,
    err: '',
    statusText: '',
    reconnecting: false,
  };
  ss.set('pg.pid', app.pid);
  ss.set('pg.sec', app.sec);
  if (TEST) window.__pg = { app };

  /* ---------- Profilfotos ---------- */

  /** Foto-Nachricht vom Host (oder lokal beim Host selbst) übernehmen */
  function gotPhoto(m) {
    if (!m || typeof m.pid !== 'string') return;
    const d = m.d == null ? null : (PG.Profile.sanitize({ ph: m.d }).ph);
    if (m.d != null && !d) return;
    if (d) { PG.photos[m.pid] = d; PG.photoV[m.pid] = m.v | 0; } else { delete PG.photos[m.pid]; delete PG.photoV[m.pid]; }
    render();
  }
  PG.photoV = {};
  const photoAsked = {};
  /** Fehlende Fotos beim Host nachfragen (nur ein Mal je Foto-Version) */
  function syncPhotos() {
    if (!app.view) return;
    for (const p of app.view.players) {
      if (!p.ph) continue; // Entfernen kommt als eigene Nachricht (ph mit d: null)
      if (PG.photoV[p.id] === p.ph || photoAsked[p.id] === p.ph) continue;
      photoAsked[p.id] = p.ph;
      if (app.role === 'client' && app.client) app.client.send({ t: 'needphoto', pid: p.id });
    }
  }
  /** Eigene Profiländerung an den Raum melden (im Host direkt, sonst per Nachricht) */
  function profileChanged(d) {
    if (!app.view) return;
    send({ t: 'prof', e: d.e, fx: d.fx, fr: d.fr });
    if (d.ph !== app.sentPh) { app.sentPh = d.ph; send({ t: 'photo', d: d.ph }); }
  }
  const dispatchRaw = (m) => { const f = PG.rawHandlers && Object.prototype.hasOwnProperty.call(PG.rawHandlers, m.t) ? PG.rawHandlers[m.t] : null; if (f) f(m); };
  const localRaw = (msg) => { if (msg.t === 'ph') gotPhoto(msg); else dispatchRaw(msg); };

  /* ---------- Senden ---------- */

  function send(msg) {
    if (app.role === 'host' && app.room) app.room.handle(app.pid, msg);
    else if (app.client) app.client.send(msg);
  }

  /* ---------- Host ---------- */

  function flush(room) {
    if (app.hostLink) {
      for (const p of room.players) {
        if (p.id === app.pid || !p.connected || p.bot) continue;
        app.hostLink.send(p.id, { t: 'view', v: room.view(p.id) });
      }
    }
    app.view = room.view(app.pid);
    render();
  }

  function hostMessage(conn, m) {
    const room = app.room;
    if (!room) return;
    if (m.t === 'hello') {
      const pid = String(m.pid || '');
      const sec = String(m.sec || '');
      const refuse = (reason) => {
        try { conn.send(JSON.stringify({ t: 'refused', reason })); } catch (e) { /* egal */ }
        setTimeout(() => { try { conn.close(); } catch (e) { /* egal */ } }, 300);
      };
      if (!/^[a-z0-9]{8,40}$/.test(pid) || !/^[a-z0-9]{16,64}$/.test(sec)) return refuse('Ungültige Anmeldung.');
      // Eine Verbindung darf nur eine einzige Person sein (sonst könnte man mit neuen Kennungen Plätze blockieren)
      if (conn._pid && conn._pid !== pid) return refuse('Diese Verbindung gehört schon zu einer anderen Person.');
      const known = room.players.some((p) => p.id === pid);
      if (!known) {
        const now = Date.now();
        app.joinLog = (app.joinLog || []).filter((t) => now - t < 10000);
        if (app.joinLog.length >= 6) return refuse('Zu viele Beitritte auf einmal. Versuche es gleich noch einmal.');
        app.joinLog.push(now);
      }
      const r = room.addPlayer(pid, m.name, sec, true, m.prof);
      if (!r.ok) return refuse(r.reason);
      const old = app.hostLink.conns.get(pid);
      if (old && old !== conn) { old._pid = null; try { old.close(); } catch (e) { /* egal */ } }
      app.hostLink.conns.set(pid, conn);
      conn._pid = pid;
      room.changed();
      return;
    }
    const pid = conn._pid;
    if (!pid) return;
    if (m.t === 'leave') {
      conn._pid = null;
      app.hostLink.conns.delete(pid);
      try { conn.close(); } catch (e) { /* egal */ }
      if (!room.gameId) room.removePlayer(pid); else room.playerGone(pid);
      return;
    }
    room.handle(pid, m);
  }

  function hostGone(conn) {
    const pid = conn._pid;
    if (!pid || !app.room || app.hostLink.conns.get(pid) !== conn) return;
    app.hostLink.conns.delete(pid);
    app.room.playerGone(pid);
  }

  async function createRoom() {
    const name = (app.draft.name || '').trim();
    if (!name) return setErr('Gib zuerst deinen Namen ein.');
    ls.set('pg.name', name);
    app.err = '';
    app.mode = 'connecting';
    app.statusText = 'Raum wird erstellt …';
    render();
    try { await PG.Net.loadPeer(); } catch (e) { return backHome('Die Verbindungsbibliothek (PeerJS) konnte nicht geladen werden. Prüfe deine Internetverbindung.'); }
    const link = new PG.Net.HostLink({
      onMessage: hostMessage,
      onGone: hostGone,
      onPeerError: (e) => console.warn('peer', e),
    });
    let code;
    try { code = await link.start(); } catch (e) { return backHome('Der Vermittlungsserver ist gerade nicht erreichbar. Versuche es später noch einmal.'); }
    PG.loadQuestions().catch((e) => console.warn('Fragenpool', e)); // nur der Host braucht ihn
    app.role = 'host';
    app.name = name;
    app.code = code;
    app.hostLink = link;
    const room = new PG.Room(code, app.pid, name, PG.Profile.forSend());
    room.sink = flush;
    // Direktnachrichten (z. B. Zeichenstriche): kein Neuaufbau der Oberfläche
    room.raw = (msg, except) => {
      for (const p of room.players) {
        if (p.id === except || !p.connected || p.bot) continue;
        if (p.id === app.pid) localRaw(msg); else if (app.hostLink) app.hostLink.send(p.id, msg);
      }
    };
    room.rawTo = (pid, msg) => { if (pid === app.pid) localRaw(msg); else if (app.hostLink) app.hostLink.send(pid, msg); };
    room.onKick = (pid) => { link.send(pid, { t: 'kicked' }); setTimeout(() => link.drop(pid), 200); };
    app.room = room;
    app.mode = 'room';
    app.view = room.view(app.pid);
    app.sentPh = null;
    if (PG.Profile.data.ph) { app.sentPh = PG.Profile.data.ph; room.handle(app.pid, { t: 'photo', d: app.sentPh }); }
    render();
    acquireWake();
  }

  /** Alleine gegen Bots: kein Netzwerk, kein Raumcode. Der Raum lebt nur in diesem Browser. */
  async function startSolo() {
    const name = (app.draft.name || '').trim();
    if (!name) return setErr('Gib zuerst deinen Namen ein.');
    ls.set('pg.name', name);
    app.err = '';
    PG.loadQuestions().catch((e) => console.warn('Fragenpool', e));
    app.role = 'host';
    app.solo = true;
    app.name = name;
    app.code = 'SOLO';
    app.hostLink = null;
    const room = new PG.Room('SOLO', app.pid, name, PG.Profile.forSend());
    room.sink = flush;
    room.raw = (msg, except) => { if (except !== app.pid) localRaw(msg); };
    room.rawTo = (pid, msg) => { if (pid === app.pid) localRaw(msg); };
    room.addBot('mid');
    room.addBot('mid');
    app.room = room;
    app.mode = 'room';
    app.sentPh = null;
    if (PG.Profile.data.ph) { app.sentPh = PG.Profile.data.ph; room.handle(app.pid, { t: 'photo', d: app.sentPh }); }
    app.view = room.view(app.pid);
    render();
    acquireWake();
  }

  /* ---------- Client ---------- */

  function clientMessage(m) {
    if (m.t === 'view') { app.view = m.v; app.mode = 'room'; render(); } else if (m.t === 'refused') backHome(m.reason || 'Beitritt nicht möglich.');
    else if (m.t === 'ph') gotPhoto(m); else if (m.t === 'kicked') backHome('Der Host hat dich aus dem Raum entfernt.');
    else if (m.t === 'closed') backHome('Der Host hat den Raum geschlossen.');
    else dispatchRaw(m);
  }

  function clientClosed() {
    if (app.role === 'client' && app.mode === 'room') reconnect();
  }

  async function connectClient(code, name, isRetry) {
    const link = new PG.Net.ClientLink({ onMessage: clientMessage, onClose: clientClosed, onError: (e) => console.warn('peer', e) });
    try { await link.connect(code); } catch (e) {
      link.close();
      if (isRetry) throw e;
      const msg = e && e.type === 'peer-unavailable' ? 'Diesen Raum gibt es nicht. Prüfe den Code.'
        : e && e.type === 'timeout' ? 'Keine Verbindung zum Raum. Prüfe den Code und dein Netzwerk.'
          : 'Die Verbindung hat nicht geklappt. Versuche es noch einmal.';
      return backHome(msg);
    }
    app.client = link;
    app.role = 'client';
    app.code = code;
    app.name = name;
    ss.set('pg.sess', JSON.stringify({ code, name }));
    const prof = PG.Profile.forSend();
    link.send({ t: 'hello', pid: app.pid, sec: app.sec, name, prof: { e: prof.e, fx: prof.fx, fr: prof.fr } });
    app.sentPh = prof.ph;
    if (prof.ph) link.send({ t: 'photo', d: prof.ph });
    app.mode = 'room';
    render();
    acquireWake();
  }

  async function joinRoom() {
    const name = (app.draft.name || '').trim();
    const code = (app.draft.code || '').toUpperCase().replace(/[^A-Z]/g, '');
    if (!name) return setErr('Gib zuerst deinen Namen ein.');
    if (code.length !== PG.Net.CODE_LEN) return setErr('Der Raumcode hat ' + PG.Net.CODE_LEN + ' Buchstaben.');
    ls.set('pg.name', name);
    app.err = '';
    app.mode = 'connecting';
    app.statusText = 'Verbinde mit Raum ' + code + ' …';
    render();
    try { await PG.Net.loadPeer(); } catch (e) { return backHome('Die Verbindungsbibliothek (PeerJS) konnte nicht geladen werden. Prüfe deine Internetverbindung.'); }
    await connectClient(code, name, false);
  }

  async function reconnect() {
    if (app.reconnecting) return;
    app.reconnecting = true;
    app.mode = 'reconnect';
    render();
    try { await PG.Net.loadPeer(); } catch (e) { app.reconnecting = false; return backHome('Die Verbindung ist abgebrochen.'); }
    for (let i = 0; i < 6; i++) {
      await sleep(2500);
      try { await connectClient(app.code, app.name, true); app.reconnecting = false; return; } catch (e) { /* weiter versuchen */ }
    }
    app.reconnecting = false;
    backHome('Die Verbindung zum Raum ist abgebrochen.');
  }

  /* ---------- Beenden ---------- */

  function teardown() {
    if (app.hostLink) { app.hostLink.close(); app.hostLink = null; }
    if (app.room) { app.room.clearTimers(); app.room.sink = null; app.room = null; }
    if (app.client) { app.client.close(); app.client = null; }
    app.role = null;
    app.solo = false;
    app.view = null;
    ss.del('pg.sess');
    releaseWake();
  }

  function backHome(msg) {
    teardown();
    app.mode = 'home';
    app.err = msg || '';
    app.reconnecting = false;
    render();
  }

  function leave() {
    if (app.solo) { backHome(''); return; }
    if (app.role === 'host') {
      if (!confirm('Den Raum für alle schließen?')) return;
      for (const p of app.room.players) if (p.id !== app.pid && !p.bot) app.hostLink.send(p.id, { t: 'closed' });
      setTimeout(() => backHome(''), 250);
    } else {
      if (app.client) app.client.send({ t: 'leave' });
      setTimeout(() => backHome(''), 150);
    }
  }

  function setErr(msg) { app.err = msg; render(); }

  /* ---------- Bildschirm wach halten (wichtig für den Host) ---------- */

  let wake = null;
  async function acquireWake() {
    try {
      if ('wakeLock' in navigator && !wake && document.visibilityState === 'visible') {
        wake = await navigator.wakeLock.request('screen');
        wake.addEventListener('release', () => { wake = null; });
      }
    } catch (e) { /* nicht verfügbar */ }
  }
  function releaseWake() { try { if (wake) wake.release(); } catch (e) { /* egal */ } wake = null; }
  document.addEventListener('visibilitychange', () => { if (app.mode === 'room') acquireWake(); });
  addEventListener('beforeunload', (e) => { if (app.role === 'host' && app.mode === 'room' && !app.solo) { e.preventDefault(); e.returnValue = ''; } });

  /* ---------- Oberfläche ---------- */

  function toast(text) {
    const t = h('div', { class: 'toast', role: 'status' }, text);
    document.body.append(t);
    setTimeout(() => t.remove(), 2200);
  }

  function copyLink() {
    const url = location.origin + location.pathname + '?raum=' + app.code;
    const done = () => toast('Link kopiert');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, () => prompt('Link zum Kopieren:', url));
    else prompt('Link zum Kopieren:', url);
  }

  function homeScreen() {
    const go = (e) => { if (e.key === 'Enter') (app.draft.code ? joinRoom : createRoom)(); };
    return h('div', { class: 'home' },
      h('h1', { class: 'brand' }, 'Spielstube'),
      h('p', { class: 'lead' }, 'Partyspiele für eure Handys. Einer erstellt einen Raum, alle anderen treten mit dem Code bei.'),
      app.err ? h('div', { class: 'err', role: 'alert' }, app.err) : null,
      h('label', { class: 'field' }, h('span', null, 'Dein Name'),
        h('input', { class: 'input', maxlength: 14, autocomplete: 'nickname', value: app.draft.name, oninput: (e) => { app.draft.name = e.target.value; }, onkeydown: go })),
      h('button', { class: 'btn block', onclick: createRoom }, 'Raum erstellen'),
      h('p', { class: 'or' }, 'oder'),
      h('label', { class: 'field' }, h('span', null, 'Raumcode'),
        h('input', {
          class: 'input code', maxlength: PG.Net.CODE_LEN, autocomplete: 'off', autocapitalize: 'characters', spellcheck: 'false', placeholder: 'ABCDE', value: app.draft.code,
          oninput: (e) => { const v = e.target.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, PG.Net.CODE_LEN); e.target.value = v; app.draft.code = v; },
          onkeydown: go,
        })),
      h('button', { class: 'btn alt block', onclick: joinRoom }, 'Beitreten'),
      h('p', { class: 'or' }, 'oder'),
      h('button', { class: 'btn alt block', onclick: startSolo }, '🤖 Alleine gegen Bots'),
      h('div', { class: 'homebtns' },
        h('button', { class: 'btn small alt', onclick: () => { app.helpOpen = true; render(); } }, '📖 Spielerklärungen'),
        h('button', { class: 'btn small alt', onclick: () => { app.settingsOpen = true; render(); } }, '⚙️ Einstellungen'),
        h('button', { class: 'btn small alt profbtn', onclick: () => { app.profileOpen = true; render(); } }, PG.avatarEl({ id: '_me', name: app.draft.name || '?', color: '#FFC83D', e: PG.Profile.data.e, fr: PG.Profile.data.fr, photoUrl: PG.Profile.data.ph }), ' Profil'),
        PG.fullscreenButton(),
        PG.soundButton()),
      h('p', { class: 'foot' }, 'Der Host muss die Seite während des Spiels offen lassen. Alle brauchen eine Internetverbindung.'));
  }

  function statusScreen(emoji, title, text, action) {
    return h('div', { class: 'status' }, h('div', { class: 'bigemoji', 'aria-hidden': 'true' }, emoji), h('h2', null, title), text ? h('p', { class: 'hint', style: { marginTop: '10px' } }, text) : null, action ? h('div', { style: { marginTop: '20px' } }, action) : null);
  }

  function topbar(v, inGame) {
    const isHost = v.me === v.host;
    return h('div', { class: 'topbar' },
      h('span', { class: 'mini', 'aria-label': app.solo ? 'Solo-Modus' : 'Raumcode ' + v.code }, app.solo ? 'SOLO' : v.code),
      h('div', { class: 'row tbtns' },
        PG.fullscreenButton(),
        PG.soundButton(),
        inGame && isHost ? h('button', { class: 'btn small alt', onclick: () => { if (confirm('Das Spiel beenden und zurück zur Lobby?')) send({ t: 'lobby' }); } }, 'Zur Lobby') : null,
        h('button', { class: 'btn small alt', onclick: leave }, app.solo ? 'Beenden' : isHost ? 'Raum schließen' : 'Verlassen')));
  }

  function lobbyScreen() {
    const v = app.view;
    const isHost = v.me === v.host;
    const sel = v.games.find((g) => g.id === v.selected);
    const needTeams = !!(sel && sel.teams);

    return h('div', { class: 'lobby' },
      topbar(v, false),
      app.solo ? h('div', { class: 'card' }, h('p', null, h('b', null, 'Solo-Modus')), h('p', { class: 'hint', style: { marginTop: '6px' } }, 'Du spielst allein gegen Bots. Es wird keine Internetverbindung gebraucht. Wähle unten, wie viele Bots und wie stark.')) :
      h('div', { class: 'card' },
        h('div', { class: 'codeline' },
          h('div', null, h('p', { class: 'hint' }, 'Raumcode'), h('div', { class: 'tiles', role: 'img', 'aria-label': 'Raumcode ' + v.code.split('').join(' ') }, v.code.split('').map((c) => h('span', null, c)))),
          h('button', { class: 'btn small alt', onclick: copyLink }, 'Link kopieren')),
        h('p', { class: 'hint', style: { marginTop: '12px' } }, 'Die anderen öffnen diese Seite und geben den Code ein.'),
        isHost ? h('button', { class: 'btn small alt', style: { marginTop: '10px' }, 'aria-pressed': String(!!v.locked), onclick: () => send({ t: 'lock', on: !v.locked }) }, v.locked ? '🔒 Raum gesperrt (antippen zum Öffnen)' : '🔓 Raum sperren, wenn alle da sind') : (v.locked ? h('p', { class: 'hint small', style: { marginTop: '8px' } }, '🔒 Der Raum ist gesperrt.') : null)),

      h('h2', { class: 'section-title' }, 'Spieler (' + v.players.length + ')', ' ', h('button', { class: 'btn small alt', style: { marginLeft: '8px' }, onclick: () => { app.profileOpen = true; render(); } }, '🎨 Mein Profil'), ' ', h('button', { class: 'btn small alt', 'aria-label': 'Einstellungen', onclick: () => { app.settingsOpen = true; render(); } }, '⚙️'), ' ', h('button', { class: 'btn small alt', 'aria-label': 'Spielerklärungen', onclick: () => { app.helpOpen = true; render(); } }, '📖')),
      h('ul', { class: 'players' }, v.players.map((p) => h('li', { class: 'player' + (p.connected ? '' : ' off') },
        PG.avatarEl(p),
        h('span', { class: 'pname' }, PG.nameEl(p.name, p.fx), ' ', h('small', null, [p.id === v.host ? 'Host' : '', p.id === v.me ? 'du' : '', p.bot ? { easy: 'Leicht', mid: 'Mittel', hard: 'Schwer' }[p.bot] : '', p.connected ? '' : 'offline'].filter(Boolean).join(', '))),
        needTeams ? h('span', { class: 'teamsel', role: 'group', 'aria-label': 'Team von ' + p.name }, TEAMS.map((tm, t) => h('button', {
          style: { '--tc': tm.color }, 'aria-pressed': String(p.team === t), disabled: !(isHost || p.id === v.me), onclick: () => send({ t: 'team', team: t, pid: p.id }),
        }, tm.name))) : null,
        isHost && p.id !== v.me ? h('button', { class: 'kick', 'aria-label': p.name + ' entfernen', onclick: () => send({ t: 'kick', pid: p.id }) }, '✕') : null))),
      isHost ? h('div', { class: 'botrow' }, h('b', null, 'Bot hinzufügen'),
        [['easy', 'Leicht'], ['mid', 'Mittel'], ['hard', 'Schwer']].map(([lv, nm]) => h('button', { class: 'btn small alt', disabled: v.players.length >= 10, onclick: () => send({ t: 'addbot', level: lv }) }, '🤖 ' + nm))) : null,
      isHost && needTeams ? h('div', { style: { marginTop: '10px' } }, h('button', { class: 'btn small alt', onclick: () => send({ t: 'shuffle' }) }, 'Teams mischen')) : null,

      h('h2', { class: 'section-title' }, 'Spiel'),
      h('div', { class: 'games' }, v.games.map((g) => h('button', {
        class: 'gamecard', 'aria-pressed': String(g.id === v.selected), disabled: !isHost || !g.ready, onclick: () => send({ t: 'select', game: g.id }),
      }, h('span', { class: 'ge', 'aria-hidden': 'true' }, g.emoji), h('span', null, h('b', null, g.name), h('span', { class: 't' }, g.ready ? g.blurb : 'Kommt bald.'))))),
      PG.LobbyUI[v.selected] ? PG.LobbyUI[v.selected](v, isHost, send, render) : null,

      h('div', { class: 'startbar' },
        isHost ? h('button', { class: 'btn block', disabled: !!v.startError, onclick: () => send({ t: 'start' }) }, 'Spiel starten') : null,
        h('p', { class: 'hint' }, isHost ? (v.startError || 'Alles bereit.') : 'Der Host wählt das Spiel und startet es.')));
  }

  function gameScreen() {
    const v = app.view;
    const isHost = v.me === v.host;
    const ui = UI[v.gameId];
    const ctx = { isHost, me: v.me, players: v.players, send: (m) => send(Object.assign({ t: 'g' }, m)), sendRoom: send, rerender: render };
    const uiNode = ui ? ui(v.game, ctx) : h('p', null, 'Unbekanntes Spiel.');
    const node = h('div', { class: 'game' }, topbar(v, true), uiNode);
    node.__gid = v.gameId;
    node.__ui = uiNode;
    return node;
  }

  /** Klänge für Ereignisse in der Lobby (Spiel-Klänge kommen aus den Spielen selbst) */
  function cues(a, b) {
    if (!b) return;
    if (!a || a.code !== b.code) return;
    if (!a.gameId && b.gameId) { PG.Audio.sfx('start'); app.helpOpen = app.settingsOpen = app.profileOpen = false; }
    else if (!a.gameId && !b.gameId && b.players.length > a.players.length) PG.Audio.sfx('join');
  }

  function render() {
    const root = document.getElementById('app');
    let node;
    // Spiele mit eigenem „patch“ (z. B. Zeichenfläche) bauen ihre Oberfläche nicht jedes Mal neu auf,
    // damit Eingabefeld, Tastatur und laufende Striche erhalten bleiben.
    if (app.mode === 'room' && app.view && app.view.gameId) {
      const cur = root.firstChild;
      const G = UI[app.view.gameId];
      if (cur && cur.__gid === app.view.gameId && G && G.patch) {
        const isHost = app.view.me === app.view.host;
        const ctx = { isHost, me: app.view.me, players: app.view.players, send: (m) => send(Object.assign({ t: 'g' }, m)), sendRoom: send, rerender: render };
        if (G.patch(cur.__ui, app.view.game, ctx)) { startTimerLoop(); return; }
      }
    }
    if (app.view) { PG.profs = app.view.players; syncPhotos(); }
    PG.Audio.scene(app.mode === 'room' && app.view && app.view.gameId ? app.view.gameId : 'lobby');
    PG.Audio.setIntensity(mood());
    if (app.view !== app.lastView) { cues(app.lastView, app.view); app.lastView = app.view; }
    const panelOk = app.mode === 'home' || (app.mode === 'room' && app.view && !app.view.gameId);
    if (app.helpOpen && panelOk) {
      node = PG.helpScreen({ onDone: () => { app.helpOpen = false; render(); } });
    } else if (app.settingsOpen && panelOk) {
      node = PG.settingsScreen({ rerender: render, onDone: () => { app.settingsOpen = false; render(); }, onProfile: () => { app.settingsOpen = false; app.profileOpen = true; render(); } });
    } else if (app.profileOpen && (app.mode === 'home' || (app.mode === 'room' && app.view && !app.view.gameId))) {
      const inRoom = app.mode === 'room';
      node = PG.profileScreen({
        name: inRoom ? app.name : (app.draft.name || '').trim() || null,
        rerender: render,
        onDone: () => { app.profileOpen = false; render(); },
        onChange: inRoom ? profileChanged : null,
        onImported: () => { if (!inRoom) app.draft.name = ls.get('pg.name') || app.draft.name; },
      });
    } else if (app.mode === 'home') node = homeScreen();
    else if (app.mode === 'connecting') node = statusScreen('📡', app.statusText || 'Verbinde …');
    else if (app.mode === 'reconnect') node = statusScreen('🔄', 'Verbindung unterbrochen', 'Wir versuchen, dich wieder zu verbinden.');
    else if (!app.view) node = statusScreen('📡', 'Lade den Raum …');
    else node = app.view.gameId ? gameScreen() : lobbyScreen();
    const active = document.activeElement;
    const keepFocus = active && active.id ? active.id : null;
    root.replaceChildren(node);
    if (keepFocus) { const el = document.getElementById(keepFocus); if (el) el.focus(); }
    startTimerLoop();
  }

  /** Wie dicht die Musik gerade sein soll (0 ruhig … 1 voll): mehr Spannung bei Zeitnot oder kurz vor Rundenende */
  function mood() {
    const v = app.view;
    if (!v || !v.gameId || !v.game) return 0.4;
    const g = v.game;
    if (v.gameId === 'cards') {
      if (g.phase !== 'play') return 0.4;
      const few = g.players.some((p) => p.n <= 2);
      return few ? 0.95 : g.pending ? 0.8 : 0.55;
    }
    if (v.gameId === 'quiz' || v.gameId === 'blitz' || v.gameId === 'guess') return g.phase === 'q' ? 0.65 : 0.4;
    if (v.gameId === 'chain') return g.phase === 'work' ? 0.45 : 0.3;
    return 0.5;
  }

  /* Zeitbalken: laufen lokal ab dem Wert, den der Host mitgeschickt hat (keine Uhren-Abgleiche nötig).
     Mit data-tick tickt es in den letzten 5 Sekunden, und die Musik wird dichter. */
  let raf = 0;
  let lastTickSec = -1;
  function startTimerLoop() {
    cancelAnimationFrame(raf);
    const items = [...document.querySelectorAll('.timer[data-remaining]')].map((el) => ({ el, fill: el.firstChild, rem: +el.dataset.remaining, total: Math.max(1, +el.dataset.total), tick: el.hasAttribute('data-tick') }));
    if (!items.length) { lastTickSec = -1; return; }
    const t0 = performance.now();
    const tick = () => {
      const el = performance.now() - t0;
      let live = false;
      for (const it of items) {
        const left = Math.max(0, it.rem - el);
        it.fill.style.transform = 'scaleX(' + (left / it.total) + ')';
        const low = left / it.total < 0.25;
        it.el.classList.toggle('low', low);
        if (left > 0) live = true;
        if (it.tick && left > 0) {
          if (low) PG.Audio.setIntensity(1);
          const sec = Math.ceil(left / 1000);
          if (left <= 5000 && sec !== lastTickSec) { lastTickSec = sec; PG.Audio.sfx('tick'); }
        }
      }
      if (live) raf = requestAnimationFrame(tick);
    };
    tick();
  }

  /* ---------- Start ---------- */

  const params = new URLSearchParams(location.search);
  const preset = (params.get('raum') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, PG.Net.CODE_LEN);
  if (preset) app.draft.code = preset;

  let saved = null;
  try { saved = JSON.parse(ss.get('pg.sess') || 'null'); } catch (e) { saved = null; }
  if (saved && saved.code && saved.name) {
    app.code = saved.code; app.name = saved.name; app.role = 'client';
    reconnect();
  } else render();
})();

</script>
</body>
</html>
