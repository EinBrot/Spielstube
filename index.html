<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f6fb">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Spielstube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1b2140;
  --paper: #f3f6fb;
  --card: #ffffff;
  --muted: #566082;
  --red: #ff5a4d;
  --blue: #3aa0ff;
  --yellow: #ffc83d;
  --mint: #2dbe9a;
  --violet: #6c4dff;
  --ok: #1a8f5f;
  --bad: #c93636;
  --t0: #ff5a4d;
  --t1: #3aa0ff;
  --r: 16px;
  --sh: 0 4px 0 var(--ink);
  --display: 'Unbounded', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html { background: var(--paper); }
/* Hintergrund der ganzen Oberfläche: wählbar in den Einstellungen (Variable --bg), liegt fest hinter allem */
body::before { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: var(--bg, var(--paper) radial-gradient(#d5ddee 1.3px, transparent 1.3px) 0 0 / 20px 20px); }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  color: var(--ink);
  font-family: var(--body);
  font-size: calc(17px * var(--fs, 1));
  line-height: 1.45;
  font-weight: 500;
}
#app { max-width: 560px; margin: 0 auto; padding: 18px 16px 40px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
p { margin: 0; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--violet); outline-offset: 3px; }

/* Bausteine */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 54px; padding: 12px 22px;
  background: var(--yellow); color: var(--ink);
  border: 3px solid var(--ink); border-radius: var(--r);
  box-shadow: var(--sh);
  font-weight: 800; font-size: calc(17px * var(--fs, 1)); cursor: pointer;
  transition: transform 0.06s, box-shadow 0.06s;
  -webkit-tap-highlight-color: transparent;
}
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.alt { background: var(--card); }
.btn.small { min-height: 40px; padding: 6px 14px; font-size: calc(15px * var(--fs, 1)); box-shadow: 0 3px 0 var(--ink); }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; transform: translateY(3px); }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 160px; }
.card { background: var(--card); border: 3px solid var(--ink); border-radius: var(--r); box-shadow: var(--sh); padding: 16px; }
.hint { color: var(--muted); font-size: calc(15px * var(--fs, 1)); }
.hint.small { font-size: calc(13px * var(--fs, 1)); }
.err { background: #ffe3e0; border: 3px solid var(--ink); border-radius: 12px; padding: 10px 14px; font-weight: 700; margin-bottom: 14px; }
.stack > * + * { margin-top: 14px; }

/* Start */
.home .brand { font-size: calc(40px * var(--fs, 1)); margin: 22px 0 6px; }
.home .lead { margin-bottom: 22px; color: var(--muted); }
.field { display: block; margin-bottom: 14px; }
.field > span { display: block; font-weight: 800; font-size: calc(15px * var(--fs, 1)); margin-bottom: 6px; }
.input {
  width: 100%; min-height: 54px; padding: 10px 14px;
  background: var(--card); border: 3px solid var(--ink); border-radius: var(--r);
  font-weight: 700; font-size: calc(18px * var(--fs, 1));
}
.input.code { text-align: center; letter-spacing: 0.35em; text-transform: uppercase; font-family: var(--display); font-size: calc(24px * var(--fs, 1)); }
.or { text-align: center; margin: 18px 0; color: var(--muted); font-weight: 700; }
.foot { margin-top: 26px; font-size: calc(14px * var(--fs, 1)); color: var(--muted); }

/* Raumcode als Buchstabenfliesen */
.codeline { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.tiles { display: flex; gap: 8px; max-width: 100%; }
.tiles span {
  flex: 0 1 56px; min-width: 0; height: 68px; display: grid; place-items: center;
  background: var(--yellow); border: 3px solid var(--ink); border-radius: 12px; box-shadow: var(--sh);
  font-family: var(--display); font-weight: 800; font-size: calc(34px * var(--fs, 1));
}
.tiles span:nth-child(odd) { transform: rotate(-3deg); }
.tiles span:nth-child(even) { transform: rotate(2.5deg); }

/* Lobby */
.section-title { font-size: calc(18px * var(--fs, 1)); margin: 26px 0 10px; }
.players { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.player { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--card); border: 3px solid var(--ink); border-radius: 14px; }
.player.off { opacity: 0.5; }
.avatar { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--ink); background: var(--c); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: calc(15px * var(--fs, 1)); }
.pname { flex: 1; min-width: 0; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pname small { font-weight: 600; color: var(--muted); }
.teamsel { display: flex; gap: 6px; }
.teamsel button {
  min-width: 52px; min-height: 36px; padding: 2px 10px; border: 3px solid var(--ink); border-radius: 10px;
  background: var(--card); font-weight: 800; font-size: calc(14px * var(--fs, 1)); cursor: pointer;
}
.teamsel button[aria-pressed='true'] { background: var(--tc); }
.teamsel button:disabled { cursor: default; opacity: 0.55; }
.kick { background: none; border: 0; font-size: calc(20px * var(--fs, 1)); cursor: pointer; padding: 4px 8px; color: var(--muted); }

.games { display: grid; gap: 10px; }
.gamecard { text-align: left; display: flex; gap: 12px; align-items: center; padding: 12px 14px; background: var(--card); border: 3px solid var(--ink); border-radius: var(--r); cursor: pointer; width: 100%; }
.gamecard[aria-pressed='true'] { background: var(--yellow); box-shadow: var(--sh); }
.gamecard:disabled { cursor: default; opacity: 0.6; }
.gamecard .ge { font-size: calc(32px * var(--fs, 1)); flex: none; }
.gamecard b { display: block; font-family: var(--display); font-size: calc(16px * var(--fs, 1)); margin-bottom: 2px; }
.gamecard span.t { font-size: calc(14px * var(--fs, 1)); color: var(--muted); }
.gamecard[aria-pressed='true'] span.t { color: var(--ink); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.seg > b { font-size: calc(14px * var(--fs, 1)); margin-right: 4px; }
.seg button { min-height: 38px; min-width: 44px; padding: 2px 12px; border: 3px solid var(--ink); border-radius: 10px; background: var(--card); font-weight: 800; cursor: pointer; }
.seg button[aria-pressed='true'] { background: var(--ink); color: #fff; }
.startbar { margin-top: 22px; }
.startbar .hint { margin-top: 8px; text-align: center; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.topbar .mini { font-family: var(--display); font-weight: 800; font-size: calc(14px * var(--fs, 1)); letter-spacing: 0.12em; }

/* Quiz */
.scorebar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.tscore { background: var(--card); border: 3px solid var(--ink); border-radius: 14px; padding: 8px 10px; border-top: 10px solid var(--tc); }
.tscore.mine { box-shadow: var(--sh); }
.tscore b { display: block; font-size: calc(14px * var(--fs, 1)); margin-bottom: 4px; }
.pips { display: flex; gap: 4px; }
.pips i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink); background: #fff; }
.pips i.on { background: var(--tc); }

.stage { display: grid; gap: 14px; }
.kicker { font-weight: 800; color: var(--muted); }
.bigemoji { font-size: calc(84px * var(--fs, 1)); line-height: 1; text-align: center; }
.cattitle { font-size: calc(28px * var(--fs, 1)); text-align: center; color: var(--tc, var(--ink)); }
.stage > .hint { text-align: center; }
.qhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.chip { background: var(--card); border: 3px solid var(--ink); border-radius: 99px; padding: 4px 12px; font-weight: 800; font-size: calc(15px * var(--fs, 1)); }
.dots { display: flex; gap: 6px; }
.dots i { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--ink); background: #fff; }
.dots i.done { background: var(--ink); }
.dots i.now { background: var(--yellow); }
.timer { height: 14px; border: 3px solid var(--ink); border-radius: 99px; background: #fff; overflow: hidden; }
.timer i { display: block; height: 100%; width: 100%; background: var(--yellow); transform-origin: left; }
.timer.low i { background: var(--red); }
.qtext { font-size: calc(21px * var(--fs, 1)); line-height: 1.3; font-family: var(--body); font-weight: 800; letter-spacing: 0; }

.opts { display: grid; gap: 10px; }
.opt {
  position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; text-align: left;
  width: 100%; min-height: 60px; padding: 10px 14px;
  background: var(--card); border: 3px solid var(--ink); border-radius: var(--r); box-shadow: var(--sh);
  font-weight: 800; font-size: calc(17px * var(--fs, 1)); cursor: pointer;
}
.opt:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.opt .shape { flex: none; width: 34px; height: 34px; display: grid; place-items: center; background: var(--oc); border: 3px solid var(--ink); border-radius: 10px; font-size: calc(14px * var(--fs, 1)); }
.opt .ot { flex: 1; min-width: 0; }
.opt .tick { font-weight: 800; font-size: calc(20px * var(--fs, 1)); }
.opt.sel { background: var(--ink); color: #fff; }
.opt.dim { opacity: 0.5; box-shadow: none; }
.opt:disabled { cursor: default; }
.opt.res { cursor: default; box-shadow: none; }
.opt.res.right { background: #d4f4e6; }
.opt.res.wrong { background: #ffe3e0; }
.opt .picks, .opt .voters { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px; padding-left: 44px; }
.picks em { font-style: normal; font-size: calc(13px * var(--fs, 1)); background: var(--tc); border: 2px solid var(--ink); border-radius: 99px; padding: 0 8px; }
.voters u { text-decoration: none; font-size: calc(13px * var(--fs, 1)); font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
.voters u::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--vc); border: 2px solid var(--ink); }

.mates { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.mate { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border: 2px solid var(--ink); border-radius: 99px; padding: 2px 10px; font-size: calc(14px * var(--fs, 1)); font-weight: 700; opacity: 0.7; }
.mate.done { opacity: 1; background: #d4f4e6; }
.mate i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--ink); }
.teamres { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.teamres li { border-left: 8px solid var(--tc); padding: 2px 0 2px 10px; font-size: calc(15px * var(--fs, 1)); }

.qgrid { display: grid; grid-template-columns: repeat(var(--cols, 4), 1fr); gap: 6px; }
.qtile { position: relative; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 3px; text-align: center; background: var(--card); border: 3px solid var(--ink); border-radius: 12px; overflow: hidden; }
.qtile .e { font-size: calc(24px * var(--fs, 1)); line-height: 1; }
.qtile .n { font-size: calc(10px * var(--fs, 1)); font-weight: 800; line-height: 1.1; overflow-wrap: anywhere; }
.qtile .mark { position: absolute; top: 1px; right: 5px; font-weight: 800; font-size: calc(14px * var(--fs, 1)); }
.qtile.o0 { background: var(--t0); }
.qtile.o1 { background: var(--t1); }
.qtile.od { background: repeating-linear-gradient(45deg, #e3e8f3, #e3e8f3 6px, #f6f8fc 6px, #f6f8fc 12px); }
.qtile.cur { outline: 4px solid var(--violet); outline-offset: 2px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 99px; font-weight: 700; z-index: 10; max-width: 90vw; }
.status { text-align: center; padding: 60px 10px; }
.status .bigemoji { margin-bottom: 14px; }

@media (min-width: 560px) {
  .qtile .e { font-size: calc(30px * var(--fs, 1)); }
  .qtile .n { font-size: calc(12px * var(--fs, 1)); }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

.botrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.botrow > b { font-size: calc(14px * var(--fs, 1)); margin-right: 4px; }
.player { min-width: 0; }
.teamsel { flex: none; }
.teamsel button { min-width: 46px; padding: 2px 8px; }
.pname { flex: 1 1 0; }

/* ===== Farbwirbel (Kartenspiel) ===== */

.cards, .skinprev {
  --c0: #ff5a4d; --c1: #3aa0ff; --c2: #2fbf5b; --c3: #ffc83d;
  --cw: 58px; --ch: 88px;
}
.cards[data-side='1'], .skinprev[data-side='1'] { --c0: #ff4fa3; --c1: #19c6d1; --c2: #ff8a1f; --c3: #8b5cf6; }
[data-table-skin='filz'] { --tbl: radial-gradient(ellipse at 50% 40%, #2a9461 0%, #176b43 62%, #0f4d31 100%); --tbl-fg: #fff; }
[data-table-skin='nacht'] {
  --tbl: radial-gradient(1.5px 1.5px at 18% 22%, #fff 99%, transparent), radial-gradient(1.5px 1.5px at 72% 14%, #fff 99%, transparent), radial-gradient(1px 1px at 40% 70%, #fff 99%, transparent),
    radial-gradient(1.5px 1.5px at 88% 62%, #fff 99%, transparent), radial-gradient(1px 1px at 8% 80%, #fff 99%, transparent), radial-gradient(ellipse at 50% 0%, #2c3380 0%, #131645 55%, #0a0b26 100%);
  --tbl-fg: #fff;
}
[data-table-skin='holz'] { --tbl: repeating-linear-gradient(92deg, #a6713f 0 22px, #98653a 22px 24px, #b07a46 24px 52px, #8f5e34 52px 54px); --tbl-fg: #fff; }
[data-table-skin='sonne'] { --tbl: linear-gradient(160deg, #ffb36b 0%, #ff5fa2 48%, #6c4dff 100%); --tbl-fg: #fff; }

/* ---------- Karten ---------- */
.pc {
  --cc: var(--c0);
  position: relative; flex: none; display: block;
  width: var(--cw); height: var(--ch); padding: 0; margin: 0;
  border-radius: 11px; font-family: var(--display); font-weight: 800; color: var(--ink);
  user-select: none; -webkit-tap-highlight-color: transparent; text-align: center;
}
.pc.c0 { --cc: var(--c0); } .pc.c1 { --cc: var(--c1); } .pc.c2 { --cc: var(--c2); } .pc.c3 { --cc: var(--c3); }
.pc.cw { --cc: #20243f; --wild: conic-gradient(from 45deg, var(--c0) 0 25%, var(--c1) 0 50%, var(--c2) 0 75%, var(--c3) 0); }
.pc .ct { position: absolute; top: 5px; left: 7px; font-size: 12px; line-height: 1; z-index: 2; }
.pc .sh { position: absolute; right: 7px; top: 5px; font-style: normal; font-size: 10px; line-height: 1; z-index: 2; }
.pc .cm { position: absolute; inset: 0; display: grid; place-items: center; font-size: 34px; line-height: 1; z-index: 2; }
.pc .cm.u { text-decoration: underline; text-underline-offset: 4px; }
.pc.em .cm { font-size: 31px; padding-bottom: 8px; }
.pc.smx .cm { font-size: 16px; -webkit-text-stroke-width: 3px; }
.pc .cl { position: absolute; left: 0; right: 0; bottom: 5px; font-size: 8px; line-height: 1; text-transform: uppercase; letter-spacing: 0.03em; z-index: 2; }
.pc::before { content: ''; position: absolute; pointer-events: none; }

button.pc { cursor: pointer; font: inherit; font-family: var(--display); font-weight: 800; }
button.pc:disabled { cursor: default; }

/* Klassisch */
[data-card-skin='klar'] .pc:not(.back) { background: var(--cc); border: 3px solid #fff; box-shadow: 0 0 0 2px var(--ink), 0 4px 0 2px var(--ink); }
[data-card-skin='klar'] .pc.cw:not(.back) { background: #20243f; }
[data-card-skin='klar'] .pc:not(.back)::before { inset: 16% 6%; border-radius: 50%; background: #fff; transform: rotate(-24deg); }
[data-card-skin='klar'] .pc.cw:not(.back)::before { background: var(--wild); border: 3px solid #fff; }
[data-card-skin='klar'] .pc .ct, [data-card-skin='klar'] .pc .sh, [data-card-skin='klar'] .pc .cl { color: #fff; text-shadow: 0 1px 0 rgba(0, 0, 0, 0.35); }
[data-card-skin='klar'] .pc .cm { color: var(--cc); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; }
[data-card-skin='klar'] .pc.cw .cm { color: #fff; }
[data-card-skin='klar'] .pc.em .cm { -webkit-text-stroke: 0; }

/* Neon */
[data-card-skin='neon'] .pc:not(.back) { background: #12142b; border: 2px solid var(--cc); box-shadow: 0 0 12px var(--cc), inset 0 0 16px color-mix(in srgb, var(--cc) 40%, transparent); }
[data-card-skin='neon'] .pc.cw:not(.back) { border-color: #fff; box-shadow: 0 0 10px var(--c0), 0 0 12px var(--c1), inset 0 0 14px var(--c2), inset 0 0 22px var(--c3); }
[data-card-skin='neon'] .pc .cm { color: var(--cc); text-shadow: 0 0 10px var(--cc), 0 0 22px var(--cc); }
[data-card-skin='neon'] .pc.cw .cm { color: #fff; text-shadow: 0 0 8px #fff, 0 0 18px var(--c1); }
[data-card-skin='neon'] .pc .ct, [data-card-skin='neon'] .pc .sh, [data-card-skin='neon'] .pc .cl { color: #fff; opacity: 0.9; }
[data-card-skin='neon'] .pc.cw:not(.back)::before { inset: 22% 14%; border-radius: 50%; background: var(--wild); opacity: 0.35; filter: blur(5px); }

/* Papier */
[data-card-skin='papier'] .pc:not(.back) { background: #fff7e6; border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); border-radius: 8px; }
[data-card-skin='papier'] .pc:not(.back)::before { inset: 0; border-radius: 4px; background: linear-gradient(135deg, var(--cc) 0 36%, transparent 36%); }
[data-card-skin='papier'] .pc.cw:not(.back)::before { background: var(--wild); opacity: 0.9; clip-path: polygon(0 0, 100% 0, 100% 30%, 0 30%); }
[data-card-skin='papier'] .pc .ct { color: #fff; text-shadow: 1px 1px 0 var(--ink); }
[data-card-skin='papier'] .pc .sh { color: var(--ink); }
[data-card-skin='papier'] .pc .cm { color: var(--cc); text-shadow: 2px 2px 0 var(--ink); }
[data-card-skin='papier'] .pc.cw .cm { color: var(--ink); text-shadow: none; padding-top: 10px; }
[data-card-skin='papier'] .pc .cl { color: var(--ink); }

/* Glas */
[data-card-skin='glas'] .pc:not(.back) { background: linear-gradient(150deg, color-mix(in srgb, var(--cc) 70%, #fff) 0%, var(--cc) 45%, color-mix(in srgb, var(--cc) 70%, #000) 100%); border: 1.5px solid rgba(255, 255, 255, 0.75); box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.9); }
[data-card-skin='glas'] .pc.cw:not(.back) { background: var(--wild); }
[data-card-skin='glas'] .pc:not(.back)::before { inset: 0; border-radius: inherit; background: linear-gradient(158deg, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0.08) 46%, transparent 47%); }
[data-card-skin='glas'] .pc .cm, [data-card-skin='glas'] .pc .ct, [data-card-skin='glas'] .pc .sh, [data-card-skin='glas'] .pc .cl { color: #fff; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5); }

/* Rückseite */
.pc.back { background: radial-gradient(circle at 50% 45%, #5a45c9 0%, #2a2468 55%, #181a45 100%); border: 3px solid #fff; box-shadow: 0 0 0 2px var(--ink), 0 4px 0 2px var(--ink); }
.pc.back .bm { position: absolute; inset: 0; display: grid; place-items: center; font-size: 30px; color: var(--c3); text-shadow: 0 0 10px rgba(255, 200, 61, 0.6); }
[data-card-skin='papier'] .pc.back { border-radius: 8px; box-shadow: 4px 4px 0 var(--ink); border-color: var(--ink); }
[data-card-skin='neon'] .pc.back { background: #12142b; border: 2px solid #8b5cf6; box-shadow: 0 0 12px #8b5cf6; }

/* ---------- Kopf, Tisch ---------- */
.cards { display: block; }
.cards .chead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.ctable, .skinprev { background: var(--tbl); color: var(--tbl-fg); }
.ctable { position: relative; border: 3px solid var(--ink); border-radius: 22px; box-shadow: var(--sh); padding: 12px 10px 12px; overflow: hidden; transform-origin: 50% 60%; }
.ctable::before { content: ''; position: absolute; inset: 0; background: rgba(24, 0, 60, 0); transition: background 0.6s; pointer-events: none; }
.cards[data-side='1'] .ctable::before { background: rgba(24, 0, 60, 0.42); }
.ctable > * { position: relative; z-index: 1; }

.opps { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; min-height: 8px; }
.opp { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 6px; background: #fff; color: var(--ink); border: 3px solid var(--ink); border-radius: 14px; padding: 4px 8px 4px 5px; font-size: calc(13px * var(--fs, 1)); font-weight: 800; min-width: 112px; max-width: 150px; }
.opp .avatar { width: 28px; height: 28px; font-size: calc(12px * var(--fs, 1)); border-width: 2px; }
.opp .on { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opp .osc { grid-column: 1 / -1; font-size: calc(11px * var(--fs, 1)); color: var(--muted); font-weight: 700; margin-top: -2px; }
.cnt { display: inline-flex; align-items: center; gap: 3px; background: var(--ink); color: #fff; border-radius: 99px; padding: 0 8px; font-size: calc(13px * var(--fs, 1)); min-height: 22px; }
.cnt em { font-style: normal; font-size: calc(12px * var(--fs, 1)); }
.opp.turn { box-shadow: 0 0 0 4px var(--c3), 0 0 18px var(--c3); animation: glow 1.4s ease-in-out infinite; }
.opp.one { border-color: var(--c0); }
.opp.one .cnt { background: var(--c0); }
.opp.off { opacity: 0.5; }

.cmid { display: flex; align-items: center; justify-content: center; gap: 34px; margin: 18px 0 20px; }
.cards .cmid { --cw: 78px; --ch: 118px; }
.pile { position: relative; width: var(--cw); height: var(--ch); background: none; border: 0; padding: 0; cursor: default; }
.pile .pc { position: absolute; left: 0; top: 0; }
.pile .b1 { transform: translate(0, 0); } .pile .b2 { transform: translate(2px, -2px); } .pile .b3 { transform: translate(4px, -4px); }
.pile .pl { position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%); z-index: 3; background: #fff; color: var(--ink); border: 3px solid var(--ink); border-radius: 99px; padding: 0 10px; font-size: calc(12px * var(--fs, 1)); font-weight: 800; white-space: nowrap; }
.pile.can { cursor: pointer; animation: nudge 1.6s ease-in-out infinite; }
.pile.can .pl { background: var(--c3); }
.pile:disabled { opacity: 1; }

.ring { --cc: var(--c0); position: relative; width: 132px; height: 132px; border-radius: 50%; display: grid; place-items: center; border: 6px solid var(--cc); background: color-mix(in srgb, var(--cc) 30%, rgba(255, 255, 255, 0.12)); box-shadow: 0 0 26px var(--cc); transition: border-color 0.45s, background 0.45s, box-shadow 0.45s; }
.ring .pc.top { transform: rotate(-6deg); }
.dirmark { position: absolute; top: -12px; right: -14px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: var(--ink); border: 3px solid var(--ink); font-size: calc(20px * var(--fs, 1)); line-height: 1; }
.dirmark.cw { animation: spin 5s linear infinite; } .dirmark.ccw { animation: spin 5s linear infinite reverse; }
.colname { position: absolute; left: 50%; bottom: -16px; transform: translateX(-50%); background: var(--cc); color: var(--ink); border: 3px solid var(--ink); border-radius: 99px; padding: 0 10px; font-size: calc(12px * var(--fs, 1)); font-weight: 800; white-space: nowrap; transition: background 0.45s; }
.cards[data-side='1'] .colname { color: #fff; }

.pend { width: max-content; margin: 0 auto 8px; background: #e8352b; color: #fff; border: 3px solid var(--ink); border-radius: 99px; padding: 2px 16px; font-family: var(--display); font-weight: 800; animation: pendpulse 0.9s ease-in-out infinite; }
.ticker { background: rgba(0, 0, 0, 0.3); border-radius: 12px; padding: 6px 10px; font-size: calc(13px * var(--fs, 1)); min-height: 22px; text-align: center; }
.ticker p { opacity: 0.65; }
.ticker p.new { opacity: 1; font-weight: 800; }

/* ---------- Mein Platz ---------- */
.cme { margin-top: 14px; }
.mybar { display: grid; gap: 6px; }
.mstat { font-family: var(--display); font-size: calc(14px * var(--fs, 1)); padding: 6px 12px; border: 3px solid var(--ink); border-radius: 12px; background: #fff; text-align: center; }
.cme.mine .mstat { background: var(--c3); animation: pendpulse 1.6s ease-in-out infinite; }
.cme .timer { height: 12px; }
.timer.win i { background: #e8352b; }
.cactions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.cactions .btn { flex: 1 1 140px; min-height: 48px; }
.btn.call { background: var(--c3); }
.btn.catch { background: #e8352b; color: #fff; }
.btn.brake { background: #e8352b; color: #fff; animation: pendpulse 0.6s ease-in-out infinite; }
.hand { display: flex; flex-wrap: wrap; justify-content: center; padding: 22px 12px 4px; }
.hand .pc { margin: 0 -7px 8px; transition: transform 0.15s; }
.hand.n11, .hand.n12, .hand.n13, .hand.n14, .hand.n15, .hand.n16, .hand.n17, .hand.n18, .hand.n19, .hand.n20 { --cw: 56px; --ch: 84px; }
.hand.n11 .pc, .hand.n12 .pc, .hand.n13 .pc, .hand.n14 .pc, .hand.n15 .pc, .hand.n16 .pc, .hand.n17 .pc, .hand.n18 .pc, .hand.n19 .pc, .hand.n20 .pc { margin: 0 -10px 8px; }
.hc.ok { transform: translateY(-12px); }
.hc.ok:hover, .hc.ok:focus-visible { transform: translateY(-20px); z-index: 4; }
.hc.no { filter: saturate(0.55) brightness(0.82); }
.hc.drew { outline: 3px solid var(--c3); outline-offset: 2px; }

/* ---------- Auswahl-Fenster ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.backdrop { position: absolute; inset: 0; background: rgba(14, 18, 44, 0.58); }
.sheet { position: relative; width: min(560px, 100%); max-height: 88vh; overflow: auto; background: #fff; color: var(--ink); border: 3px solid var(--ink); border-bottom: 0; border-radius: 22px 22px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); display: grid; gap: 12px; }
.sheet h3 { font-size: calc(18px * var(--fs, 1)); }
.sheet h4 { font-family: var(--display); font-size: calc(15px * var(--fs, 1)); margin-top: 6px; }
.colors { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cbtn { min-height: 66px; border: 3px solid var(--ink); border-radius: 14px; font-weight: 800; font-size: calc(18px * var(--fs, 1)); color: var(--ink); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 3px 0 var(--ink); }
.cbtn.c0 { background: var(--c0); } .cbtn.c1 { background: var(--c1); } .cbtn.c2 { background: var(--c2); } .cbtn.c3 { background: var(--c3); }
.cards[data-side='1'] .cbtn.c3 { color: #fff; }
.cbtn:active { transform: translateY(3px); box-shadow: none; }
.targets { display: grid; gap: 8px; }
.tbtn { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 6px 12px; border: 3px solid var(--ink); border-radius: 14px; background: #fff; cursor: pointer; text-align: left; }
.tbtn b { flex: 1; }
.rules { margin: 0; padding-left: 20px; display: grid; gap: 8px; font-size: calc(15px * var(--fs, 1)); }
.rules.sp { list-style: none; padding: 0; }
.rules.sp li { display: flex; gap: 10px; }
.rules .te { font-size: calc(22px * var(--fs, 1)); flex: none; width: 28px; text-align: center; }

/* ---------- Designwahl, Lobby ---------- */
.skinbox { display: grid; gap: 6px; }
.skinprev { position: relative; height: 150px; border: 3px solid var(--ink); border-radius: 16px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 4px; }
.skinprev .pc { --cw: 56px; --ch: 84px; margin: 0 -8px; }
.skinprev .f1 { transform: rotate(-16deg) translateY(4px); } .skinprev .f2 { transform: rotate(-5deg); } .skinprev .f3 { transform: rotate(6deg); } .skinprev .f4 { transform: rotate(17deg) translateY(4px); }
.skinseg { margin-top: 0; }
.cset .sub { font-family: var(--display); font-size: calc(14px * var(--fs, 1)); margin-top: 16px; }
.cset .subrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.trow { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 0; background: none; border: 0; border-top: 2px dashed #d5ddee; cursor: pointer; }
.trow:disabled { cursor: default; }
.trow .te { flex: none; width: 30px; text-align: center; font-size: calc(24px * var(--fs, 1)); }
.trow .tx { flex: 1; min-width: 0; }
.trow .tx b { display: block; font-size: calc(16px * var(--fs, 1)); }
.trow .tx small { display: block; color: var(--muted); font-size: calc(13px * var(--fs, 1)); line-height: 1.3; font-weight: 500; }
.sw { flex: none; position: relative; width: 48px; height: 28px; border: 3px solid var(--ink); border-radius: 99px; background: #fff; transition: background 0.2s; }
.sw i { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); transition: transform 0.2s; }
.trow[aria-checked='true'] .sw { background: var(--mint); }
.trow[aria-checked='true'] .sw i { transform: translateX(20px); }

/* ---------- Ergebnis ---------- */
.rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.rank li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: #fff; border: 3px solid var(--ink); border-radius: 14px; }
.rank li.win { background: var(--yellow); box-shadow: var(--sh); }
.rank .pos { flex: none; width: 26px; font-family: var(--display); font-weight: 800; text-align: center; }
.rank .rn { flex: 1; min-width: 0; }
.rank .rn b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .rn small { color: var(--muted); font-weight: 600; font-size: calc(13px * var(--fs, 1)); }
.rank li.win .rn small { color: var(--ink); }
.rank .pt { font-family: var(--display); font-weight: 800; }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 30; }
.confetti i { position: absolute; top: -24px; border-radius: 2px; }

/* ---------- Effekt-Einblendungen ---------- */
.splash { position: fixed; left: 50%; top: 34%; transform: translate(-50%, -50%); z-index: 40; pointer-events: none; text-align: center; background: #fff; color: var(--ink); border: 3px solid var(--ink); border-radius: 22px; box-shadow: var(--sh); padding: 12px 22px; max-width: 86vw; animation: splashin 1.8s ease both; }
.splash .se { display: block; font-size: calc(56px * var(--fs, 1)); line-height: 1.1; }
.splash .st { font-family: var(--display); font-size: calc(14px * var(--fs, 1)); }
.splash-red { background: #ffe3e0; } .splash-violet { background: #e7defe; } .splash-gold { background: #fff1b8; }

/* ---------- Bewegung ---------- */
@keyframes dealin { from { opacity: 0; transform: translateY(90px) rotate(14deg) scale(0.55); } to { opacity: 1; transform: none; } }
@keyframes landme { from { transform: translateY(170px) scale(0.7) rotate(-32deg); opacity: 0.4; } to { transform: rotate(-6deg); opacity: 1; } }
@keyframes landopp { from { transform: translateY(-170px) scale(0.7) rotate(40deg); opacity: 0.4; } to { transform: rotate(-6deg); opacity: 1; } }
@keyframes bump { 0% { transform: scale(1.7); } 100% { transform: scale(1); } }
@keyframes turnpop { 0% { transform: scale(0.9); } 60% { transform: scale(1.1); } 100% { transform: scale(1); } }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 4px var(--c3), 0 0 10px var(--c3); } 50% { box-shadow: 0 0 0 4px var(--c3), 0 0 24px var(--c3); } }
@keyframes pendpulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
@keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes flipturn { 0% { transform: perspective(900px) rotateY(-90deg) scale(0.92); filter: brightness(2); } 100% { transform: perspective(900px) rotateY(0) scale(1); filter: none; } }
@keyframes sheetin { from { transform: translateY(60px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes confall { from { transform: translateY(0) translateX(0) rotate(0); opacity: 1; } to { transform: translateY(112vh) translateX(var(--dx)) rotate(var(--rot)); opacity: 0.9; } }
@keyframes splashin {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
  12% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
  20% { transform: translate(-50%, -50%) scale(1); }
  78% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -66%) scale(0.95); }
}

/* Meme: Sticker mit Emoji und Bildunterschrift */
[data-card-skin='meme'] .pc:not(.back) { background-color: #fff; background-image: radial-gradient(var(--cc) 24%, transparent 26%); background-size: 9px 9px; border: 3px solid var(--ink); border-radius: 10px; box-shadow: 3px 3px 0 var(--ink); overflow: hidden; }
[data-card-skin='meme'] .pc.cw:not(.back) { background-image: var(--wild); background-size: auto; }
[data-card-skin='meme'] .pc .ct { top: 3px; left: 5px; font-size: 17px; color: #fff; -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; z-index: 3; }
[data-card-skin='meme'] .pc .sh { color: var(--ink); top: 4px; right: 5px; font-size: 11px; z-index: 3; }
[data-card-skin='meme'] .pc .cm { font-size: 34px; padding-bottom: 12px; }
[data-card-skin='meme'] .pc .cm.me { filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.35)); }
[data-card-skin='meme'] .pc .cl { font-family: Impact, 'Arial Black', 'Haettenschweiler', sans-serif; font-size: 10px; letter-spacing: 0.02em; color: #fff; -webkit-text-stroke: 3px #000; paint-order: stroke fill; bottom: 3px; }
[data-card-skin='meme'] .pc.em .cm { font-size: 30px; }
[data-card-skin='meme'] .pc.back { background: #fff; background-image: radial-gradient(#6c4dff 24%, transparent 26%); background-size: 9px 9px; border: 3px solid var(--ink); border-radius: 10px; box-shadow: 3px 3px 0 var(--ink); }

/* Retro: 8-Bit-Pixelkarten */
[data-card-skin='retro'] .pc:not(.back) { background: var(--cc); border: 4px solid #0b0b14; border-radius: 0; box-shadow: inset -4px -4px 0 rgba(0, 0, 0, 0.28), inset 4px 4px 0 rgba(255, 255, 255, 0.28); font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
[data-card-skin='retro'] .pc.cw:not(.back) { background: var(--wild); }
[data-card-skin='retro'] .pc .cm, [data-card-skin='retro'] .pc .ct, [data-card-skin='retro'] .pc .sh, [data-card-skin='retro'] .pc .cl { color: #fff; text-shadow: 2px 2px 0 #0b0b14; font-family: inherit; }
[data-card-skin='retro'] .pc .cm { font-size: 36px; }
[data-card-skin='retro'] .pc .cm.u { text-underline-offset: 3px; }
[data-card-skin='retro'] .pc.back { background: repeating-conic-gradient(#2a2468 0 25%, #181a45 0 50%) 0 0 / 12px 12px; border: 4px solid #0b0b14; border-radius: 0; box-shadow: inset 3px 3px 0 rgba(255, 255, 255, 0.25); }

/* Dunkel: ruhig, dunkle Karten mit farbiger Linie */
[data-card-skin='dunkel'] .pc:not(.back) { background: #14161f; border: 2px solid var(--cc); border-radius: 12px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.45); }
[data-card-skin='dunkel'] .pc.cw:not(.back) { border: 2px solid transparent; background: linear-gradient(#14161f, #14161f) padding-box, var(--wild) border-box; }
[data-card-skin='dunkel'] .pc .cm { color: var(--cc); }
[data-card-skin='dunkel'] .pc.cw .cm { color: #fff; }
[data-card-skin='dunkel'] .pc .ct, [data-card-skin='dunkel'] .pc .sh, [data-card-skin='dunkel'] .pc .cl { color: #d8dcf0; }
[data-card-skin='dunkel'] .pc.back { background: #14161f; border: 2px solid #4a4f70; border-radius: 12px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.45); }

/* Weitere Tische */
[data-table-skin='weltall'] {
  --tbl: radial-gradient(2px 2px at 12% 30%, #fff 99%, transparent), radial-gradient(1.5px 1.5px at 33% 82%, #ffe9a8 99%, transparent), radial-gradient(2px 2px at 61% 18%, #fff 99%, transparent), radial-gradient(1.5px 1.5px at 84% 70%, #bfe6ff 99%, transparent),
    radial-gradient(1px 1px at 47% 52%, #fff 99%, transparent), radial-gradient(1px 1px at 92% 12%, #fff 99%, transparent), radial-gradient(circle at 80% 85%, rgba(255, 90, 160, 0.35) 0, transparent 38%), radial-gradient(circle at 15% 15%, rgba(80, 120, 255, 0.4) 0, transparent 42%), linear-gradient(#070818, #120b2e);
  --tbl-fg: #fff;
}
[data-table-skin='gitter'] { --tbl: linear-gradient(rgba(255, 70, 200, 0.35) 1px, transparent 1px) 0 0 / 28px 28px, linear-gradient(90deg, rgba(40, 220, 255, 0.35) 1px, transparent 1px) 0 0 / 28px 28px, linear-gradient(#1a0b3a, #2b0f55); --tbl-fg: #fff; }
[data-table-skin='kreide'] { --tbl: repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.04) 0 3px, transparent 3px 9px), radial-gradient(ellipse at 50% 40%, #3b5a49 0%, #2a4033 100%); --tbl-fg: #f4f1e6; }


/* ---------- Sonderkarten: Effekte ---------- */
.cfx { position: fixed; inset: 0; z-index: 38; pointer-events: none; overflow: hidden; }
.cfx > i { position: absolute; font-style: normal; display: block; }
.cfx .fl { inset: 0; opacity: 0; background: #fff; animation: fxflash 0.9s ease-out both; }
.cfx .fl.soft { background: radial-gradient(circle at 50% 38%, #fff6c9, transparent 65%); animation-duration: 1.2s; animation-delay: 0.3s; }
.cfx .fl.yel { background: radial-gradient(circle at 50% 40%, #ffe27a, transparent 70%); }
.cfx .fl.vio { background: radial-gradient(circle at 50% 40%, #b79cff, transparent 70%); }
.cfx .pt { left: 50%; top: 38%; font-size: 26px; opacity: 0; animation: fxfly 1.1s ease-out both; }
@keyframes fxflash { 0% { opacity: 0; } 10% { opacity: 0.75; } 100% { opacity: 0; } }
@keyframes fxfly { 0% { opacity: 1; transform: translate(-50%, -50%) scale(0.4); } 100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.3) rotate(var(--rot)); } }

/* Bombe: Zündschnur, Knall, Druckwelle */
.cfx-bomb .fuse { left: 50%; top: 38%; font-size: 52px; transform: translate(-50%, -50%); animation: fusebob 0.45s linear both; }
.cfx-bomb .fl { background: radial-gradient(circle at 50% 38%, #fff7c2, #ff9b2f 38%, transparent 70%); animation: fxflash 1s 0.45s ease-out both; }
.cfx-bomb .ring { left: 50%; top: 38%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border: 7px solid #ff9b2f; border-radius: 50%; opacity: 0; animation: ringout 0.9s 0.45s ease-out both; }
@keyframes fusebob { 0% { transform: translate(-50%, -50%) scale(0.8) rotate(-8deg); } 25% { transform: translate(-50%, -50%) scale(1) rotate(8deg); } 50% { transform: translate(-50%, -50%) scale(1.1) rotate(-8deg); } 75% { transform: translate(-50%, -50%) scale(1.2) rotate(8deg); } 100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; } }
@keyframes ringout { 0% { opacity: 1; transform: scale(0.4); } 100% { opacity: 0; transform: scale(14); } }
@keyframes shakeit { 0%, 100% { transform: none; } 15% { transform: translate(-7px, 4px); } 30% { transform: translate(6px, -5px); } 45% { transform: translate(-5px, -3px); } 60% { transform: translate(5px, 4px); } 80% { transform: translate(-2px, 2px); } }
body.shake #app { animation: shakeit 0.5s ease-in-out; }

/* Tausch: zwei Karten kreuzen sich */
.cfx-swap .a, .cfx-swap .b { left: 0; font-size: 58px; }
.cfx-swap .a { top: 26%; animation: swapa 1.4s ease-in-out both; }
.cfx-swap .b { top: 42%; animation: swapb 1.4s ease-in-out both; }
@keyframes swapa { 0% { transform: translate(-90px, 0) rotate(-20deg); } 50% { transform: translate(45vw, -50px) rotate(10deg) scale(1.25); } 100% { transform: translate(108vw, 0) rotate(30deg); } }
@keyframes swapb { 0% { transform: translate(108vw, 30px) rotate(20deg); } 50% { transform: translate(45vw, 60px) rotate(-10deg) scale(1.25); } 100% { transform: translate(-90px, 30px) rotate(-30deg); } }

/* Welle: drei Wasserschichten steigen und sinken */
.cfx-wave .w { left: -20%; width: 140%; height: 75%; top: 100%; border-radius: 50% 50% 0 0 / 12% 12% 0 0; animation: waverise 1.8s ease-in-out both; }
.cfx-wave .w1 { background: rgba(58, 160, 255, 0.5); }
.cfx-wave .w2 { background: rgba(25, 198, 209, 0.45); animation-delay: 0.12s; }
.cfx-wave .w3 { background: rgba(108, 77, 255, 0.35); animation-delay: 0.24s; }
@keyframes waverise { 0% { transform: translate(-6%, 0); } 45% { transform: translate(5%, -96%); } 100% { transform: translate(-6%, 0); } }

/* Spiegel: Lichtglanz läuft über den Bildschirm, das Hinweisfeld dreht sich */
.cfx-mirror .shn { top: 0; bottom: 0; left: -60%; width: 40%; background: linear-gradient(100deg, transparent 0, rgba(255, 255, 255, 0.9) 50%, transparent 100%); transform: skewX(-18deg); animation: shinesweep 1s ease-in-out both; }
.cfx-mirror .shn.s2 { width: 18%; animation-delay: 0.3s; }
@keyframes shinesweep { 0% { left: -60%; } 100% { left: 120%; } }
.splash.k-mirror { animation: splashin 1.8s ease both, mirrorflip 0.8s ease-out both; }
@keyframes mirrorflip { 0% { rotate: y 180deg; } 100% { rotate: y 0deg; } }

/* Doppelzug */
.cfx-double .x2 { left: 50%; top: 62%; font-family: var(--display); font-weight: 800; font-size: 110px; color: #ffc83d; -webkit-text-stroke: 5px #1b2140; paint-order: stroke fill; transform: translate(-50%, -50%); opacity: 0; animation: x2pulse 1.5s ease-out both; }
@keyframes x2pulse { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.2); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.5); } 30% { transform: translate(-50%, -50%) scale(1); } 45% { transform: translate(-50%, -50%) scale(1.6); } 65% { transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(2.2); } }

/* Dieb */
.cfx-thief .nj { top: 56%; left: 0; font-size: 64px; animation: ninja 1.05s ease-in both; }
.cfx-thief .tr { top: 58%; left: 0; font-size: 34px; opacity: 0; animation: ninja 1.05s ease-in both; }
.cfx-thief .tr.t1 { animation-delay: 0.08s; } .cfx-thief .tr.t2 { animation-delay: 0.16s; }
.cfx-thief .tr { animation-name: ninjatrail; }
.cfx-thief .cd { left: 50%; top: 56%; font-size: 40px; opacity: 0; animation: thiefcard 1s 0.4s ease-in both; }
@keyframes ninja { 0% { transform: translate(-90px, 0) rotate(-10deg); } 100% { transform: translate(110vw, -30px) rotate(10deg); } }
@keyframes ninjatrail { 0% { opacity: 0.6; transform: translate(-90px, 0); } 100% { opacity: 0; transform: translate(105vw, -30px); } }
@keyframes thiefcard { 0% { opacity: 1; transform: translate(-50%, 0) rotate(0); } 100% { opacity: 0; transform: translate(40vw, -160px) rotate(300deg) scale(0.6); } }

/* Glücksrad */
.cfx-wheel .wr { left: 50%; top: 34%; width: 280px; height: 280px; margin: -140px 0 0 -140px; border-radius: 50%; background: conic-gradient(var(--c0, #ff5a4d), var(--c1, #3aa0ff), var(--c2, #2fbf5b), var(--c3, #ffc83d), var(--c0, #ff5a4d)); border: 6px solid #1b2140; opacity: 0; animation: wheelspin 1.7s cubic-bezier(0.1, 0.7, 0.2, 1) both; }
@keyframes wheelspin { 0% { opacity: 0; transform: scale(0.3) rotate(0); } 12% { opacity: 0.85; } 75% { opacity: 0.85; } 100% { opacity: 0; transform: scale(1.1) rotate(1000deg); } }
.splash.k-wheel .se { display: inline-block; animation: spin 1.3s cubic-bezier(0.1, 0.7, 0.2, 1) both; }

/* Siegbremse und Siegfenster */
.cfx .vg { inset: 0; opacity: 0; box-shadow: inset 0 0 0 12px #ff3b30, inset 0 0 90px 18px rgba(255, 59, 48, 0.55); animation: vgpulse 1.6s ease-in-out both; }
@keyframes vgpulse { 0%, 100% { opacity: 0; } 12% { opacity: 1; } 30% { opacity: 0.2; } 45% { opacity: 1; } 62% { opacity: 0.2; } 78% { opacity: 1; } }
.splash.k-brake .se, .splash.k-window .se { display: inline-block; animation: stampin 0.5s cubic-bezier(0.2, 1.5, 0.4, 1) both; }
@keyframes stampin { 0% { transform: scale(3.2) rotate(-14deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }

/* Erwischt */
.cfx .ex { top: 20%; font-size: 70px; opacity: 0; animation: exbounce 1s ease-out both; }
.cfx .ex.e1 { left: 16%; } .cfx .ex.e2 { right: 16%; animation-delay: 0.12s; }
@keyframes exbounce { 0% { opacity: 0; transform: translateY(-40px) scale(0.3); } 25% { opacity: 1; transform: translateY(0) scale(1.3); } 45% { transform: translateY(-14px) scale(1); } 65% { transform: translateY(0) scale(1.1); } 100% { opacity: 0; transform: scale(1); } }

/* Aussetzen, Richtung, Ziehen */
.cfx .stamp { left: 50%; top: 62%; font-size: 150px; opacity: 0; transform: translate(-50%, -50%); animation: stampbig 1.2s cubic-bezier(0.2, 1.4, 0.4, 1) both; }
@keyframes stampbig { 0% { opacity: 0; transform: translate(-50%, -50%) scale(4) rotate(-20deg); } 25% { opacity: 0.9; transform: translate(-50%, -50%) scale(1) rotate(0); } 80% { opacity: 0.9; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.2); } }
.cfx .rot { left: 50%; top: 62%; font-size: 190px; opacity: 0; animation: rotbig 1.3s ease-out both; }
@keyframes rotbig { 0% { opacity: 0; transform: translate(-50%, -50%) rotate(0) scale(0.4); } 30% { opacity: 0.55; } 100% { opacity: 0; transform: translate(-50%, -50%) rotate(540deg) scale(1.3); } }
.cfx .fc { top: -60px; left: calc(14% + var(--i) * 20%); font-size: 54px; opacity: 0; animation: cardrain 1.1s ease-in both; animation-delay: calc(var(--i) * 0.1s); }
@keyframes cardrain { 0% { opacity: 1; transform: translateY(0) rotate(-20deg); } 100% { opacity: 0; transform: translateY(95vh) rotate(25deg); } }

/* Splash-Symbole pulsieren je nach Karte */
.splash.k-double .se { display: inline-block; animation: pendpulse 0.35s ease-in-out 3; }
.splash.k-bomb .se { display: inline-block; animation: nudge 0.12s linear 4; }
.splash.k-gift .se, .splash.k-call .se { display: inline-block; animation: nudge 0.4s ease-in-out 3; }

/* Sonderkarten glänzen auf der Hand und auf dem Stapel */
.pc.em:not(.back)::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 4; background: linear-gradient(115deg, transparent 38%, rgba(255, 255, 255, 0.6) 50%, transparent 62%); background-size: 260% 100%; background-position: 130% 0; animation: cardshine 3.4s ease-in-out infinite; }
.hc.ok.em { animation: nudge 1.6s ease-in-out infinite; }
@keyframes cardshine { 0%, 55% { background-position: 130% 0; } 100% { background-position: -130% 0; } }
.ring .top.em { box-shadow: 0 0 0 3px #fff, 0 0 18px 4px var(--cc, #ffc83d); }

.calm .cfx { display: none !important; }

.opp.me { border-color: var(--c1); background: #eef6ff; }

/* Aufräumen: Besen fegt über den Bildschirm. Eisblock: Eiskristalle fallen, bläulicher Blitz */
.cfx .fl.ice { background: radial-gradient(circle at 50% 40%, #d6f2ff, transparent 70%); }
.cfx .br { left: -20%; top: 44%; font-size: 84px; animation: fxbroom 1.5s ease-in-out both; }
.cfx .du { top: 52%; font-size: 40px; opacity: 0; animation: fxdust 1.4s ease-out both; }
.cfx .du.d1 { left: 30%; animation-delay: 0.3s; }
.cfx .du.d2 { left: 55%; animation-delay: 0.5s; }
@keyframes fxbroom { 0% { transform: translateX(0) rotate(-20deg); } 50% { transform: translateX(70vw) rotate(10deg); } 100% { transform: translateX(130vw) rotate(-10deg); } }
@keyframes fxdust { 0% { transform: scale(0.3); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(40px, -60px) scale(1.5); opacity: 0; } }
.cfx .ic { top: -10%; left: calc(8% + var(--i) * 16%); font-size: 46px; animation: fxice 1.7s ease-in calc(var(--i) * 0.12s) both; }
@keyframes fxice { 0% { transform: translateY(0) rotate(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(100vh) rotate(260deg); opacity: 0.9; } }

/* ===== Kritzelrunde ===== */
.kritzel { display: grid; gap: 10px; }
.kscore { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
.kscore::-webkit-scrollbar { display: none; }
.kp { flex: none; display: flex; align-items: center; gap: 6px; background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 4px 10px 4px 5px; min-width: 112px; }
.kp .avatar { width: 30px; height: 30px; font-size: calc(12px * var(--fs, 1)); border-width: 2px; }
.kp .kn b { display: block; font-size: calc(13px * var(--fs, 1)); line-height: 1.15; max-width: 92px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kp .kn small { font-size: calc(12px * var(--fs, 1)); color: var(--muted); font-weight: 700; }
.kp.dr { background: var(--yellow); box-shadow: 0 3px 0 var(--ink); }
.kp.dr .kn small { color: var(--ink); }
.kp.ok { background: #d8f5e6; }
.kp.off { opacity: 0.5; }
.khead { display: grid; gap: 6px; text-align: center; }
.khead .kicker { font-size: calc(13px * var(--fs, 1)); color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; }
.kword { font-size: calc(26px * var(--fs, 1)); letter-spacing: 0.04em; word-break: break-word; }
.kword.good { color: var(--ok); }
.kword.pat { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; font-size: calc(24px * var(--fs, 1)); }
.kword.pat span { min-width: 22px; height: 34px; display: inline-grid; place-items: center; }
.kword.pat span.bl { border-bottom: 4px solid var(--ink); }
.kboard { position: relative; border: 3px solid var(--ink); border-radius: 16px; box-shadow: var(--sh); overflow: hidden; background: #fff; aspect-ratio: 4 / 3; }
.kstack { position: relative; width: 100%; height: 100%; touch-action: none; }
.kstack.live { cursor: crosshair; }
.kcanvas { display: block; width: 100%; height: 100%; pointer-events: none; }
.kcanvas.klive { position: absolute; inset: 0; }
.koverlay { display: none; position: absolute; inset: 0; background: rgba(255, 255, 255, 0.94); place-items: center; padding: 14px; }
.koverlay.on { display: grid; }
.kpick { display: grid; gap: 10px; width: 100%; max-width: 320px; }
.kwait { text-align: center; display: grid; gap: 8px; justify-items: center; }
.kguess { display: flex; gap: 8px; }
.kguess .input { flex: 1; min-width: 0; }
.kguess .btn { min-height: 54px; padding: 8px 16px; }
.kfeed { max-height: 150px; overflow-y: auto; background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 8px 12px; font-size: calc(15px * var(--fs, 1)); }
.kfeed p { margin: 2px 0; overflow-wrap: anywhere; }
.kfeed p.ok { color: var(--ok); font-weight: 700; }
.kfeed p.close { color: #a56a00; font-style: italic; }
.kfoot { display: grid; gap: 12px; }

/* Zeichenbrett-Designs */
.kb-papier { background: #fff; }
.kb-karo { background-color: #fff; background-image: linear-gradient(rgba(58, 160, 255, 0.28) 1px, transparent 1px), linear-gradient(90deg, rgba(58, 160, 255, 0.28) 1px, transparent 1px); background-size: 6.25% 8.33%; }
.kb-tafel { background: radial-gradient(ellipse at 50% 40%, #3b5a49, #2a4033); }
.kb-neon { background: #0a0a1a radial-gradient(ellipse at 50% 120%, rgba(108, 77, 255, 0.35), transparent 60%); }
.kb-tafel .koverlay, .kb-neon .koverlay { background: rgba(10, 10, 26, 0.9); color: #fff; }
.kboard.blind .kcanvas { visibility: hidden; }
.kboard.blind::after { content: '🙈 Blind-Modus: Du siehst deine Striche nicht. Zeichne einfach!'; position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; font-weight: 800; color: var(--muted); pointer-events: none; }
.kb-tafel.blind::after, .kb-neon.blind::after { color: #cfd6ff; }

/* Werkzeugleiste (Kritzelrunde und Geschichten-Kette) */
.ktb { display: grid; gap: 8px; }
.ktb[hidden] { display: none; }
.kguess[hidden], .kfeed[hidden] { display: none; }
.ktoolrow { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: thin; }
.kt { flex: none; min-width: 58px; display: grid; justify-items: center; gap: 0; padding: 4px 6px; background: #fff; border: 3px solid var(--ink); border-radius: 12px; cursor: pointer; color: var(--ink); }
.kt span { font-size: calc(20px * var(--fs, 1)); line-height: 1.2; }
.kt small { font-size: calc(11px * var(--fs, 1)); font-weight: 800; }
.kt.on { background: var(--yellow); box-shadow: 0 3px 0 var(--ink); }
.kshapes { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.ks { min-height: 36px; padding: 2px 10px; background: #fff; border: 3px solid var(--ink); border-radius: 10px; font-weight: 800; cursor: pointer; color: var(--ink); }
.ks.on { background: var(--ink); color: #fff; }
.khint { text-align: center; margin: 0; }
.kcolors { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.kc { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--ink); background: var(--kc); cursor: pointer; font-size: calc(16px * var(--fs, 1)); line-height: 1; padding: 0; }
.kc.on { box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--ink); }
.kc.wheelbtn { display: grid; place-items: center; }
.kwheel { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 10px; }
.kwheelcv { width: 150px; height: 150px; border-radius: 50%; touch-action: none; cursor: crosshair; }
.kwside { display: grid; gap: 8px; min-width: 150px; flex: 1; }
.khex { width: 100%; min-height: 40px; padding: 4px 10px; font-family: ui-monospace, monospace; }
.ksliders { display: grid; gap: 4px; }
.ksl { display: grid; grid-template-columns: 78px 1fr 52px; align-items: center; gap: 8px; font-size: calc(13px * var(--fs, 1)); font-weight: 800; }
.ksl input[type='range'] { width: 100%; min-height: 34px; accent-color: var(--ink); }
.ksl output { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.krow { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }

.customwords { display: grid; gap: 6px; margin-top: 8px; }
.customwords textarea { width: 100%; min-height: 84px; resize: vertical; font: inherit; }

/* Profil: Avatar, Rahmen, Namenseffekte */
.avatar { position: relative; line-height: 1; }
.avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
.avatar.ph { background: #fff; }
.avatar.big { width: 84px; height: 84px; font-size: calc(40px * var(--fs, 1)); border-width: 4px; }
.avatar:not(.big) { font-size: calc(19px * var(--fs, 1)); }
.avatar.fr-gold { box-shadow: 0 0 0 3px #FFC83D, 0 0 0 5px var(--ink); }
.avatar.fr-rainbow { box-shadow: 0 0 0 2px #ff4d4d, 0 0 0 4px #ffd23d, 0 0 0 6px #3ad07a, 0 0 0 8px #3aa0ff; }
.avatar.fr-neon { box-shadow: 0 0 0 2px #fff, 0 0 8px 3px #19f0ff, 0 0 16px 6px #b04dff; }
.avatar.fr-crown::after { content: '👑'; position: absolute; top: -13px; left: 50%; transform: translateX(-50%) rotate(-8deg); font-size: calc(16px * var(--fs, 1)); filter: drop-shadow(0 1px 0 var(--ink)); }
.avatar.big.fr-crown::after { font-size: calc(32px * var(--fs, 1)); top: -26px; }
.avatar.fr-gold, .avatar.fr-rainbow, .avatar.fr-neon { margin: 8px 12px 8px 8px; }
.avatar.big.fr-gold, .avatar.big.fr-rainbow, .avatar.big.fr-neon { margin: 10px; }

.nm { display: inline-block; max-width: 100%; vertical-align: bottom; }
.fx-rainbow { background: linear-gradient(90deg, #ff4d4d, #ffb52e, #3ad07a, #3aa0ff, #b04dff, #ff4d4d); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: fxslide 3s linear infinite; }
.fx-gold { background: linear-gradient(100deg, #b8860b 0%, #ffe27a 35%, #b8860b 55%, #ffd23d 80%, #b8860b 100%); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: fxslide 4s linear infinite; }
.fx-ice { background: linear-gradient(90deg, #1b7fd1, #5cc8ff, #1b7fd1); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: fxslide 3.5s linear infinite; }
.fx-neon { color: #5a12d6; text-shadow: 0 0 4px #19f0ff, 0 0 10px #19f0ff, 0 0 16px #b04dff; animation: fxflick 3.2s infinite; }
.fx-fire { color: #d9480f; text-shadow: 0 -1px 3px #ffd23d, 0 -3px 6px #ff8a1f, 0 -5px 9px #ff3d1f; animation: fxfire 0.9s ease-in-out infinite alternate; }
.fx-wave i { display: inline-block; font-style: normal; animation: fxwave 1.2s ease-in-out infinite; animation-delay: calc(var(--i) * -0.12s); }
.fx-glitch { position: relative; animation: fxglitch 2.6s steps(1) infinite; text-shadow: 1px 0 #ff2a6d, -1px 0 #19f0ff; }
.fx-sparkle { position: relative; background: linear-gradient(90deg, #1b2140 40%, #ffb400 50%, #1b2140 60%); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: fxshine 2.4s linear infinite; }
.fx-sparkle::after { content: '✦'; position: absolute; right: -0.7em; top: -0.35em; font-size: 0.7em; color: #ffd23d; -webkit-text-fill-color: #ffd23d; animation: fxtwinkle 1.6s ease-in-out infinite; }
.pname .nm, .on .nm, .kn .nm, .rn .nm { max-width: 100%; }
@keyframes fxslide { to { background-position: -200% 0; } }
@keyframes fxshine { from { background-position: 150% 0; } to { background-position: -100% 0; } }
@keyframes fxflick { 0%, 92%, 96%, 100% { opacity: 1; } 94%, 98% { opacity: 0.55; } }
@keyframes fxfire { from { text-shadow: 0 -1px 3px #ffd23d, 0 -3px 6px #ff8a1f, 0 -6px 10px #ff3d1f; transform: translateY(0); } to { text-shadow: 0 -2px 4px #ffd23d, 0 -4px 8px #ff8a1f, 0 -7px 12px #ff3d1f; transform: translateY(-1px); } }
@keyframes fxwave { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes fxglitch { 0%, 88%, 100% { transform: none; } 90% { transform: translate(-2px, 1px) skewX(8deg); } 93% { transform: translate(2px, -1px); } 96% { transform: translate(-1px, 0) skewX(-6deg); } }
@keyframes fxtwinkle { 0%, 100% { opacity: 0; transform: scale(0.4) rotate(0); } 50% { opacity: 1; transform: scale(1) rotate(90deg); } }
@media (prefers-reduced-motion: reduce) { .nm, .nm *, .avatar { animation: none !important; } }

/* Profil-Bildschirm */
.profile { padding-bottom: 40px; }
.profprev { display: flex; align-items: center; gap: 16px; padding: 18px 12px 14px; justify-content: center; }
.profprev .pn { font-family: var(--display); font-weight: 800; font-size: calc(26px * var(--fs, 1)); min-width: 0; overflow-wrap: anywhere; }
.profile .sub { font-family: var(--display); font-weight: 800; margin: 22px 0 8px; }
.emojis { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; }
.emo { height: 46px; font-size: calc(24px * var(--fs, 1)); border: 3px solid var(--ink); border-radius: 12px; background: var(--card); cursor: pointer; font-family: var(--display); font-weight: 800; }
.emo.on, .fxb.on, .frb.on { background: var(--yellow); box-shadow: 0 3px 0 var(--ink); }
.fxgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.fxb { min-height: 48px; padding: 6px 8px; border: 3px solid var(--ink); border-radius: 12px; background: var(--card); font-weight: 800; font-size: calc(16px * var(--fs, 1)); cursor: pointer; }
.frgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.frb { display: grid; justify-items: center; gap: 10px; padding: 18px 6px 8px; border: 3px solid var(--ink); border-radius: 12px; background: var(--card); cursor: pointer; }
.frb small { font-weight: 700; }
.codebox { width: 100%; resize: vertical; font-size: calc(12px * var(--fs, 1)); word-break: break-all; margin-top: 8px; }
.profbtn { display: flex; align-items: center; gap: 10px; }
.profbtn .avatar { width: 28px; height: 28px; border-width: 2px; font-size: calc(14px * var(--fs, 1)); }
.section-title .btn { vertical-align: middle; }

/* Einstellungen, Erklärungen, Ruhige Darstellung */
.calm *, .calm *::before, .calm *::after { animation-duration: 0.01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
.calm .confetti, .calm .splash { display: none !important; }
.settings, .help { padding-bottom: 40px; }
.settings .card { display: grid; gap: 14px; }
.srow { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.srow .st { display: grid; gap: 2px; min-width: 0; flex: 1 1 200px; }
.srow .st small { color: var(--muted); font-weight: 600; font-size: calc(13px * var(--fs, 1)); }
.fsample { margin: -4px 0 0; font-size: calc(17px * var(--fs, 1)); font-weight: 800; }
.tog { flex: none; width: 58px; height: 34px; border: 3px solid var(--ink); border-radius: 99px; background: #d9deee; position: relative; cursor: pointer; padding: 0; }
.tog i { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); transition: transform 0.2s; }
.tog.on { background: var(--mint); }
.tog.on i { transform: translateX(24px); }
.vol { width: min(220px, 100%); height: 34px; accent-color: var(--violet); }
.hsec { background: var(--card); border: 3px solid var(--ink); border-radius: 16px; margin-bottom: 10px; overflow: hidden; }
.hsec summary { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; list-style: none; font-size: calc(17px * var(--fs, 1)); }
.hsec summary::-webkit-details-marker { display: none; }
.hsec summary::after { content: '＋'; margin-left: auto; font-weight: 800; }
.hsec[open] summary::after { content: '−'; }
.hsec[open] summary { border-bottom: 3px solid var(--ink); background: var(--yellow); }
.hsec .he { font-size: calc(24px * var(--fs, 1)); }
.hbody { padding: 12px 14px 14px; display: grid; gap: 10px; font-size: calc(16px * var(--fs, 1)); line-height: 1.45; }
.hbody p, .hbody ul { margin: 0; }
.hbody ul { padding-left: 20px; display: grid; gap: 6px; }
.hbody .sub2 { font-family: var(--display); font-weight: 800; margin-top: 4px; }
.homebtns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }
.homebtns .profbtn { margin: 0; }
.snd { min-width: 44px; }

/* Kopfzeile darf umbrechen (viele Knöpfe auf kleinen Handys) */
.topbar { flex-wrap: wrap; }
.topbar .tbtns { gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-left: auto; }
.topbar .tbtns > .btn { flex: 0 0 auto; }
.fsbtn { min-width: 44px; }
.fsbtn[aria-pressed="true"] { background: var(--ink); color: #fff; }
.toast { text-align: center; }

/* Quiz: Designs (nur lokal gewählt), Aufdeck-Animationen, Blitzquiz */
.quiz { color: var(--ink); }
.quiz.sk-show, .quiz.sk-retro, .quiz.sk-pastell { padding: 14px 12px 18px; border-radius: 20px; margin: 0 -4px; }
.quiz.sk-show { --ink: #ffe27a; --card: #1f2559; --muted: #aab3ff; --paper: #10143a; background: radial-gradient(120% 70% at 50% -10%, #3a3fa8 0%, #10143a 62%); }
.sk-show .opt.sel { color: #10143a; }
.sk-show .opt.res.right { background: #1d7a56; color: #fff; }
.sk-show .opt.res.wrong { background: #7a2a3a; color: #fff; }
.sk-show .timer, .sk-show .chip, .sk-show .rank li { background: #1f2559; }
.sk-show .rank li.win { background: #3a3fa8; }
.sk-show .btn { color: #10143a; }
.sk-show .btn.alt { background: #1f2559; color: var(--ink); }
.sk-show .shape { color: #10143a; }
.sk-show .tscore, .sk-show .qtile { background: #1f2559; }
.quiz.sk-retro { --ink: #3dff8b; --card: #06160d; --muted: #35b565; --paper: #020a05; background: #020a05; font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
.sk-retro .qtext, .sk-retro .opt, .sk-retro .btn, .sk-retro .chip, .sk-retro h2 { font-family: inherit; letter-spacing: 0; }
.sk-retro .opt { border-radius: 4px; box-shadow: 0 0 0 1px var(--ink); }
.sk-retro .opt.sel { background: #3dff8b; color: #020a05; }
.sk-retro .opt.res.right { background: #0b4a26; }
.sk-retro .opt.res.wrong { background: #4a1212; color: #ff9b9b; }
.sk-retro .timer, .sk-retro .chip, .sk-retro .rank li, .sk-retro .shape, .sk-retro .btn { border-radius: 4px; background: #06160d; color: var(--ink); }
.sk-retro .timer i { background: #3dff8b; }
.sk-retro .btn { box-shadow: 0 0 0 1px var(--ink); }
.sk-retro .shape { background: transparent; }
.sk-retro .qtext::before { content: '> '; }
.sk-retro .rank li.win { background: #0b4a26; }
.sk-retro .tscore, .sk-retro .qtile { background: #06160d; }
.quiz.sk-pastell { --ink: #46386e; --card: #ffffff; --muted: #7d72a3; --paper: #fdf3ff; background: linear-gradient(160deg, #fff1fb, #eaf4ff 60%, #effff6); }
.sk-pastell .opt { border-radius: 22px; box-shadow: 0 5px 0 #c9bfee; border-color: #46386e; }
.sk-pastell .opt.res.right { background: #d9f7e8; }
.sk-pastell .opt.res.wrong { background: #ffe0ea; }
.sk-pastell .btn { border-radius: 22px; }

/* Aufdecken: Antworten poppen nacheinander auf, richtige leuchtet, falsche wackelt */
.stage.fresh .opt.res { animation: qpop 0.45s cubic-bezier(0.2, 1.4, 0.4, 1) both; animation-delay: calc(var(--d, 0) * 0.09s); }
.stage.fresh .opt.res.right { animation: qpop 0.45s cubic-bezier(0.2, 1.4, 0.4, 1) both, qglow 1.2s ease-out 0.5s 2; animation-delay: calc(var(--d, 0) * 0.09s), 0.5s; }
.stage.fresh .opt.res.wrong { animation: qpop 0.45s both, qshake 0.5s 0.5s both; animation-delay: calc(var(--d, 0) * 0.09s), 0.5s; }
.stage.fresh .verdict { animation: qpop 0.5s 0.5s cubic-bezier(0.2, 1.6, 0.4, 1) both; }
.stage.fresh .rank li { animation: qslide 0.4s both; animation-delay: calc(0.6s + var(--i, 0) * 0.06s); }
@keyframes qpop { from { transform: scale(0.8); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes qglow { 0%, 100% { box-shadow: 0 0 0 0 rgba(45, 190, 154, 0); } 40% { box-shadow: 0 0 0 10px rgba(45, 190, 154, 0.45); } }
@keyframes qshake { 0%, 100% { transform: none; } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
@keyframes qslide { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .stage.fresh * { animation: none !important; } }

/* Blitzquiz */
.verdict { text-align: center; font-family: var(--display); font-weight: 800; font-size: calc(22px * var(--fs, 1)); margin: 0; }
.verdict.ok { color: var(--ok); }
.verdict.no { color: var(--bad); }
.rank.blz li.me { outline: 3px solid var(--blue); outline-offset: 1px; }
.rank .gain { font-family: var(--display); font-weight: 800; color: var(--ok); animation: qpop 0.5s 0.7s both; }
.rank .mv { font-size: calc(13px * var(--fs, 1)); font-weight: 800; }
.rank .mv.up { color: var(--ok); }
.rank .mv.dn { color: var(--bad); }
.podium { display: flex; align-items: flex-end; justify-content: center; gap: 10px; margin: 6px 0 4px; }
.pod { flex: 1; max-width: 120px; display: grid; justify-items: center; gap: 4px; min-width: 0; text-align: center; }
.pod > b { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pod .pbar { width: 100%; border: 3px solid var(--ink); border-radius: 12px 12px 0 0; background: var(--card); display: grid; align-content: start; justify-items: center; padding: 6px 2px; animation: podrise 0.7s cubic-bezier(0.2, 1.2, 0.4, 1) both; }
.pod .pbar em { font-style: normal; font-family: var(--display); font-weight: 800; font-size: calc(26px * var(--fs, 1)); }
.pod .pbar small { font-weight: 700; color: var(--muted); }
.pod.p1 .pbar { height: 120px; background: var(--yellow); animation-delay: 0.5s; }
.pod.p2 .pbar { height: 92px; animation-delay: 0.25s; }
.pod.p3 .pbar { height: 72px; }
@keyframes podrise { from { transform: scaleY(0.1); opacity: 0; } to { transform: none; opacity: 1; } }
.skinseg button.pre { font-size: calc(14px * var(--fs, 1)); }
.sk-show .pod.p1 .pbar, .sk-show .pod.p1 .pbar small { color: #10143a; }

/* Schwierigkeit: Chip mit Text (Farbe ist nur Zusatz) und Auswahlzeile in der Lobby */
.chip.lvl { border-color: var(--ink); }
.chip.lvl3, .chip.lvl4 { box-shadow: inset 0 -4px 0 #FFC83D; }
.chip.lvl5 { box-shadow: inset 0 -4px 0 #FF8A3D; }
.chip.lvl6 { box-shadow: inset 0 -4px 0 #FF5A4D; }
.qhead { flex-wrap: wrap; }
.diffseg .hint { flex-basis: 100%; margin: 2px 0 0; }

.rank .lives { font-size: calc(13px * var(--fs, 1)); letter-spacing: 1px; white-space: nowrap; }
.rank li .rn small { overflow-wrap: anywhere; }

.opt.out { opacity: 0.28; text-decoration: line-through; }

/* Schätzrunde */
.gs-item { display: grid; justify-items: center; gap: 4px; text-align: center; }
.gs-emoji { font-size: calc(76px * var(--fs, 1)); line-height: 1.05; }
.gs-item.small .gs-emoji { font-size: calc(48px * var(--fs, 1)); }
.gs-name { text-align: center; }
.gs-ctx { color: var(--muted); font-weight: 700; max-width: 30em; }
.gs-form { display: grid; gap: 8px; }
.gs-lab { font-weight: 800; text-align: center; }
.gs-row { display: flex; align-items: center; gap: 10px; justify-content: center; }
.gs-in { text-align: center; font-family: var(--display); font-size: calc(26px * var(--fs, 1)); min-height: 62px; max-width: 14em; }
.gs-unit { font-family: var(--display); font-weight: 800; font-size: calc(20px * var(--fs, 1)); min-width: 2.2em; }
.gs-err { min-height: 1.3em; color: var(--bad); font-weight: 700; text-align: center; font-size: calc(14px * var(--fs, 1)); }
.gs-done { display: flex; align-items: center; justify-content: center; gap: 10px; background: #d4f4e6; color: #0d3d2a; border: 3px solid var(--ink); border-radius: var(--r); padding: 14px; font-size: calc(18px * var(--fs, 1)); }
.gs-lock { font-size: 1.3em; }

/* Auflösung */
.gs-truth { display: grid; justify-items: center; gap: 2px; background: var(--yellow); color: #1b2140; border: 3px solid var(--ink); border-radius: var(--r); box-shadow: var(--sh); padding: 10px 14px; }
.gs-truth small { font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; font-size: calc(12px * var(--fs, 1)); }
.gs-truth b { font-family: var(--display); font-size: calc(30px * var(--fs, 1)); line-height: 1.1; }
.stage.fresh .gs-truth { animation: qpop 0.5s 0.15s cubic-bezier(0.2, 1.6, 0.4, 1) both; }

.gs-scale { position: relative; height: 92px; margin: 6px 14px 4px; }
.gs-track { position: absolute; left: 0; right: 0; top: 44px; height: 6px; border-radius: 4px; background: var(--ink); opacity: 0.85; }
.gs-target { position: absolute; top: 4px; transform: translateX(-50%); display: grid; justify-items: center; font-style: normal; z-index: 2; }
.gs-target i { font-style: normal; font-size: 26px; line-height: 1; }
.gs-target em { font-style: normal; font-size: calc(11px * var(--fs, 1)); font-weight: 800; text-transform: uppercase; background: var(--ink); color: var(--paper); border-radius: 99px; padding: 0 7px; }
.gs-target::after { content: ''; width: 3px; height: 26px; background: var(--ink); }
.gs-mark { position: absolute; top: calc(52px + var(--lane, 0) * 14px); transform: translateX(-50%); width: 24px; height: 24px; border-radius: 50%; background: var(--c, #888); color: #fff; border: 3px solid var(--ink); display: grid; place-items: center; font-size: 11px; font-weight: 800; text-shadow: 0 1px 0 rgba(0, 0, 0, 0.4); }
.gs-mark.me { width: 28px; height: 28px; z-index: 3; box-shadow: 0 0 0 3px var(--yellow); }
.stage.fresh .gs-mark { animation: gspop 0.5s both; animation-delay: calc(0.5s + var(--d, 0) * 0.12s); }
@keyframes gspop { from { transform: translateX(-50%) scale(0); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }

.gs-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.gs-rowi { background: var(--card); border: 3px solid var(--ink); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 4px; }
.gs-rowi.me { box-shadow: 0 0 0 3px var(--yellow); }
.gs-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.gs-who { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.gs-pts { font-family: var(--display); font-weight: 800; }
.gs-sub { color: var(--muted); font-weight: 700; font-size: calc(14px * var(--fs, 1)); }
.gs-how { font-weight: 800; font-size: calc(14px * var(--fs, 1)); }
.gs-how.draw { color: var(--violet); }
.gs-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.gs-chip { display: inline-flex; align-items: center; gap: 6px; border: 2px solid var(--ink); border-radius: 99px; padding: 2px 10px; font-weight: 700; font-size: calc(14px * var(--fs, 1)); background: var(--card); }
.gs-chip i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--ink); }
.gs-chip.pick { background: #d4f4e6; font-weight: 800; }
/* Auslosung: die Namen blitzen reihum auf, am Ende leuchtet die gezogene Schätzung */
.stage.fresh .gs-chip.roll { animation: gsroll 0.4s ease-in-out both; animation-delay: calc(var(--i, 0) * 0.2s); }
.stage.fresh .gs-chip.roll.pick { animation: gsroll 0.4s ease-in-out both, gswin 0.8s 1.5s cubic-bezier(0.2, 1.6, 0.4, 1) both; animation-delay: calc(var(--i, 0) * 0.2s), 1.5s; }
@keyframes gsroll { 0%, 100% { background: var(--card); transform: none; } 50% { background: var(--yellow); transform: scale(1.12); } }
@keyframes gswin { 0% { transform: scale(1); } 50% { transform: scale(1.25); } 100% { transform: scale(1); background: #d4f4e6; } }
.gs-tdot { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--ink); flex: none; }
.sk-retro .gs-truth, .sk-show .gs-truth { color: #10143a; }
.sk-retro .gs-rowi, .sk-retro .gs-chip, .sk-retro .gs-done { background: #06160d; color: var(--ink); border-radius: 4px; }
.sk-show .gs-rowi, .sk-show .gs-chip { background: #1f2559; }
.sk-show .gs-done, .sk-retro .gs-done { color: var(--ink); background: #0b4a26; }
.gs-set .seg button { white-space: normal; }

.gs-joker { justify-self: center; text-align: center; }
.gs-joker.on { font-weight: 800; color: var(--ink); background: rgba(255, 214, 90, 0.5); border: 2px solid var(--ink); border-radius: 12px; padding: 6px 12px; }

/* ===== Kritzelpost ===== */
.cq { display: grid; gap: 12px; }
.cq-stage { display: grid; gap: 12px; justify-items: center; text-align: center; }
.cq-stage > * { max-width: 100%; min-width: 0; }
.cq-timer, .cq-stage .timer { width: min(100%, 560px); }
.cq-title { font-size: calc(24px * var(--fs, 1)); line-height: 1.2; }
.cq-sub { max-width: 46ch; }
.cq-quote { margin: 0; width: min(100%, 560px); padding: 12px 16px; background: #fff; border: 3px solid var(--ink); border-radius: 16px; box-shadow: var(--sh); font-weight: 800; font-size: calc(19px * var(--fs, 1)); overflow-wrap: anywhere; text-align: left; }
.cq-quote.mine { background: #d8f5e6; }
.cq-form { display: grid; gap: 8px; width: min(100%, 560px); }
.cq-in { width: 100%; min-height: 84px; resize: vertical; font: inherit; font-size: calc(17px * var(--fs, 1)); }
.cq-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.cq-count { color: var(--muted); font-weight: 700; }
.cq-board { width: min(100%, 640px); }
.cq-stage .ktb { width: min(100%, 640px); text-align: left; }
.cq-img { display: block; width: min(100%, 560px); aspect-ratio: 4 / 3; object-fit: contain; background: #fff; border: 3px solid var(--ink); border-radius: 16px; box-shadow: var(--sh); }
.cq-img.small { width: min(100%, 320px); }
.cq-img.wait { display: grid; place-items: center; background: repeating-linear-gradient(45deg, #fff, #fff 10px, #f1f1f1 10px, #f1f1f1 20px); color: var(--muted); font-weight: 800; }
.cq-done { display: flex; align-items: center; gap: 8px; }
.cq-status { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.cq-pl { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 3px 10px 3px 4px; font-weight: 700; font-size: calc(13px * var(--fs, 1)); }
.cq-pl .avatar { width: 24px; height: 24px; font-size: calc(11px * var(--fs, 1)); border-width: 2px; }
.cq-pl.done { background: #d8f5e6; }
.cq-pl.off { opacity: 0.5; }
.cq-tools { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.cq-list { display: grid; gap: 12px; width: min(100%, 600px); text-align: left; }
.cq-item { background: #fff; border: 3px solid var(--ink); border-left: 10px solid var(--c, var(--ink)); border-radius: 16px; padding: 10px 14px; box-shadow: var(--sh); display: grid; gap: 8px; }
.cq-item.fresh { animation: cq-in 0.5s ease-out both; }
.cq-item .cq-img { width: 100%; box-shadow: none; }
.cq-by { display: flex; align-items: center; gap: 8px; }
.cq-by .avatar { width: 30px; height: 30px; font-size: calc(12px * var(--fs, 1)); border-width: 2px; }
.cq-by small { display: block; color: var(--muted); font-weight: 700; font-size: calc(12px * var(--fs, 1)); }
.cq-text { margin: 0; font-size: calc(20px * var(--fs, 1)); font-weight: 800; overflow-wrap: anywhere; }
.cq-missing { margin: 0; color: var(--muted); font-style: italic; }
.cq-fin, .cq-intro { text-align: center; font-weight: 800; }
.cq-owner { border-bottom: 4px solid var(--c, var(--ink)); }
.cq-ctl { justify-content: center; }
.cq-chains { width: min(100%, 560px); }
.cq-chains li { gap: 10px; flex-wrap: wrap; }
.cq-chains .rn { min-width: 0; flex: 1 1 120px; }
.cq-chains .rn b, .cq-chains .rn small { display: block; overflow: hidden; text-overflow: ellipsis; }
@keyframes cq-in { from { opacity: 0; transform: translateY(14px) scale(0.97); } to { opacity: 1; transform: none; } }
.calm .cq-item.fresh { animation: none; }
@media (prefers-reduced-motion: reduce) { .cq-item.fresh { animation: none; } }

/* ===== Einstellungen: Hintergrund ===== */
.bggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
.bgtile { position: relative; display: grid; gap: 4px; justify-items: center; padding: 6px 6px 4px; background: var(--card); border: 3px solid var(--ink); border-radius: 12px; cursor: pointer; font-weight: 800; }
.bgtile.on { background: var(--yellow); box-shadow: 0 3px 0 var(--ink); }
.bgtile small { font-size: calc(12px * var(--fs, 1)); font-weight: 800; }
.bgprev { display: grid; place-items: center; width: 100%; height: 52px; border: 2px solid var(--ink); border-radius: 8px; background-clip: padding-box; font-size: 22px; }
.bgprev.plus { background: #fff; color: var(--muted); }
.bgcolor { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.bgbtns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.bgcard .srow { margin-top: 12px; }

.vpanel { display: grid; gap: 10px; }
.vrow { display: grid; grid-template-columns: 78px 1fr; align-items: center; gap: 8px; font-weight: 800; font-size: calc(13px * var(--fs, 1)); }
.vsel { min-width: 0; width: 100%; min-height: 40px; font: inherit; }
.vsl { grid-template-columns: 78px 1fr 52px; }
.vbtns { display: flex; flex-wrap: wrap; gap: 8px; }
.cq-voice { display: grid; gap: 8px; justify-items: center; max-width: 100%; }
.cq-vdet { width: min(100%, 460px); background: var(--card, #fff); border: 2px solid var(--ink); border-radius: 12px; padding: 8px 12px; text-align: left; }
.cq-vdet summary { cursor: pointer; font-weight: 800; }
.cq-vdet .vpanel { margin-top: 8px; }

/* Schach: Brett, Figuren, Animationen, Oberfläche */
#app:has(.chess) { max-width: 1060px; }

/* ---------- Brett ---------- */
.chb { position: relative; width: 100%; aspect-ratio: 1 / 1; border-radius: 6px; user-select: none; -webkit-user-select: none; touch-action: none; box-shadow: 0 0 0 6px var(--frame, #8b5e3c), 0 0 0 9px var(--ink), 0 10px 0 9px var(--ink); background: var(--d, #b58863); margin: 9px 0 14px; cursor: default; }
.chb.arrowmode { cursor: crosshair; }
.chb-squares, .chb-pieces, .chb-svg, .chb-fx, .chb-promo-layer { position: absolute; inset: 0; }
.chb-squares { overflow: hidden; border-radius: 6px; }
.chb-pieces, .chb-svg, .chb-fx { pointer-events: none; }
.chb-sq { position: absolute; width: 12.5%; height: 12.5%; }
.chb-sq.l { background: var(--l, #f0d9b5); }
.chb-sq.d { background: var(--d, #b58863); }
.chb-sq.last::after, .chb-sq.sel::after, .chb-sq.chk::after { content: ''; position: absolute; inset: 0; }
.chb-sq.last::after { background: rgba(255, 213, 0, 0.42); }
.chb-sq.sel::after { background: rgba(60, 190, 120, 0.55); }
