          s.drew = null;
        } else {
          s.dir *= -1;
          note(s, 'Spiegel: Richtungswechsel', pid, 'mirror');
          if (n === 2) s.drew = null; else advance(s, 1);
        }
        break;
      case 'double':
        note(s, who + ' ist nochmal dran', pid, 'double');
        s.drew = null;
        break;
      case 'thief': {
        const stolen = target.hand.splice(Math.floor(Math.random() * target.hand.length), 1)[0];
        p.hand.push(stolen);
        if (p.hand.length > 2) p.called = false;
        note(s, who + ' klaut eine Karte von ' + nm(s, target.id), pid, 'thief');
        advance(s, 1);
        break;
      }
      case 'bomb': {
        // Damit nie der ganze Stapel in den Händen landet, zündet die Bombe nur, solange noch genug Karten übrig sind
        const avail = s.draw.length + Math.max(0, s.discard.length - 1);
        if (avail >= 2 * (n - 1) + 10) {
          for (const q of s.players) if (q.id !== pid) drawCards(s, q.id, 1);
          note(s, 'Bombe! Alle anderen ziehen eine Karte', pid, 'bomb');
        } else note(s, 'Die Bombe ist ein Blindgänger (zu wenig Karten im Stapel)', pid, 'bomb');
        advance(s, 1);
        break;
      }
      case 'gift': {
        const given = p.hand.splice(Math.floor(Math.random() * p.hand.length), 1)[0];
        target.hand.push(given);
        if (target.hand.length > 2) target.called = false;
        note(s, who + ' schenkt ' + nm(s, target.id) + ' eine Karte', pid, 'gift');
        advance(s, 1);
        break;
      }
      case 'tidy': {
        // Aufräumen: Wer mindestens 2 Karten hat, legt die höchste unter den Nachziehstapel (so bleibt keine Karte im Spiel verloren)
        let moved = 0;
        for (const q of s.players) {
          if (q.hand.length < 2) continue;
          let best = 0;
          q.hand.forEach((c, i) => { if (cardValue(s, c) > cardValue(s, q.hand[best])) best = i; });
          s.draw.unshift(q.hand.splice(best, 1)[0]);
          moved++;
        }
        note(s, 'Aufräumen! ' + moved + ' ' + (moved === 1 ? 'Person legt' : 'Personen legen') + ' die höchste Karte unter den Stapel', pid, 'tidy');
        advance(s, 1);
        break;
      }
      case 'freeze':
        advance(s, 1);
        s.limit = { pid: curId(s) };
        note(s, nm(s, curId(s)) + ' ist eingefroren: nur Zahlenkarten', curId(s), 'freeze');
        break;
      case 'wheel':
        note(s, 'Glücksrad: ' + wheel(s, pid, nxt) + ' (Farbe: ' + cn(color) + ')', pid, 'wheel');
        break;
      case 'brake':
        note(s, who + ' wünscht sich ' + cn(color), pid, 'color');
        advance(s, 1);
        break;
      default:
        advance(s, 1);
    }

    // Gewinn und Letzte-Karte-Prüfung
    if (!p.hand.length) {
      if (hasBrake(s, pid)) {
        s.phase = 'window';
        s.window = { winner: pid };
        note(s, who + ' hat keine Karten mehr. Wer eine Siegbremse hat, kann jetzt eingreifen!', pid, 'window');
      } else finishRound(s, pid);
    } else if (p.hand.length === 1 && !p.called) {
      s.catchTarget = pid;
      s.catchUntil = (now || Date.now()) + CATCH_MS;
    }
    return ok();
  }

  function draw(s, pid) {
    if (s.phase !== 'play') return err('Gerade kann nicht gezogen werden');
    if (curId(s) !== pid) return err('Du bist nicht dran');
    s.catchTarget = null;
    if (s.pending) {
      const k = s.pending.n;
      const got = drawCards(s, pid, k);
      note(s, nm(s, pid) + ' zieht ' + got.length, pid, 'draw');
      s.pending = null;
      advance(s, 1);
      return ok();
    }
    if (s.drew != null) return err('Du hast schon gezogen. Lege die Karte oder passe.');
    const k = s.opts.random ? rint(1, 3) : 1;
    const got = drawCards(s, pid, k);
    note(s, nm(s, pid) + ' zieht ' + got.length, pid, 'draw');
    if (!s.opts.random && got.length === 1) {
      s.drew = got[0].id;
      if (canPlay(s, pid, got[0])) return ok(); // darf die gezogene Karte legen oder passen
      s.drew = null;
    }
    advance(s, 1);
    return ok();
  }

  function pass(s, pid) {
    if (s.phase !== 'play' || curId(s) !== pid) return err('Du bist nicht dran');
    if (s.drew == null) return err('Passen geht erst nach dem Ziehen');
    s.catchTarget = null;
    note(s, nm(s, pid) + ' passt', pid, 'pass');
    advance(s, 1);
    return ok();
  }

  function call(s, pid) {
    const p = P(s, pid);
    if (!p) return err('Unbekannter Spieler');
    if (s.phase === 'roundEnd') return err('Die Runde ist vorbei');
    if (p.hand.length > 2) return err('Du hast noch zu viele Karten');
    p.called = true;
    if (s.catchTarget === pid) s.catchTarget = null;
    note(s, nm(s, pid) + ': Letzte Karte!', pid, 'call');
    return ok();
  }

  function catchOut(s, pid, now) {
    if (s.phase !== 'play') return err('Gerade nicht möglich');
    if (s.catchTarget == null || (now || Date.now()) > s.catchUntil) return err('Zu spät');
    if (s.catchTarget === pid) return err('Das bist du selbst');
    const t = s.catchTarget;
    drawCards(s, t, 2);
    s.catchTarget = null;
    note(s, nm(s, pid) + ' erwischt ' + nm(s, t) + ': +2 Karten', pid, 'catch');
    return ok();
  }

  function brake(s, pid) {
    if (s.phase !== 'window') return err('Keine Siegbremse möglich');
    if (pid === s.window.winner) return err('Das geht nur bei anderen');
    const p = P(s, pid);
    const card = p && p.hand.find((c) => S(s, c).v === 'brake');
    if (!card) return err('Du hast keine Siegbremse');
    p.hand.splice(p.hand.indexOf(card), 1);
    s.discard.push(card);
    const w = s.window.winner;
    drawCards(s, w, 2);
    s.phase = 'play';
    s.window = null;
    note(s, nm(s, pid) + ' bremst den Sieg von ' + nm(s, w) + ': +2 Karten!', pid, 'brake');
    if (!p.hand.length) finishRound(s, pid);
    return ok();
  }

  function closeWindow(s) {
    if (s.phase !== 'window') return err('Kein Fenster offen');
    finishRound(s, s.window.winner);
    return ok();
  }

  function act(s, pid, a, now) {
    if (!P(s, pid) || !a) return err('Unbekannter Spieler');
    switch (a.a) {
      case 'play': return play(s, pid, a, now);
      case 'draw': return draw(s, pid);
      case 'pass': return pass(s, pid);
      case 'call': return call(s, pid);
      case 'catch': return catchOut(s, pid, now);
      case 'brake': return brake(s, pid);
      default: return err('Unbekannte Aktion');
    }
  }

  /** Zug automatisch beenden (Zeit abgelaufen oder Spieler offline) */
  function autoPlay(s) {
    if (s.phase !== 'play') return err('Kein Zug offen');
    const pid = curId(s);
    return s.drew != null ? pass(s, pid) : draw(s, pid);
  }

  PG.CardsEngine = {
    create, act, legal, canPlay, autoPlay, closeWindow, cardValue,
    face: S, curId, colName, isDark, hasBrake, ALL_CHAOS, CHAOS_COLORED, CHAOS_WILD, CATCH_MS,
  };
})(window.PG);

 * kennen (sie können Zeichnungen nicht erkennen) und deshalb nur zeitlich plausibel „raten“.

(function () {
  const E = PG.CardsEngine;
  const rnd = (a, b) => a + Math.random() * (b - a);

    hard: { name: 'Schwer', think: [650, 1300], catch: 0.92, call: 1, brake: 1, quiz: 0.88, quizSpeed: [0.1, 0.5], guess: 0.92, guessAt: [0.22, 0.6] },
  };

  function cardsMove(s, pid, level) {

    const lg = E.legal(s, pid);

    const n = s.order.length;

    const nextId = s.order[(((s.turn + s.dir) % n) + n) % n];
    const nextHand = s.players.find((p) => p.id === nextId).hand.length;
    const minOpp = Math.min(...opps.map((p) => p.hand.length));
    const face = (c) => E.face(s, c);
    const cards = lg.map((id) => me.hand.find((c) => c.id === id));

    const bestColor = (without) => {
      const cnt = [0, 0, 0, 0];
      for (const c of me.hand) { if (c === without) continue; const f = face(c); if (f.c >= 0) cnt[f.c]++; }
      const mx = Math.max(...cnt);
      if (mx === 0) return Math.floor(Math.random() * 4);
      return pick(cnt.map((v, i) => (v === mx ? i : -1)).filter((i) => i >= 0));
    };
    const target = (v) => {
      const pool = opps.filter((p) => (v === 'thief' ? p.hand.length >= 2 : true));
      if (!pool.length) return null;
      if (level === 'easy') return pick(pool).id;

    const threat = minOpp <= 2;

      const attack = f.v === 'skip' || f.v === 'd2' || f.v === 'wild4';

      if (f.v === 'brake') sc -= 3; // als Bremse wertvoll

      const col = wild ? bestColor(c) : f.c;

      return sc;
    };

    for (const c of cards) { const sc = score(c); if (sc > bs) { bs = sc; best = c; } }
    return finish(best);

    Tür: () => [S(BROWN, 1, closed([330, 130], [670, 130], [670, 680], [330, 680])), S(BROWN, 0, closed([380, 190], [620, 190], [620, 400], [380, 400])), S(YELLOW, 2, circle(610, 470, 18, 8))],

    Berg: () => [S(BROWN, 1, poly([120, 650], [450, 180], [650, 450], [740, 330], [900, 650], [120, 650])), S(BLUE, 1, poly([365, 300], [450, 180], [530, 300], [490, 280], [450, 320], [410, 280], [365, 300]))],
    Blitz: () => [S(YELLOW, 2, closed([560, 100], [330, 400], [470, 400], [400, 650], [680, 300], [530, 300])), S(ORANGE, 0, closed([560, 100], [330, 400], [470, 400], [400, 650], [680, 300], [530, 300]))],
    Ring: () => [S(YELLOW, 1, circle(500, 450, 170, 36)), S(YELLOW, 1, circle(500, 450, 140, 36)), S(BLUE, 2, circle(500, 255, 36, 10))],
  };
  // Mond als Sichel: äußerer Bogen links, innerer Bogen von oben zurück nach unten
  DRAW.Mond = () => [
    S(YELLOW, 2, circle(500, 375, 230, 40, Math.PI * 0.4, Math.PI * 1.6)),
    S(YELLOW, 2, circle(640, 375, 229, 40, Math.PI * 1.403, Math.PI * 0.597)),
  ];
  const DRAWABLE = Object.keys(DRAW);

  /** Zeichnung in kleine Häppchen zerlegen: [{sid,c,w,p}] */
  function chunks(word) {
    const f = DRAW[word];
    if (!f) return [];
    const out = [];
    f().forEach((st, i) => {
      for (let k = 0; k < st.p.length; k += 24) {
        const from = k === 0 ? 0 : k - 2; // Anschlusspunkt wiederholen, damit die Linie durchgängig ist
        out.push({ sid: 'bot' + i, c: st.c, w: st.w, p: st.p.slice(from, k + 24) });
      }
    });
    return out;
  }

  PG.Bots = { LEVEL, think, cardsMove, DRAWABLE, chunks, rnd, pick };
})();

'use strict';
/*
 * Schach-Engine für Spielstube: Regeln, Zuggenerator, Suche, Bewertung, Partie-Analyse.
 * Alles steckt in EINER Funktion ohne Abhängigkeiten, damit derselbe Code im Hauptthread und in einem Web Worker läuft
 * (der Worker bekommt den Quelltext dieser Funktion, siehe PG.ChessAsync unten).
 *
 * Felder: 0 = a1, 7 = h1, 56 = a8, 63 = h8. Figuren: 1 Bauer, 2 Springer, 3 Läufer, 4 Turm, 5 Dame, 6 König, +8 für Schwarz.
 * Züge sind Ganzzahlen: von | nach << 6 | Umwandlung << 12 | Flags << 15 (1 Schlag, 2 en passant, 4 kurze Rochade, 8 lange, 16 Doppelschritt).
 * Varianten: 'std' (Standard), 'koth' (King of the Hill), 'chk3' (Drei Schachs), 'anti' (Schlagzwang, wer alles verliert, gewinnt),
 * 'horse' (Springerschach: alle Figuren außer dem König sind Springer, Umwandlung nur in Springer),
 * 'evo' (Bauernreife: nach dem 10., 20., 30. … Zug von Schwarz wird der am weitesten vorgerückte Bauer jeder Seite zu Springer, Läufer, Turm, danach Dame).
 */
function chessEngineFactory(root) {
  const P = 1, N = 2, B = 3, R = 4, Q = 5, K = 6;
  const WK = 1, WQ = 2, BK = 4, BQ = 8;
  const MATE = 30000;
  const FILES = 'abcdefgh';
  const START_FEN = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
  const VARIANTS = ['std', 'koth', 'chk3', 'anti', 'horse', 'evo'];
  const HORSE_FEN = 'nnnnknnn/pppppppp/8/8/8/8/PPPPPPPP/NNNNKNNN w - - 0 1';
  const EVO_EVERY = 10; // alle so viele Züge wächst je Seite ein Bauer
  const EVO_TIER = [0, N, B, R, Q]; // Reihenfolge, Stufe 4 und höher: Dame
  const CENTER = [27, 28, 35, 36];

  /* ---------- Tabellen ---------- */
  const DF = [0, 1, 1, 1, 0, -1, -1, -1];
  const DR = [1, 1, 0, -1, -1, -1, 0, 1];
  const KN = []; const KG = []; const RAY = []; const PAW = [[], []];
  for (let s = 0; s < 64; s++) {
    const f = s & 7; const r = s >> 3;
    KN[s] = []; KG[s] = []; RAY[s] = []; PAW[0][s] = []; PAW[1][s] = [];
    for (const [a, b] of [[1, 2], [2, 1], [2, -1], [1, -2], [-1, -2], [-2, -1], [-2, 1], [-1, 2]]) {

  }
  const BISHOP_DIRS = [1, 3, 5, 7];
  const ROOK_DIRS = [0, 2, 4, 6];

  /* Zobrist-Schlüssel: zwei unabhängige 32-Bit-Werte */
  let seed = 0x2545F491;
  const rnd32 = () => { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return seed | 0; };
  const mkTable = (n) => Array.from({ length: n }, () => [rnd32(), rnd32()]);
  const ZP = Array.from({ length: 15 }, () => mkTable(64));
  const ZT = [rnd32(), rnd32()];
  const ZC = mkTable(16);
  const ZE = mkTable(65);
  const ZK = [mkTable(4), mkTable(4)];

  const colorOf = (p) => p >> 3;
  const typeOf = (p) => p & 7;
  const sqName = (s) => FILES[s & 7] + ((s >> 3) + 1);
  const sqOf = (str) => FILES.indexOf(str[0]) + (str.charCodeAt(1) - 49) * 8;
  const mkMove = (from, to, promo, flags) => from | (to << 6) | ((promo || 0) << 12) | ((flags || 0) << 15);
  const mFrom = (m) => m & 63;
  const mTo = (m) => (m >> 6) & 63;
  const mPromo = (m) => (m >> 12) & 7;
  const mFlags = (m) => m >> 15;
  const PROMO_CH = { 2: 'n', 3: 'b', 4: 'r', 5: 'q', 6: 'k' };
  const CH_PROMO = { n: 2, b: 3, r: 4, q: 5, k: 6 };
  const uci = (m) => sqName(mFrom(m)) + sqName(mTo(m)) + (mPromo(m) ? PROMO_CH[mPromo(m)] : '');
  const PIECE_CH = 'PNBRQK';

  /* ---------- Stellung ---------- */
  class Pos {
    constructor(variant) {
      this.variant = VARIANTS.includes(variant) ? variant : 'std';
      this.b = new Int8Array(64);
      this.turn = 0; this.castle = 0; this.ep = -1; this.half = 0; this.full = 1;
      this.king = [-1, -1];
      this.checks = [0, 0];
      this.rk = [-1, -1, -1, -1]; // Ausgangsfelder der Rochade-Türme: Weiß kurz, Weiß lang, Schwarz kurz, Schwarz lang
      this.ks = [-1, -1]; // Ausgangsfeld des Königs je Farbe (solange eine Rochade möglich ist)
      this.cm = null; // Rochaderechte, die ein Zug von/auf dieses Feld löscht
      this.h1 = 0; this.h2 = 0;
      this.stack = [];
      this.hist = []; // Schlüssel bisheriger Stellungen (nur für die Wiederholungserkennung in der Suche)
    }

    static fromFen(fen, variant) {
      const p = new Pos(variant);
      const parts = String(fen || START_FEN).trim().split(/\s+/);
      const rows = parts[0].split('/');
      if (rows.length !== 8) throw new Error('FEN: Reihen');
      for (let i = 0; i < 8; i++) {
        let f = 0;
        for (const ch of rows[i]) {
          if (/[1-8]/.test(ch)) f += +ch;
          else {

            if (!t || f > 7) throw new Error('FEN: Zeichen');

            f++;

        }

      }
      p.turn = parts[1] === 'b' ? 1 : 0;

      p.half = +parts[4] || 0;
      p.full = +parts[5] || 1;
      if (parts[6] && /^c\d\d$/.test(parts[6])) p.checks = [+parts[6][1], +parts[6][2]];
      if (p.variant !== 'anti' && (p.king[0] < 0 || p.king[1] < 0)) throw new Error('FEN: König fehlt');
      p.rehash();

    }

    /**
     * Rochaderechte lesen: K/Q/k/q (äußerster Turm auf der Seite des Königs) oder Dateibuchstaben A–H/a–h (Chess960).
     * Merkt sich Ausgangsfelder von König und Türmen; das reicht für jede Chess960-Aufstellung.
     */
    readCastling(str) {
      const b = this.b;
      for (const ch of str) {
        const lo = ch.toLowerCase();
        const col = ch === lo ? 1 : 0; const base = col * 56;
        const ksq = this.king[col];
        if (ksq < base || ksq > base + 7 || FILES.indexOf(lo) < 0 && lo !== 'k' && lo !== 'q') continue;
        const rook = R + col * 8; const kf = ksq & 7;
        let f = FILES.indexOf(lo);
        if (f < 0) { // K oder Q: äußersten Turm auf dieser Seite suchen
          const dir = lo === 'k' ? 1 : -1;
          for (let x = dir > 0 ? 7 : 0; x !== kf; x -= dir) if (b[base + x] === rook) { f = x; break; }
        }
        if (f < 0 || f === kf || b[base + f] !== rook) continue;
        const side = f > kf ? 0 : 1; const i = col * 2 + side;
        this.castle |= 1 << i; this.rk[i] = base + f; this.ks[col] = ksq;
      }
      const cm = this.cm = new Int8Array(64).fill(15);
      for (let col = 0; col < 2; col++) {
        if (this.ks[col] >= 0) cm[this.ks[col]] &= ~(3 << (col * 2));
        for (let side = 0; side < 2; side++) if (this.rk[col * 2 + side] >= 0) cm[this.rk[col * 2 + side]] &= ~(1 << (col * 2 + side));
      }
    }

    /** Rochaderechte als FEN-Text: KQkq bei normaler Aufstellung, sonst Dateibuchstaben (wie Shredder-FEN) */
    castlingText() {
      let out = '';
      for (let i = 0; i < 4; i++) {
        if (!(this.castle & (1 << i))) continue;
        const col = i >> 1; const rs = this.rk[i]; const base = col * 56;
        const std = this.ks[col] === base + 4 && rs === base + (i & 1 ? 0 : 7);
        const ch = std ? (i & 1 ? 'q' : 'k') : FILES[rs & 7];
        out += col ? ch : ch.toUpperCase();
      }
      return out;
    }

    fen() {
      let out = '';
      for (let r = 7; r >= 0; r--) {
        let e = 0;
        for (let f = 0; f < 8; f++) {
          const q = this.b[r * 8 + f];
          if (!q) { e++; continue; }
          if (e) { out += e; e = 0; }
          const ch = PIECE_CH[typeOf(q) - 1];
          out += colorOf(q) ? ch.toLowerCase() : ch;
        }
        if (e) out += e;
        if (r) out += '/';
      }
      const c = this.castlingText();
      let s = `${out} ${this.turn ? 'b' : 'w'} ${c || '-'} ${this.ep >= 0 ? sqName(this.ep) : '-'} ${this.half} ${this.full}`;
      if (this.variant === 'chk3') s += ` c${this.checks[0]}${this.checks[1]}`;
      return s;
    }

    clone() { const p = Pos.fromFen(this.fen(), this.variant); return p; }

    rehash() {
      let a = 0; let b = 0;
      for (let s = 0; s < 64; s++) { const q = this.b[s]; if (q) { a ^= ZP[q][s][0]; b ^= ZP[q][s][1]; } }
      if (this.turn) { a ^= ZT[0]; b ^= ZT[1]; }
      a ^= ZC[this.castle][0]; b ^= ZC[this.castle][1];
      const ei = this.ep >= 0 ? this.ep : 64;
      a ^= ZE[ei][0]; b ^= ZE[ei][1];
      if (this.variant === 'chk3') for (let c = 0; c < 2; c++) { a ^= ZK[c][this.checks[c]][0]; b ^= ZK[c][this.checks[c]][1]; }
      this.h1 = a; this.h2 = b;
    }

    /** Stellungsschlüssel für Wiederholungen (en passant nur, wenn er wirklich möglich wäre) */
    key() {
      const f = this.fen().split(' ');
      let ep = '-';
      if (this.ep >= 0) {
        const me = this.turn;
        const cap = PAW[1 - me][this.ep].some((s) => this.b[s] === P + (me ? 8 : 0));
        if (cap) ep = f[3];
      }
      return `${f[0]} ${f[1]} ${f[2]} ${ep}${this.variant === 'chk3' ? ' ' + this.checks.join('') : ''}`;
    }

    isAttacked(sq, by) {
      const b = this.b;
      const pawn = P + (by ? 8 : 0);
      for (const s of PAW[1 - by][sq]) if (b[s] === pawn) return true;
      const kn = N + (by ? 8 : 0);
      for (const s of KN[sq]) if (b[s] === kn) return true;
      const kg = K + (by ? 8 : 0);
      for (const s of KG[sq]) if (b[s] === kg) return true;
      const bq = by ? 8 : 0;
      for (const d of BISHOP_DIRS) {
        for (const s of RAY[sq][d]) {
          const q = b[s];
          if (!q) continue;
          if (q === B + bq || q === Q + bq) return true;
          break;
        }
      }
      for (const d of ROOK_DIRS) {
        for (const s of RAY[sq][d]) {
          const q = b[s];
          if (!q) continue;
          if (q === R + bq || q === Q + bq) return true;
          break;
        }
      }
      return false;
    }

    inCheck(color) {
      if (this.variant === 'anti') return false;
      const c = color == null ? this.turn : color;
      return this.isAttacked(this.king[c], 1 - c);
    }

    /** Alle Züge ohne Prüfung auf Königssicherheit. capsOnly: nur Schläge und Damenumwandlungen (für die Ruhesuche) */
    pseudo(capsOnly) {
      const out = [];
      const b = this.b;
      const me = this.turn;
      const anti = this.variant === 'anti';
      for (let sq = 0; sq < 64; sq++) {
        const p = b[sq];
        if (!p || colorOf(p) !== me) continue;
        const t = typeOf(p);
        if (t === P) {
          const dir = me ? -1 : 1;
          const r = sq >> 3;
          const last = me ? 0 : 7;
          const startRank = me ? 6 : 1;
          const f1 = sq + 8 * dir;
          const promoTypes = (to) => ((to >> 3) === last ? (this.variant === 'horse' ? [N] : capsOnly ? [Q] : anti ? [Q, R, B, N, K] : [Q, R, B, N]) : null);
          if (f1 >= 0 && f1 < 64 && !b[f1]) {
            const pr = promoTypes(f1);
            if (pr) { for (const x of pr) out.push(mkMove(sq, f1, x, 0)); } else if (!capsOnly) {
              out.push(mkMove(sq, f1, 0, 0));
              if (r === startRank && !b[f1 + 8 * dir]) out.push(mkMove(sq, f1 + 8 * dir, 0, 16));
            }
          }
          for (const to of PAW[me][sq]) {
            const q = b[to];
            if (q && colorOf(q) !== me) {
              const pr = promoTypes(to);
              if (pr) for (const x of pr) out.push(mkMove(sq, to, x, 1)); else out.push(mkMove(sq, to, 0, 1));
            } else if (!q && to === this.ep) out.push(mkMove(sq, to, 0, 3));

        } else if (t === N || t === K) {
          for (const to of (t === N ? KN[sq] : KG[sq])) {

          }

          const dirs = t === B ? BISHOP_DIRS : t === R ? ROOK_DIRS : null;
          for (let d = 0; d < 8; d++) {

            for (const to of RAY[sq][d]) {
              const q = b[to];
              if (!q) { if (!capsOnly) out.push(mkMove(sq, to, 0, 0)); continue; }
              if (colorOf(q) !== me) out.push(mkMove(sq, to, 0, 1));
              break;
            }
          }
        }
      }
      if (!capsOnly && !anti && (this.castle & (me ? 12 : 3))) {
        // Rochade (auch Chess960): König und Turm unbewegt, alle Felder zwischen Start und Ziel von König und Turm frei
        // (außer den beiden selbst), König steht nicht im Schach und zieht nicht über bedrohte Felder. Ziele: g/f bzw. c/d.
        const k = this.king[me];
        if (!this.isAttacked(k, 1 - me)) {
          for (let side = 0; side < 2; side++) {
            if (!(this.castle & (1 << (me * 2 + side)))) continue;
            const rs = this.rk[me * 2 + side];
            const kt = me * 56 + (side ? 2 : 6); const rt = me * 56 + (side ? 3 : 5);
            let ok = true;
            for (let x = Math.min(k, rs, kt, rt), hi = Math.max(k, rs, kt, rt); x <= hi && ok; x++) if (b[x] && x !== k && x !== rs) ok = false;
            for (let x = Math.min(k, kt), hi = Math.max(k, kt); x <= hi && ok; x++) if (this.isAttacked(x, 1 - me)) ok = false;
            if (ok) out.push(mkMove(k, kt, 0, side ? 8 : 4));
          }
        }
      }
      return out;
    }

    make(m) {
      const b = this.b;
      const from = mFrom(m); const to = mTo(m); const promo = mPromo(m); const fl = mFlags(m);
      const p = b[from];
      const me = this.turn;
      const castle = (fl & 12) !== 0;
      const u = { m, cap: castle ? 0 : b[to], castle: this.castle, ep: this.ep, half: this.half, h1: this.h1, h2: this.h2, k0: this.king[0], k1: this.king[1], c0: this.checks[0], c1: this.checks[1], capSq: to };
      this.stack.push(u);
      this.hist.push(this.h1, this.h2);
      let a = this.h1; let c = this.h2;
      const x = (q, s) => { a ^= ZP[q][s][0]; c ^= ZP[q][s][1]; };
      a ^= ZC[this.castle][0]; c ^= ZC[this.castle][1];
      const oldEp = this.ep >= 0 ? this.ep : 64;
      a ^= ZE[oldEp][0]; c ^= ZE[oldEp][1];
      if (castle) {
        // König und Turm erst beide vom Brett nehmen, dann setzen (in Chess960 können Ziel- und Ausgangsfelder zusammenfallen)
        const rf = this.rk[me * 2 + (fl & 8 ? 1 : 0)]; const rt = me * 56 + (fl & 8 ? 3 : 5);
        const rook = b[rf];
        x(p, from); x(rook, rf); b[from] = 0; b[rf] = 0;
        b[to] = p; b[rt] = rook; x(p, to); x(rook, rt);
        this.king[me] = to;
      } else {
        if (fl & 2) { // en passant
          const cs = to + (me ? 8 : -8);
          u.cap = b[cs]; u.capSq = cs;
          x(b[cs], cs); b[cs] = 0;
        } else if (b[to]) x(b[to], to);
        x(p, from);
        b[from] = 0;
        let np = p;
        if (promo) np = promo + (me ? 8 : 0);
        b[to] = np; x(np, to);
        if (typeOf(np) === K && this.variant !== 'anti') this.king[me] = to;
      }
      this.castle &= this.cm[from] & this.cm[to];
      this.ep = (fl & 16) ? (from + to) >> 1 : -1;
      this.half = (typeOf(p) === P || u.cap) ? 0 : this.half + 1;
      if (me) this.full++;
      this.turn = 1 - me;
      a ^= ZT[0]; c ^= ZT[1];
      a ^= ZC[this.castle][0]; c ^= ZC[this.castle][1];
      const ni = this.ep >= 0 ? this.ep : 64;
      a ^= ZE[ni][0]; c ^= ZE[ni][1];
      if (this.variant === 'chk3' && this.isAttacked(this.king[1 - me], me)) {
        a ^= ZK[me][this.checks[me]][0]; c ^= ZK[me][this.checks[me]][1];
        this.checks[me]++;
        a ^= ZK[me][this.checks[me]][0]; c ^= ZK[me][this.checks[me]][1];
      }
      if (this.variant === 'evo' && me === 1 && (this.full - 1) % EVO_EVERY === 0) {
        // Bauernreife: der am weitesten vorgerückte Bauer jeder Seite (bei Gleichstand der mit dem kleineren Feldindex) wächst eine Stufe
        const np = EVO_TIER[Math.min(4, (this.full - 1) / EVO_EVERY)];
        u.evo = [];
        for (let col = 0; col < 2; col++) {
          const pawn = P + col * 8;
          let best = -1;
          for (let sq = 0; sq < 64; sq++) if (b[sq] === pawn && (best < 0 || (col ? (sq >> 3) < (best >> 3) : (sq >> 3) > (best >> 3)))) best = sq;
          if (best < 0) continue;
          const nq = np + col * 8;
          x(pawn, best); b[best] = nq; x(nq, best);
          u.evo.push([best, pawn, nq]);
        }
      }
      this.h1 = a; this.h2 = c;
    }

    /** Die Bauernreife des letzten Zugs: [[Feld, alte Figur, neue Figur], …] (nur Variante 'evo') */
    lastEvo() { const u = this.stack[this.stack.length - 1]; return u && u.evo ? u.evo.slice() : []; }

    unmake() {
      const u = this.stack.pop();
      this.hist.length -= 2;
      const b = this.b;
      if (u.evo) for (const [sq, old] of u.evo) b[sq] = old;
      const m = u.m;
      const from = mFrom(m); const to = mTo(m); const fl = mFlags(m);
      const me = 1 - this.turn;
      this.turn = me;
      if (me) this.full--;
      if (fl & 12) {
        const rf = this.rk[me * 2 + (fl & 8 ? 1 : 0)]; const rt = me * 56 + (fl & 8 ? 3 : 5);
        const king = b[to]; const rook = b[rt];
        b[to] = 0; b[rt] = 0; b[from] = king; b[rf] = rook;
      } else {
        let p = b[to];
        if (mPromo(m)) p = P + (me ? 8 : 0);
        b[from] = p;
        b[to] = 0;
        if (fl & 2) b[u.capSq] = u.cap; else b[to] = u.cap;
      }
      this.castle = u.castle; this.ep = u.ep; this.half = u.half; this.h1 = u.h1; this.h2 = u.h2;
      this.king[0] = u.k0; this.king[1] = u.k1;
      this.checks[0] = u.c0; this.checks[1] = u.c1;
    }

    /** Legale Züge (in „Schlagzwang“: Schlagen ist Pflicht, der König darf geschlagen werden) */
    legal() {
      const ps = this.pseudo(false);
      if (this.variant === 'anti') {
        const caps = ps.filter((m) => mFlags(m) & 1);
        return caps.length ? caps : ps;
      }
      const me = this.turn;
      const out = [];
      for (const m of ps) {
        this.make(m);
        if (!this.isAttacked(this.king[me], 1 - me)) out.push(m);
        this.unmake();
      }
      return out;
    }

    /** Ausgangsfeld des Turms einer Rochade */
    rookSq(m) { return this.rk[this.turn * 2 + (mFlags(m) & 8 ? 1 : 0)]; }

    /**
     * Zug zu Von-/Nach-Feld finden. Bei Chess960 gilt auch „König auf den eigenen Turm“ als Rochade
     * (nötig, wenn der König schon auf dem Zielfeld steht oder ein normaler Königsschritt dasselbe Feld hätte).
     */
    findMove(from, to, promo) {
      const ls = this.legal();
      let castleHit = 0;
      for (const m of ls) {
        if (mFrom(m) !== from || mTo(m) !== to || (mPromo(m) || 0) !== (promo || 0)) continue;
        if (!(mFlags(m) & 12)) return m;
        castleHit = m;
      }
      if (castleHit) return castleHit;

      return { phase: 'intro', mode: cfg.mode === 'leben' ? 'leben' : 'punkte', lives: Object.fromEntries(room.players.map((p) => [p.id, LIVES])), out: {}, qs: pickMixed(room, cfg.n, cfg.diff), qi: 0, time: cfg.time, diff: cfg.diff, q: null, answers: {}, reveal: null, streak: {}, right: {}, total_: {}, deadline: 0, total: 0, qStart: 0, order: [] };

    act(room, pid, msg) {

    gone(room) {
      const g = room.game;
      if (g && g.phase === 'q' && voters(room, g).every((x) => g.answers[x.id])) resolve(room, g);

    view(room, pid) {

      const v = {

  UI.blitz = (v, ctx) => {

    } else if (v.phase === 'q') root.append(qScreen(v, ctx));

'use strict';
/*
 * Knallbunt (früher Farbwirbel): Kartenspiel im Stil der bekannten Ablegespiele, mit eigenen Sonderkarten.
 * Dies ist die Anbindung an den Raum (nur Host): Einstellungen, Zeitgeber, Punkte über mehrere Runden und die
 * Ansicht pro Spieler. Die eigentlichen Regeln stehen in cards_engine.js.
 */
(function () {
  const { GAMES, T } = PG;
  const B = PG.Bots;
  const E = PG.CardsEngine;
  const WIN_MS = 5000; // Zeitfenster für die Siegbremse

  const pl = (room, id) => room.players.find((p) => p.id === id);
  const ORDER_KEY = (c) => (c.c === -1 ? 9 : c.c) * 1000 + (typeof c.v === 'number' ? c.v : 100 + ['skip', 'rev', 'd2', 'flip', 'swap', 'wave', 'mirror', 'double', 'thief', 'bomb', 'gift', 'tidy', 'freeze', 'wheel', 'brake', 'wild', 'wild4'].indexOf(c.v));

  function opts(cfg) {
    return { flip: !!cfg.flip, random: !!cfg.random, stack: !!cfg.stack, deal: cfg.deal, chaos: Object.assign({}, cfg.chaos) };
  }

  function newRound(room, g) {
    cancelTimers(room, g);
    g.round++;
    g.s = E.create(g.ids, opts(g.cfg), g.names, (g.round - 1) % g.ids.length);
    g.phase = 'play';
    g.res = null;
    g.moveNo = 0;
    resetTurnTimer(room, g);
    botSchedule(room, g);
  }

  function cancelTimers(room, g) {
    if (g.botTimer) room.cancel(g.botTimer);
    g.botTimer = null;
    if (g.turnTimer) room.cancel(g.turnTimer);
    if (g.winTimer) room.cancel(g.winTimer);
    g.turnTimer = null;
    g.winTimer = null;
    g.deadline = 0;
    g.total = 0;
  }

  function resetTurnTimer(room, g) {
    const s = g.s;
    if (g.turnTimer) room.cancel(g.turnTimer);
    g.turnTimer = null;
    if (g.phase !== 'play' || s.phase !== 'play') { g.deadline = 0; g.total = 0; return; }
    const p = pl(room, E.curId(s));
    const offline = !p || !p.connected;
    const ms = offline ? 2500 : g.cfg.time * 1000;
    if (!ms) { g.deadline = 0; g.total = 0; return; }
    g.total = T(ms);
    g.deadline = Date.now() + g.total;
    g.turnTimer = room.after(g.total, () => {
      g.turnTimer = null;
      if (g.phase !== 'play' || s.phase !== 'play') return;
      const pid = E.curId(s);
      const a = E.autoPlay(s); // ziehen
      if (a.ok && s.phase === 'play' && s.drew != null && E.curId(s) === pid) E.autoPlay(s); // und passen
      g.moveNo++;
      afterMove(room, g, true);
    });
  }

  /** Nach jeder Aktion: Rundenende, Siegfenster und Zeitgeber neu setzen. */
  function afterMove(room, g, reset) {
    const s = g.s;
    if (s.phase === 'roundEnd') { settle(room, g); room.changed(); return; }
    if (s.phase === 'window') {
      if (g.turnTimer) { room.cancel(g.turnTimer); g.turnTimer = null; }
      if (!g.winTimer) {
        g.total = T(WIN_MS);
        g.deadline = Date.now() + g.total;
        g.winTimer = room.after(g.total, () => { g.winTimer = null; E.closeWindow(s); afterMove(room, g, true); });
      }
    } else {
      if (g.winTimer) { room.cancel(g.winTimer); g.winTimer = null; }
      if (reset || !g.turnTimer) resetTurnTimer(room, g);
    }
    botSchedule(room, g);
    if (s.catchTarget != null && g.catchSeen !== s.catchUntil) {
      g.catchSeen = s.catchUntil;
      room.after(E.CATCH_MS + 120, () => room.changed()); // Knopf „Erwischt!“ ausblenden
    }
    room.changed();
  }

  /** Bots: Zug ausführen sowie Reaktionen (Erwischen, Siegbremse) planen */
  function botSchedule(room, g) {
    if (g.botTimer) { room.cancel(g.botTimer); g.botTimer = null; }
    if (g.phase !== 'play') return;
    const s = g.s;
    const rnd = B.rnd;
    if (s.phase === 'play') {
      const pid = E.curId(s);
      const p = pl(room, pid);
      if (p && p.bot) g.botTimer = room.after(T(B.think(p.bot)), () => { g.botTimer = null; botAct(room, g, pid); });
      if (s.catchTarget != null && g.botCatchFor !== s.catchUntil) {
        g.botCatchFor = s.catchUntil;
        for (const q of room.players) {
          if (!q.bot || q.id === s.catchTarget || !g.ids.includes(q.id) || Math.random() >= B.LEVEL[q.bot].catch) continue;
          room.after(T(rnd(700, 2800)), () => {
            if (g.phase !== 'play') return;
            const r = E.act(s, q.id, { a: 'catch' }, Date.now());
            if (r.ok) afterMove(room, g, false);
          });
        }
      }
    } else if (s.phase === 'window' && g.botWin !== s.window) {
      g.botWin = s.window;
      for (const q of room.players) {
        if (!q.bot || !g.ids.includes(q.id) || Math.random() >= B.LEVEL[q.bot].brake) continue;
        room.after(T(rnd(500, 2500)), () => {
          if (g.phase !== 'play' || s.phase !== 'window') return;
          const r = E.act(s, q.id, { a: 'brake' }, Date.now());
          if (r.ok) afterMove(room, g, true);
        });
      }
    }
  }

  function botAct(room, g, pid) {
    const s = g.s;
    if (g.phase !== 'play' || s.phase !== 'play' || E.curId(s) !== pid) return;
    const p = pl(room, pid);
    if (!p || !p.bot) return;
    const me = s.players.find((x) => x.id === pid);
    if (me.hand.length <= 2 && !me.called && Math.random() < B.LEVEL[p.bot].call) E.act(s, pid, { a: 'call' }, Date.now());
    let r = E.act(s, pid, B.cardsMove(s, pid, p.bot), Date.now());
    if (!r.ok) r = E.autoPlay(s);
    g.moveNo++;
    afterMove(room, g, true);
  }

  function settle(room, g) {
    const s = g.s;
    cancelTimers(room, g);
    const w = s.winner;
    g.scores[w] = (g.scores[w] || 0) + s.roundPoints;
    g.res = {
      winner: w,
      pts: s.roundPoints,
      rest: Object.assign({}, s.rest),
      left: Object.fromEntries(s.players.map((p) => [p.id, p.hand.length])),
    };
    g.wins[w] = (g.wins[w] || 0) + 1;
    g.phase = g.round >= g.cfg.rounds ? 'end' : 'roundEnd';

  /** Gesamtwertung: Punkte, bei Gleichstand mehr gewonnene Runden. Wer dann noch gleichauf ist, teilt sich den Platz. */
  function standings(g) {

    const order = g.ids.slice().sort((a, b) => key(b) - key(a));
    const top = order.filter((id) => key(id) === key(order[0]));

  GAMES.cards = {
    id: 'cards',
    name: 'Knallbunt',
    emoji: '🎴',
    order: 2,
    ready: true,
    teams: false,
    blurb: 'Farben und Zahlen ablegen, wer zuerst keine Karten mehr hat, gewinnt. Mit Sonderkarten, Flip- und Zufalls-Modus.',
    setSetting(room, key, val) {
      const c = room.settings.cards;
      if (['flip', 'random', 'stack'].includes(key)) c[key] = !!val;
      else if (key === 'time' && [0, 15, 20, 30, 45, 60, 90].includes(val)) c.time = val;
      else if (key === 'rounds' && [1, 3, 5, 7].includes(val)) c.rounds = val;
      else if (key === 'deal' && [5, 7, 10].includes(val)) c.deal = val;
      else if (key === 'chaosAll') E.ALL_CHAOS.forEach((t) => { c.chaos[t] = !!val; });
      else if (typeof key === 'string' && key.startsWith('chaos.')) {
        const t = key.slice(6);
        if (E.ALL_CHAOS.includes(t)) c.chaos[t] = !!val;
      }
    },
    canStart(room) {
      const n = room.players.filter((p) => p.connected).length;
      if (n < 2) return 'Du brauchst mindestens 2 Spieler.';
      return null;
    },
    init(room) {
      const cfg = JSON.parse(JSON.stringify(room.settings.cards));
      const ps = room.players.filter((p) => p.connected);
      const ids = ps.map((p) => p.id);
      const g = {
        cfg, ids, names: Object.fromEntries(ps.map((p) => [p.id, p.name])), scores: Object.fromEntries(ids.map((i) => [i, 0])),
        round: 0, wins: {}, s: null, phase: 'play', res: null, turnTimer: null, winTimer: null, deadline: 0, total: 0, moveNo: 0, err: {}, errN: 0, catchSeen: 0,
      };
      return g;
    },
    begin(room) { newRound(room, room.game); },
    act(room, pid, msg) {
      const g = room.game;
      const isHost = pid === room.hostId;
      if (msg.a === 'next') { if (isHost && g.phase === 'roundEnd') { newRound(room, g); room.changed(); } return; }
      if (msg.a === 'again') { if (isHost && g.phase === 'end') room.restartGame(); return; }
      if (g.phase !== 'play' || !['play', 'draw', 'pass', 'call', 'catch', 'brake'].includes(msg.a)) return;
      if (!g.ids.includes(pid)) return;
      const a = { a: msg.a };
      if (msg.a === 'play') {
        a.id = msg.id;
        if (typeof msg.color === 'number') a.color = msg.color;
        if (typeof msg.target === 'string') a.target = msg.target.slice(0, 40);
      }
      const r = E.act(g.s, pid, a, Date.now());
      if (!r.ok) {
        g.errN++;
        g.err[pid] = { text: r.error, n: g.errN, until: Date.now() + 3000 };
        room.changed();
        return;
      }
      afterMove(room, g, msg.a !== 'call' && msg.a !== 'catch');
    },
    gone(room, pid) {

'use strict';
/*
 * Schach: Spiellogik (läuft nur im Host). Die Regeln stehen in chess_engine.js, die Oberfläche in game_chess_ui.js.
 * Formate: Duell (zwei Personen, beliebig viele Partien mit Farbwechsel), Jeder gegen jeden, K.O.-Turnier und
 * Gruppenphase (Gruppen mit höchstens vier Personen, jede gegen jede) mit anschließendem K.O.-Finale der Gruppensieger.
 * Es läuft immer genau eine Partie; alle anderen schauen live zu. Der Host ist die einzige Instanz, die Züge, Uhren,
 * Aufgabe, Remis und Turnierstand entscheidet. Bots rechnen im Host (Web Worker, falls verfügbar).
 * Varianten: Standard, King of the Hill, Drei Schachs, Schlagzwang, Springerschach (nur Springer), Bauernreife (Bauern wachsen). Dazu unabhängig: Chess960 (zufällige Grundaufstellung, eine Zahl 0–959).
 */
(function () {
  const { T, shuffle, pick, GAMES } = PG;

  const FORMATS = [['duel', 'Duell'], ['rr', 'Jeder gegen jeden'], ['ko', 'K.O.-Turnier'], ['groups', 'Gruppen + Finale']];
  const VARIANTS = [['std', 'Standard'], ['koth', 'King of the Hill'], ['chk3', 'Drei Schachs'], ['anti', 'Schlagzwang'], ['horse', 'Springerschach'], ['evo', 'Bauernreife']];
  const TIMES = [0, 1, 3, 5, 10, 15]; // Minuten pro Person, 0 = ohne Uhr
  const INCS = [0, 2, 5]; // Sekunden Zuschlag pro Zug
  const PROMO = { q: 5, r: 4, b: 3, n: 2, k: 6 };
  const AUTO_MS = 18000;
  const DC_MS = 45000;
  const GROUP_MAX = 4;
  const minNeeded = { duel: 2, rr: 3, ko: 3, groups: 5 };

  const C = () => PG.Chess;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pl = (room, id) => room.players.find((p) => p.id === id);
  const pow2 = (n) => { let s = 1; while (s < n) s *= 2; return s; };
  const KO_NAMES = { 2: 'Finale', 4: 'Halbfinale', 8: 'Viertelfinale' };

  /** Wer nimmt teil? Alle anwesenden Personen außer denen, die der Host auf „schaut zu“ gestellt hat */
  const participants = (room) => room.players.filter((p) => p.connected && !(room.settings.chess.out || {})[p.id]);

  /* ---------- Spielpläne (rein, auch für Tests) ---------- */

  /** Jeder gegen jeden nach dem Kreisverfahren: Liste von Runden mit Paaren [weiß, schwarz] */
  function roundRobin(ids, double) {
    const list = ids.slice();
    if (list.length % 2) list.push(null);
    const n = list.length;
    const rounds = [];
    const whites = Object.fromEntries(ids.map((id) => [id, 0]));
    for (let r = 0; r < n - 1; r++) {
      const pairs = [];
      for (let i = 0; i < n / 2; i++) {
        const a = list[i]; const b = list[n - 1 - i];
        if (a == null || b == null) continue;
        // Weiß bekommt, wer bisher seltener Weiß hatte (bei Gleichstand wechselt es nach Brett und Runde)
        const flip = whites[a] === whites[b] ? (r + i) % 2 === 1 : whites[a] > whites[b];
        const pr = flip ? [b, a] : [a, b];
        whites[pr[0]]++;
        pairs.push(pr);
      }
      rounds.push(pairs);
      list.splice(1, 0, list.pop());
    }
    if (double) for (const r of rounds.slice()) rounds.push(r.map(([a, b]) => [b, a]));
    return rounds;
  }

  /** Gruppen möglichst gleich groß, höchstens GROUP_MAX Personen */
  function makeGroups(ids) {
    const k = Math.ceil(ids.length / GROUP_MAX);
    const groups = Array.from({ length: k }, (_, i) => ({ name: 'Gruppe ' + String.fromCharCode(65 + i), ids: [] }));
    ids.forEach((id, i) => groups[i % k].ids.push(id));
    return groups;
  }

  /** Spielstärke-Aufteilung einer K.O.-Runde: Wer in der ersten Runde nicht spielen muss, hat ein Freilos */
  function koSplit(alive) {
    const size = pow2(alive.length);
    const m = alive.length - size / 2;
    const pairs = [];
    for (let i = 0; i < m; i++) pairs.push([alive[2 * i], alive[2 * i + 1]]);

  }

  /** Tabelle aus Ergebnissen: Punkte, Siege, direkter Vergleich, zuletzt fester Losentscheid */
  function standings(results, ids, grp, coin) {
    const rows = ids.map((id) => ({ id, pts: 0, w: 0, d: 0, l: 0, g: 0 }));
    const by = Object.fromEntries(rows.map((r) => [r.id, r]));
    const mine = results.filter((r) => r.grp === grp && by[r.white] && by[r.black]);
    for (const r of mine) {
      const a = by[r.white]; const b = by[r.black];
      a.g++; b.g++;
      if (r.winner == null) { a.pts += 0.5; b.pts += 0.5; a.d++; b.d++; }
      else if (r.winner === r.white) { a.pts += 1; a.w++; b.l++; }
      else { b.pts += 1; b.w++; a.l++; }

    rows.sort((x, y) => y.pts - x.pts || y.w - x.w);

    for (let i = 0; i < rows.length;) {
      let j = i;
      while (j < rows.length && rows[j].pts === rows[i].pts && rows[j].w === rows[i].w) j++;

      if (tied.length > 1) {

        for (const r of mine) {
          if (!set.has(r.white) || !set.has(r.black)) continue;

  const info = (room, g, id) => { const p = pl(room, id); return { id, name: p ? p.name : g.names[id] || '?', color: p ? p.color : g.colors[id] || '#888', bot: !!(p && p.bot), connected: !!(p && p.connected) }; };

  /* ---------- Zustand der Partie-Ansicht ---------- */

  /** Alle erlaubten Züge der aktuellen Stellung (lokal mit derselben Engine wie der Host) */
  function movesFor(from) {
    const v = CH.v; const m = v.m;
    if (CH.legalFen !== m.fen) {
      const C = PG.Chess;
      const map = new Map();
      try {
        const pos = C.Pos.fromFen(m.fen, v.variant);
        const castles = [];
        for (const mv of pos.legal()) {
          const f = C.mFrom(mv); const t = C.mTo(mv); const pr = C.mPromo(mv);
          if (!map.has(f)) map.set(f, new Map());
          if (C.mFlags(mv) & 12) { castles.push(mv); continue; }
          const mm = map.get(f);
          if (!mm.has(t)) mm.set(t, { to: t, promos: [] });
          if (pr) mm.get(t).promos.push(pr);
        }
        // Rochade: Zielfeld des Königs anklicken. In Chess960 geht auch „König auf den eigenen Turm“; das ist der einzige Weg,
        // wenn der König schon auf seinem Zielfeld steht oder ein normaler Königsschritt dasselbe Feld hätte.
        for (const mv of castles) {
          const f = C.mFrom(mv); const t = C.mTo(mv); const rs = pos.rookSq(mv); const mm = map.get(f);
          const base = pos.turn * 56;

  }

  function onMove(from, to, promo) {

  /* ---------- Bausteine ---------- */

  }

  function plBar(v, ctx, side) {

  /* ---------- Partie ---------- */
  function playScreen(v, ctx) {
    destroy();
    const B = PG.ChessBoard.create({
      getMoves: (sq) => (CH.v && playable() ? movesFor(sq) : []),
      onMove,
      onArrows: (n) => { if (CH.refs && CH.refs.clear) CH.refs.clear.hidden = n === 0; },

    CH.refs = {};
    const root = h('div', { class: 'chess' });

    root.__chess = true;
    root.append(
      CH.refs.head = h('div', { class: 'ch-head' }),
      h('div', { class: 'ch-grid' },
        h('div', { class: 'ch-left' }, CH.refs.top = h('div'), B.el, CH.refs.bottom = h('div'), CH.refs.bar = h('div', { class: 'ch-bar' }), CH.refs.offer = h('div'), CH.refs.look = h('div'), CH.refs.result = h('div')),

  function tick() {

  }

      } }, '🏳️ Aufgeben') : null);
  }

  function offerBox(v, ctx) {
    const m = v.m;

    const by = m.offer === 0 ? m.white : m.black;

    else o.append(h('div', { class: 'ch-offer', role: 'alert' }, h('span', null, by.name + ' bietet Remis an.'), h('button', { class: 'btn small', onclick: () => ctx.send({ a: 'drawyes' }) }, 'Annehmen'), h('button', { class: 'btn small alt', onclick: () => ctx.send({ a: 'drawno' }) }, 'Ablehnen')));
  }

  function resultBox(v, ctx) {

  }

  function updateSides(v, ctx) {
    const m = v.m;

  function update(v, ctx, first) {
    CH.v = v; CH.ctx = ctx;
    const m = v.m;
    const B = CH.board;
    const newGame = CH.key !== m.key;
    const brandNew = SEEN.key !== m.key;
    SEEN.key = m.key;
    if (newGame) {
      CH.key = m.key; CH.flip = null; CH.n = -1; CH.optN = -1; CH.resKey = null; CH.refused = m.refused;
      B.clearArrows(); B.deselect(); B.setArrowMode(false); B.setHint(null);
    }
    const orient = CH.flip != null ? CH.flip : (m.mine === 1 ? 1 : 0);
    B.setOrient(orient);
    const newMove = !newGame && m.n > CH.n && CH.n >= 0;
    const animate = newMove && m.n === CH.n + 1 && !!m.last;
    B.show(m.fen, { last: m.last ? { f: m.last.f, t: m.last.t, fl: m.last.fl, pr: m.last.pr, r: m.last.r } : null, animate, check: m.check, intro: brandNew });

      if (m.last.chk && !m.res) { sfx('ccheck'); B.say('Schach!', 'chk'); B.shake(); }
    }
    if (CH.n >= 0 && m.n > CH.n && Pc.Prefs.get().autoClear) B.clearArrows();
    CH.n = m.n;
    try { PG.Audio.setIntensity(!m.res && v.tc.min && m.run != null && Math.min(...m.clk) < 20000 ? 0.9 : 0.4); } catch (e) { /* egal */ }
    if (m.res && CH.resKey !== m.key) {
      CH.resKey = m.key;
      const r = m.res;
      if (r.reason === 'mate') { B.mate(r.winner === 0 ? 1 : 0); B.say('Schachmatt!', 'mate'); sfx(m.mine != null && m.mine === r.winner ? 'win' : m.mine != null ? 'lose' : 'end'); }
      else {
        B.say(r.winner == null ? 'Remis' : r.reason === 'time' ? 'Zeit!' : r.reason === 'resign' ? 'Aufgabe' : r.reason === 'center' ? 'König in der Mitte!' : r.reason === 'threechecks' ? 'Dritter Schach!' : r.reason === 'antichess' ? 'Alles geschlagen!' : 'Ende', r.winner == null ? 'draw' : 'mate');
        sfx(r.winner == null ? 'end' : m.mine != null && m.mine === r.winner ? 'win' : m.mine != null ? 'lose' : 'end');
      }
    }

    headBox(v);
    updateSides(v, ctx);

    offerBox(v, ctx);
    resultBox(v, ctx);

    const tb = tourBox(v, ctx);

  }

  /* ---------- Endstand ---------- */
  function endScreen(v, ctx) {
    destroy();
    const f = v.final || [];
    const top = f.filter((r) => r.rank <= 3);
    const medal = { 1: '🥇', 2: '🥈', 3: '🥉' };

      h('div', { class: 't' }, r.white + ' – ' + r.black, h('small', null, r.label + ' · ' + (r.res.winner == null ? 'Remis' : (r.res.winner === 0 ? r.white : r.black) + ' gewinnt') + ' · ' + r.n + ' Halbzüge')),

    const node = h('div', { class: 'chess' },

/*
 * Schätzrunde: Ein Gegenstand wird gezeigt, alle schätzen seine Größe oder seinen Preis. Je näher dran, desto mehr Punkte.
 * Solo: jede Person für sich. Team: Rot gegen Blau, jedes Teammitglied schätzt selbst; sind sich die Schätzungen im Team
 * uneinig, wird eine der abgegebenen Schätzungen ausgelost (jedes Mitglied zählt gleich).

 * Option „Doppel-Joker“: Jede Person (im Team: jedes Team) darf einmal pro Spiel eine Runde auswählen, in der ihre Punkte doppelt zählen.
 * Der wahre Wert steht nur im Host und wird erst bei der Auflösung in die Ansichten geschrieben.

  /* ---------- Hilfsfunktionen (auch für Tests) ---------- */

  /** Punkte je Schätzung: 1000 bei exakt, 0 bei Faktor 4 oder mehr daneben (logarithmisch, also fair für kleine und große Zahlen) */
  function score(guess, truth) {

    return Math.round(1000 * Math.max(0, 1 - Math.abs(Math.log(guess / truth)) / Math.log(4)));

  /** Zahl aus Texteingabe lesen. Komma oder Punkt als Dezimalzeichen; „1.000“ und „12.345.678“ zählen als Tausenderpunkte. */

    let t = String(text == null ? '' : text).replace(/[\s ']/g, '');
    if (!t) return null;
    if (t.includes(',') && t.includes('.')) t = t.replace(/\./g, '').replace(',', '.');
    else if (t.includes(',')) t = t.replace(',', '.');
    else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
    if (!/^\d*\.?\d+$/.test(t) && !/^\d+\.$/.test(t)) return null;
    const v = Number(t);

  const sig2 = (x) => { const p = Math.pow(10, Math.floor(Math.log10(x)) - 1); return Math.round(x / p) * p; };
  function botGuess(truth, level) {
    const s = SIGMA[level] || 0.5;

    return Math.max(0.01, sig2(truth * Math.exp(z * s)));

  /** Team-Entscheid: eine Schätzung wird gewählt. Einigkeit = alle abgegebenen Werte gleich, sonst entscheidet das Los. */
  function teamPick(guesses) {
    if (!guesses.length) return { chosen: null, how: 'none' };
    if (guesses.length === 1) return { chosen: guesses[0], how: 'single' };
    if (guesses.every((g) => g.value === guesses[0].value)) return { chosen: guesses[0], how: 'agree' };
    return { chosen: pick(guesses), how: 'draw' };

  const fmt = (v, u) => {
    if (v == null) return '–';
    const int = Number.isInteger(v);
    const s = v.toLocaleString('de-DE', u === '€' ? { minimumFractionDigits: int ? 0 : 2, maximumFractionDigits: 2 } : { maximumFractionDigits: v < 10 ? 3 : 1 });
    return s + ' ' + u;
  };
  const dev = (g, t) => {
    const r = g / t;
    if (Math.abs(r - 1) < 0.005) return 'genau getroffen';
    if (r >= 2) return '×' + (Math.round(r * 10) / 10).toLocaleString('de-DE') + ' zu hoch';
    if (r <= 0.5) return '×' + (Math.round(10 / r) / 10).toLocaleString('de-DE') + ' zu niedrig';

  };

  const pl = (room, pid) => room.players.find((p) => p.id === pid);

    setDeadline(g, T(g.reveal.draw ? 14000 : 11000));
    room.after(g.total, () => next(room, g));
    room.changed();
  }

  function next(room, g) {
    if (g.phase !== 'reveal') return;
    room.clearTimers();
    g.qi++;
    if (g.qi < g.items.length) return ask(room, g);
    g.phase = 'end';
    g.deadline = 0;
    g.total = 0;
    const rk = ranking(g);
    g.final = { order: rk.map((r) => r.id), winners: rk.filter((r) => r.total === rk[0].total).map((r) => r.id) };
    room.changed();
  }

  GAMES.guess = {
    id: 'guess',
    name: 'Schätzrunde',
    emoji: '🔮',
    order: 2.5,
    ready: true,
    teams: (room) => isTeam(room),
    blurb: 'Gegenstände schätzen: wie groß oder wie teuer? Wer am nächsten dran ist, bekommt die meisten Punkte. Solo oder im Team.',
    setSetting(room, key, val) {
      const s = room.settings.guess;

    },
    canStart(room) {

      if (isTeam(room)) {
        for (let t = 0; t < TEAMS.length; t++) if (!room.players.some((p) => p.connected && p.team === t)) return 'In jedem Team muss mindestens eine Person sein.';

    init(room) {

      const g = room.game;

      const v = {
        phase: g.phase, team: g.team, kind: g.kind, qi: g.qi, n: g.items.length, time: g.time, remaining: Math.max(0, g.deadline - Date.now()), total: g.total,

  UI.guess = (v, ctx) => {
