.chb-sq.chk::after { background: radial-gradient(circle at 50% 55%, rgba(255, 40, 40, 0.95) 0, rgba(255, 40, 40, 0.55) 45%, rgba(255, 40, 40, 0) 75%); animation: chb-chk 0.9s ease-in-out infinite alternate; }
.chb-sq.tgt::before { content: ''; position: absolute; left: 35%; top: 35%; width: 30%; height: 30%; border-radius: 50%; background: rgba(20, 30, 40, 0.3); z-index: 3; }
.chb-sq.tgt.cap::before { left: 4%; top: 4%; width: 92%; height: 92%; background: none; border: 6px solid rgba(20, 30, 40, 0.3); }
.chb-sq i { position: absolute; font: 800 10px/1 var(--body); opacity: 0.85; font-style: normal; pointer-events: none; }
.chb-sq.l i { color: var(--d); }
.chb-sq.d i { color: var(--l); }
.chb-sq i.f { right: 3px; bottom: 2px; }
.chb-sq i.r { left: 3px; top: 2px; }
.chb-svg { z-index: 4; overflow: visible; }

/* ---------- Figuren ---------- */
.chp { position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%; z-index: 2; transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.3, 1); will-change: transform; }
.chp.mv { z-index: 6; }
.chp.drag { z-index: 8; transition: none !important; }
.chp.drag .chp-i { transform: scale(1.18) translateY(-8%); }
.chp-i { position: absolute; inset: 1%; background-size: contain; background-repeat: no-repeat; background-position: 50% 100%; filter: drop-shadow(0 2px 1.5px rgba(0, 0, 0, 0.3)); transform-origin: 50% 92%; }
.chp.pix .chp-i { image-rendering: pixelated; }
.idle .chp-i { animation: chb-breathe 3.6s ease-in-out infinite; }
.chp.sel .chp-i { animation: chb-wobble 0.55s ease-in-out infinite; transform: translateY(-6%) scale(1.07); }
.chp-i.hop { animation: chb-hop var(--ms, 380ms) cubic-bezier(0.3, 0.1, 0.3, 1) both !important; }
.chp-i.step { animation: chb-step var(--ms, 260ms) ease-out both !important; }
.chp-i.glide { animation: chb-glide var(--ms, 300ms) ease-out both !important; }
.chp-i.promo { animation: chb-promo 0.7s ease-out both !important; }
.chp-i.topple { animation: chb-topple 1.1s cubic-bezier(0.5, 0, 0.7, 1) 0.15s both !important; }
.chp-i.cheer { animation: chb-cheer 0.7s ease-in-out 0.2s infinite alternate !important; }
.chp.gone { animation: chb-gone 0.42s ease-in both; pointer-events: none; z-index: 7; }
.chp.spawn { animation: chb-spawn 0.5s cubic-bezier(0.3, 1.4, 0.5, 1) both; }

@keyframes chb-breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.025, 0.975); } }
@keyframes chb-wobble { 0%, 100% { transform: translateY(-6%) rotate(-4deg) scale(1.07); } 50% { transform: translateY(-9%) rotate(4deg) scale(1.07); } }
@keyframes chb-hop { 0% { transform: translateY(0) scale(1, 1); } 12% { transform: translateY(0) scale(1.12, 0.84); } 45% { transform: translateY(-62%) scale(0.92, 1.12) rotate(-6deg); } 78% { transform: translateY(-6%) scale(0.96, 1.06); } 90% { transform: translateY(0) scale(1.14, 0.82); } 100% { transform: translateY(0) scale(1, 1); } }
@keyframes chb-step { 0% { transform: scale(1, 1); } 35% { transform: translateY(-22%) scale(0.96, 1.08); } 80% { transform: translateY(0) scale(1.1, 0.88); } 100% { transform: scale(1, 1); } }
@keyframes chb-glide { 0% { transform: scale(1, 1); } 20% { transform: scale(1.05, 0.95) translateY(2%) rotate(-3deg); } 70% { transform: scale(0.98, 1.04) rotate(2deg); } 90% { transform: scale(1.1, 0.88); } 100% { transform: scale(1, 1); } }
@keyframes chb-promo { 0% { transform: scale(0.4) rotate(-20deg); filter: brightness(2); } 55% { transform: scale(1.3) rotate(6deg); filter: brightness(1.5); } 100% { transform: scale(1) rotate(0); filter: none; } }
@keyframes chb-topple { 0% { transform: rotate(0); } 25% { transform: rotate(-14deg) translateY(-4%); } 100% { transform: rotate(88deg) translate(8%, 24%) scale(0.95); } }
@keyframes chb-cheer { 0% { transform: translateY(0) scale(1, 1); } 100% { transform: translateY(-20%) scale(0.96, 1.08); } }
@keyframes chb-gone { 0% { transform-origin: 50% 50%; opacity: 1; } 30% { opacity: 1; filter: brightness(1.6); } 100% { opacity: 0; filter: brightness(2); } }
@keyframes chb-spawn { 0% { opacity: 0; scale: 0.3; translate: 0 -40%; } 100% { opacity: 1; scale: 1; translate: 0 0; } }
@keyframes chb-chk { 0% { opacity: 0.6; } 100% { opacity: 1; } }
.chb.shake { animation: chb-shake 0.5s ease-in-out; }
@keyframes chb-shake { 0%, 100% { transform: translate(0, 0); } 15% { transform: translate(-5px, 1px) rotate(-0.4deg); } 35% { transform: translate(5px, -1px) rotate(0.4deg); } 55% { transform: translate(-3px, 1px); } 75% { transform: translate(3px, 0); } }

/* ---------- Effekte ---------- */
.chb-fx { overflow: visible; z-index: 9; }
.chb-spark { position: absolute; font-size: 16px; line-height: 1; transform: translate(-50%, -50%); animation: chb-spark 0.7s ease-out forwards; text-shadow: 0 0 2px rgba(0, 0, 0, 0.5); }
@keyframes chb-spark { 0% { opacity: 1; transform: translate(-50%, -50%) scale(0.6); } 100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2) rotate(120deg); } }
.chb-say { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); padding: 8px 18px; border: 3px solid var(--ink); border-radius: 99px; background: #fff; font: 800 clamp(16px, 4vw, 26px) var(--display); box-shadow: 0 4px 0 var(--ink); animation: chb-say 1.4s ease-out forwards; white-space: nowrap; }
.chb-say.chk { background: #ffd1cc; color: #a11; }
.chb-say.mate { background: var(--yellow); }
.chb-say.draw { background: #e0e7ff; }
@keyframes chb-say { 0% { opacity: 0; transform: translate(-50%, -30%) scale(0.5); } 18% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); } 30% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -80%) scale(1); } }
.chb-conf { position: absolute; top: -6%; width: 9px; height: 14px; border-radius: 2px; animation: chb-conf 2s linear infinite; opacity: 0; }
@keyframes chb-conf { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 100% { opacity: 0.9; transform: translate(var(--sx), 115vh) rotate(720deg); } }
.chb-badge { position: absolute; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 99px; border: 2px solid #fff; color: #fff; font: 800 13px/22px var(--body); text-align: center; z-index: 10; box-shadow: 0 2px 3px rgba(0, 0, 0, 0.4); background: #64748b; }
.chb-badge.best, .chb-badge.excellent { background: #16a34a; }
.chb-badge.brilliant { background: #0ea5a4; }
.chb-badge.great { background: #4f7cff; }
.chb-badge.good { background: #65a30d; }
.chb-badge.inaccuracy { background: #ca8a04; }
.chb-badge.mistake { background: #ea580c; }
.chb-badge.blunder { background: #dc2626; }
.chb-badge.forced { background: #64748b; }

/* ---------- Umwandlung ---------- */
.chb-promo-layer { z-index: 12; display: none; }
.chb-promo-layer.on { display: block; background: rgba(20, 24, 50, 0.35); }
.chb-promo { position: absolute; display: flex; flex-direction: column; background: #fff; border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 5px 0 var(--ink); overflow: hidden; }
.chb-popt { flex: 1 1 0; border: 0; background-color: transparent; background-size: 88%; background-repeat: no-repeat; background-position: center; cursor: pointer; min-height: 0; }
.chb-popt:hover, .chb-popt:focus-visible { background-color: #ffe9a6; }

/* ---------- Oberfläche ---------- */
.chess { display: block; }
.ch-head { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 4px 0 8px; }
.ch-head .chip { font-size: calc(13px * var(--fs, 1)); padding: 2px 10px; }
.ch-head .chip.hl { background: var(--yellow); }
.ch-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
@media (min-width: 900px) { .ch-grid { grid-template-columns: minmax(0, 640px) minmax(280px, 1fr); align-items: start; } }
.ch-pl { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border: 3px solid var(--ink); border-radius: 14px; background: var(--card); min-height: 54px; }
.ch-pl.turn { background: #fff6d6; box-shadow: 0 0 0 3px var(--yellow); }
.ch-pl .who { flex: 1 1 auto; min-width: 0; line-height: 1.2; }
.ch-pl .who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ch-pl .who small { color: var(--muted); font-weight: 700; }
.ch-pl .side { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); flex: none; }
.ch-pl .side.w { background: #fff; }
.ch-pl .side.b { background: #1b2140; }
.ch-caps { display: flex; flex-wrap: wrap; align-items: center; min-height: 20px; gap: 0; }
.ch-caps .cp { width: 18px; height: 18px; margin-right: -6px; background-size: contain; background-repeat: no-repeat; background-position: center; }
.ch-caps em { font-style: normal; font-weight: 800; font-size: 13px; margin-left: 10px; color: var(--muted); }
.ch-clock { font: 800 clamp(18px, 4.6vw, 26px) var(--display); padding: 4px 12px; border: 3px solid var(--ink); border-radius: 10px; background: #fff; min-width: 5.2ch; text-align: center; font-variant-numeric: tabular-nums; }
.ch-clock.run { background: var(--yellow); }
.ch-clock.low { background: #ffb4ad; animation: ch-low 0.6s ease-in-out infinite alternate; }
@keyframes ch-low { to { transform: scale(1.06); } }
.ch-checks { font-size: 13px; font-weight: 800; letter-spacing: 1px; }
.ch-bar { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 8px; align-items: center; }
.ch-bar .btn.small { min-height: 38px; padding: 4px 10px; font-size: calc(14px * var(--fs, 1)); }
.ch-bar .btn.on { background: var(--ink); color: #fff; }
.ch-bar .sep { flex: 1 1 8px; }
.ch-col { display: inline-flex; gap: 4px; align-items: center; padding: 0 4px; }
.ch-col button { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--ink); cursor: pointer; padding: 0; }
.ch-col button[aria-pressed='true'] { box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--ink); }
.ch-offer { margin: 8px 0; padding: 10px 12px; border: 3px solid var(--ink); border-radius: 14px; background: #e8efff; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ch-offer span { flex: 1 1 160px; font-weight: 800; }
.ch-result { margin: 8px 0 4px; padding: 12px; border: 3px solid var(--ink); border-radius: 16px; background: #fff6d6; box-shadow: var(--sh); }
.ch-result h3 { font-size: calc(18px * var(--fs, 1)); margin-bottom: 4px; }
.ch-result .row { margin-top: 10px; }
.ch-result .hint { margin-top: 6px; }
.ch-side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.ch-moves { max-height: 210px; overflow: auto; display: flex; flex-wrap: wrap; gap: 2px 4px; align-content: flex-start; padding: 8px 10px; font-weight: 700; font-size: calc(15px * var(--fs, 1)); }
.ch-moves .no { color: var(--muted); width: 2.4em; text-align: right; flex: none; }
.ch-moves .mv { padding: 0 5px; border-radius: 6px; }
.ch-moves .mv.cur { background: var(--yellow); }
.ch-moves .empty { color: var(--muted); }
.ch-box h3 { font-size: calc(15px * var(--fs, 1)); margin-bottom: 8px; }
.ch-tbl { width: 100%; border-collapse: collapse; font-size: calc(15px * var(--fs, 1)); }
.ch-tbl th { text-align: left; font-size: 12px; color: var(--muted); padding: 2px 4px; }
.ch-tbl td { padding: 4px; border-top: 2px solid #e5e9f4; }
.ch-tbl td.n { text-align: right; font-variant-numeric: tabular-nums; }
.ch-tbl tr.me td { background: #fff6d6; }
.ch-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ink); margin-right: 6px; vertical-align: -1px; }
.ch-bracket { display: flex; flex-direction: column; gap: 10px; }
.ch-rnd h4 { margin: 0 0 4px; font: 800 13px var(--display); color: var(--muted); }
.ch-match { display: flex; gap: 6px; align-items: center; padding: 5px 8px; border: 2px solid #cfd6e8; border-radius: 10px; margin-bottom: 4px; font-size: calc(14px * var(--fs, 1)); flex-wrap: wrap; }
.ch-match.live { border-color: var(--ink); background: #fff6d6; }
.ch-match .vs { color: var(--muted); font-weight: 800; }
.ch-match .win { font-weight: 800; color: var(--ok); }
.ch-match .lose { color: var(--muted); text-decoration: line-through; }
.ch-match small { color: var(--muted); font-weight: 700; }
.ch-queue { margin: 0; padding: 0; list-style: none; font-size: calc(14px * var(--fs, 1)); }
.ch-queue li { padding: 3px 0; border-top: 2px solid #e5e9f4; }
.ch-queue small { color: var(--muted); }
.ch-podium { display: flex; justify-content: center; align-items: flex-end; gap: 10px; margin: 14px 0; }
.ch-podium .pd { flex: 1 1 0; max-width: 150px; text-align: center; border: 3px solid var(--ink); border-radius: 14px 14px 0 0; padding: 8px 4px; background: var(--card); }
.ch-podium .pd.r1 { background: #ffe58a; min-height: 130px; }
.ch-podium .pd.r2 { background: #e3e9f5; min-height: 104px; }
.ch-podium .pd.r3 { background: #f3d0b0; min-height: 86px; }
.ch-podium .pd .m { font-size: 30px; }
.ch-podium .pd b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ch-games { display: flex; flex-direction: column; gap: 6px; }
.ch-gr { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border: 2px solid #cfd6e8; border-radius: 10px; flex-wrap: wrap; }
.ch-gr .t { flex: 1 1 160px; font-size: calc(14px * var(--fs, 1)); }
.ch-gr .t small { display: block; color: var(--muted); }

/* Aussehen-Fenster */
.ch-look { margin: 8px 0; padding: 12px; }
.ch-look h4 { margin: 10px 0 6px; font: 800 13px var(--display); }
.ch-look h4:first-child { margin-top: 0; }
.ch-sets, .ch-pals { display: flex; flex-wrap: wrap; gap: 8px; }
.ch-setb { border: 3px solid var(--ink); border-radius: 12px; background: var(--card); padding: 4px 8px 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 800; font-size: 13px; }
.ch-setb[aria-pressed='true'] { background: var(--yellow); }
.ch-setb .pv { display: flex; }
.ch-setb .pv i { width: 28px; height: 28px; background-size: contain; background-repeat: no-repeat; background-position: center; margin-right: -4px; }
.ch-palb { border: 3px solid var(--ink); border-radius: 99px; padding: 3px 10px 3px 4px; background: var(--card); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 13px; }
.ch-palb[aria-pressed='true'] { background: var(--yellow); }
.ch-palb .dots { display: inline-flex; }
.ch-palb .dots i { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--ink); margin-right: -6px; }
.ch-brdb { border: 3px solid var(--ink); border-radius: 10px; padding: 3px; cursor: pointer; background: var(--card); display: inline-flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 800; font-size: 12px; }
.ch-brdb[aria-pressed='true'] { background: var(--yellow); }
.ch-brdb .mb { width: 44px; height: 44px; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); border-radius: 4px; overflow: hidden; }
.ch-tog { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.ch-tog button { border: 3px solid var(--ink); border-radius: 10px; background: var(--card); padding: 4px 10px; font-weight: 800; cursor: pointer; min-height: 38px; }
.ch-tog button[aria-pressed='true'] { background: var(--ink); color: #fff; }

/* Lobby */
.ch-plist { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.ch-pp { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border: 2px solid #cfd6e8; border-radius: 10px; }
.ch-pp span { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.ch-pp button { border: 3px solid var(--ink); border-radius: 10px; background: var(--card); padding: 2px 10px; font-weight: 800; cursor: pointer; min-height: 36px; }
.ch-pp button[aria-pressed='true'] { background: var(--mint); }

/* Analyse */
.cha { position: fixed; inset: 0; z-index: 60; background: var(--paper); overflow: auto; padding: 12px 14px 30px; }
.cha-in { max-width: 1060px; margin: 0 auto; }
.cha-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.cha-top h2 { font-size: calc(18px * var(--fs, 1)); flex: 1 1 200px; }
.cha-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
@media (min-width: 900px) { .cha-grid { grid-template-columns: minmax(0, 620px) minmax(280px, 1fr); align-items: start; } }
.cha-evalwrap { display: flex; gap: 8px; align-items: stretch; }
.cha-evalwrap .chb { flex: 1 1 auto; }
.cha-bar { width: 22px; border: 3px solid var(--ink); border-radius: 8px; overflow: hidden; background: #1b2140; position: relative; margin: 9px 0 14px; flex: none; }
.cha-bar .wf { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; transition: height 0.4s ease; }
.cha-bar .tx { position: absolute; left: 0; right: 0; font: 800 10px var(--body); text-align: center; mix-blend-mode: difference; color: #fff; }
.cha-bar .tx.t { top: 2px; }
.cha-bar .tx.b { bottom: 2px; }
.cha-curve { width: 100%; height: 90px; display: block; cursor: pointer; border: 3px solid var(--ink); border-radius: 12px; background: #fff; }
.cha-nav { display: flex; gap: 6px; justify-content: center; margin: 6px 0; }
.cha-nav .btn { min-width: 52px; }
.cha-info { padding: 10px 12px; }
.cha-info .lab { display: inline-block; padding: 2px 10px; border-radius: 99px; color: #fff; font-weight: 800; font-size: 14px; background: #64748b; }
.cha-info .lab.best, .cha-info .lab.excellent { background: #16a34a; }
.cha-info .lab.brilliant { background: #0ea5a4; }
.cha-info .lab.great { background: #4f7cff; }
.cha-info .lab.good { background: #65a30d; }
.cha-info .lab.inaccuracy { background: #ca8a04; }
.cha-info .lab.mistake { background: #ea580c; }
.cha-info .lab.blunder { background: #dc2626; }
.cha-sum { display: grid; grid-template-columns: 1fr auto auto; gap: 2px 10px; font-size: calc(14px * var(--fs, 1)); }
.cha-sum b { font-weight: 800; }
.cha-sum .n { text-align: right; font-variant-numeric: tabular-nums; }
.cha-moves { max-height: 260px; overflow: auto; display: flex; flex-wrap: wrap; gap: 3px 3px; padding: 8px 10px; align-content: flex-start; }
.cha-moves .no { color: var(--muted); font-weight: 700; width: 2.4em; text-align: right; flex: none; font-size: 14px; }
.cha-moves button { border: 0; background: none; padding: 1px 6px; border-radius: 6px; font: 700 calc(15px * var(--fs, 1)) var(--body); cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
.cha-moves button.cur { background: var(--yellow); }
.cha-moves button i { width: 9px; height: 9px; border-radius: 50%; background: transparent; display: inline-block; }
.cha-moves button i.best, .cha-moves button i.excellent { background: #16a34a; }
.cha-moves button i.brilliant { background: #0ea5a4; }
.cha-moves button i.great { background: #4f7cff; }
.cha-moves button i.good { background: #84cc16; }
.cha-moves button i.inaccuracy { background: #eab308; }
.cha-moves button i.mistake { background: #f97316; }
.cha-moves button i.blunder { background: #dc2626; }
.cha-prog { height: 12px; border: 3px solid var(--ink); border-radius: 99px; overflow: hidden; background: #fff; margin: 6px 0; }
.cha-prog i { display: block; height: 100%; width: 0; background: var(--mint); transition: width 0.2s; }

.calm .chb-spark, .calm .chb-conf { display: none !important; }
@media (prefers-reduced-motion: reduce) { .chp-i, .chp, .chb-sq.chk::after { animation: none !important; } }

.ch-pp .avatar { flex: none; }
.ch-bar [hidden] { display: none !important; }

/* Bauernreife: Glitzer über dem gewachsenen Bauern */
.chb-evo { position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%; display: grid; place-items: center; font-size: clamp(18px, 6vw, 40px); pointer-events: none; z-index: 6; animation: chb-evo 1.8s ease-out both; }
@keyframes chb-evo { 0% { transform-origin: center; opacity: 0; filter: drop-shadow(0 0 0 #ffd23d); } 15% { opacity: 1; filter: drop-shadow(0 0 14px #ffd23d); } 100% { opacity: 0; filter: drop-shadow(0 0 30px #ffd23d); } }

/* ===== Werwolf ===== */
/* Bühne: ein dunkler Kasten mit wechselnder Szene (Nacht, Morgen, Tag, Abend, Ende). Karten darin bleiben hell und gut lesbar. */
.wolf { position: relative; isolation: isolate; overflow: hidden; border: 3px solid var(--ink); border-radius: 22px; box-shadow: var(--sh); color: #fff; min-height: min(78vh, 720px); background: #0b1030; display: grid; align-content: start; gap: 12px; padding: 12px; }
.wolf .card, .wolf .w-card-box { color: var(--ink); }
.wolf h2, .wolf h3 { margin: 0; }
.wolf .hint { color: rgba(255, 255, 255, 0.82); }
.wolf .cq-pl { color: var(--ink); }
.wolf .card .hint, .wolf .w-white .hint { color: var(--muted); }
.w-scene { position: absolute; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.w-sky { position: absolute; inset: 0; background: linear-gradient(#060a22 0%, #1a2150 62%, #2c3266 100%); }
.w-stars i { position: absolute; left: var(--x); top: var(--y); width: 3px; height: 3px; border-radius: 50%; background: #fff; opacity: 0.8; animation: w-twinkle var(--d, 3s) ease-in-out var(--dl, 0s) infinite; }
.w-stars i:nth-child(3n) { width: 2px; height: 2px; }
.w-stars i:nth-child(7n) { width: 4px; height: 4px; box-shadow: 0 0 8px 2px rgba(255, 255, 255, 0.6); }
@keyframes w-twinkle { 0%, 100% { opacity: 0.2; transform: scale(0.7); } 50% { opacity: 1; transform: scale(1.35); } }
.w-moon { position: absolute; right: 11%; top: 7%; width: 84px; height: 84px; border-radius: 50%; background: radial-gradient(circle at 36% 34%, #fffbe3, #f4e7a3 58%, #dccb74); box-shadow: 0 0 40px 12px rgba(255, 244, 170, 0.35), 0 0 130px 44px rgba(255, 244, 170, 0.14); animation: w-moonrise 2.4s ease-out both, w-bob 8s ease-in-out 2.4s infinite; }
.w-moon::before { content: ''; position: absolute; left: 22%; top: 26%; width: 16%; height: 16%; border-radius: 50%; background: rgba(150, 130, 60, 0.28); box-shadow: 26px 20px 0 4px rgba(150, 130, 60, 0.2), 6px 34px 0 -2px rgba(150, 130, 60, 0.22); }
.w-moon.blood { width: 112px; height: 112px; background: radial-gradient(circle at 36% 34%, #ffb7a1, #e24a30 58%, #8a1a10); box-shadow: 0 0 50px 16px rgba(255, 70, 40, 0.45), 0 0 150px 54px rgba(255, 40, 20, 0.2); animation: w-moonrise 2.4s ease-out both, w-pulse 3.2s ease-in-out 2.4s infinite; }
.w-moon.blood::before { background: rgba(110, 20, 10, 0.3); box-shadow: 30px 24px 0 5px rgba(110, 20, 10, 0.22), 8px 40px 0 -2px rgba(110, 20, 10, 0.25); }
@keyframes w-moonrise { from { transform: translateY(190px) scale(0.7); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes w-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(8px); } }
@keyframes w-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.w-fog { position: absolute; left: -50%; bottom: 0; width: 200%; height: 40%; background: radial-gradient(ellipse at 50% 100%, rgba(205, 215, 255, 0.24), transparent 68%); animation: w-drift 26s linear infinite; }
.w-fog.b { bottom: 8%; opacity: 0.7; animation-duration: 40s; animation-direction: reverse; }
@keyframes w-drift { from { transform: translateX(0); } to { transform: translateX(25%); } }

'use strict';
/*
 * Vorleser: Sprachausgabe des Browsers (speechSynthesis). Gilt nur für dieses Gerät und wird lokal gespeichert (pg.tts).
 * Stimmen, die es gibt, hängen von Gerät und Browser ab. Es wird keine Stimme heruntergeladen und nichts an andere gesendet.
 * Optionen: Stimme (Automatisch = beste deutsche), Tempo, Tonhöhe, „Rollen“ (jede Person bekommt eine andere Stimme bzw. Tonlage), „Autor ansagen“.
 */
(function () {
  const { h } = PG;
  const KEY = 'pg.tts';
  const DEF = { on: false, voice: 'auto', rate: 0.95, pitch: 1, cast: false, announce: false };
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const PITCH = [1, 0.8, 1.2, 0.9, 1.1, 0.7, 1.3, 0.85, 1.15, 0.95];
  const RATE = [1, 1.05, 0.95, 1.1, 0.9];

  function load() {
    let o = {};
    try { o = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { o = {}; }
    const s = Object.assign({}, DEF);
    if (typeof o.on === 'boolean') s.on = o.on;
    else { try { if (localStorage.getItem('pg.voice') === '1') s.on = true; } catch (e) { /* egal */ } } // alter Schalter
    if (typeof o.voice === 'string' && o.voice.length <= 200) s.voice = o.voice;
    if (typeof o.rate === 'number') s.rate = clamp(o.rate, 0.6, 1.4);
    if (typeof o.pitch === 'number') s.pitch = clamp(o.pitch, 0.6, 1.5);
    if (typeof o.cast === 'boolean') s.cast = o.cast;
    if (typeof o.announce === 'boolean') s.announce = o.announce;
    return s;
  }

  const synth = () => (typeof window !== 'undefined' && 'speechSynthesis' in window && typeof window.SpeechSynthesisUtterance === 'function' ? window.speechSynthesis : null);
  const castMap = new Map();

  const Voice = {
    data: load(),
    ok: () => !!synth(),
    set(k, v) {
      if (!(k in DEF)) return;
      if (k === 'rate') v = clamp(Number(v) || DEF.rate, 0.6, 1.4);
      if (k === 'pitch') v = clamp(Number(v) || DEF.pitch, 0.6, 1.5);
      Voice.data[k] = v;
      try { localStorage.setItem(KEY, JSON.stringify(Voice.data)); } catch (e) { /* egal */ }
      if (k === 'on' && !v) Voice.stop();
      if (k === 'cast') castMap.clear();
    },
    get on() { return Voice.data.on; },
    stop() { try { const s = synth(); if (s) s.cancel(); } catch (e) { /* egal */ } },
    /** Alle Stimmen des Geräts, deutsche zuerst (lokale vor Online-Stimmen), danach die übrigen nach Name */
    voices() {
      const s = synth();
      let vs = [];
      try { vs = s && s.getVoices ? Array.from(s.getVoices()) : []; } catch (e) { vs = []; }
      const rank = (v) => (/^de/i.test(v.lang) ? (v.localService ? 0 : 1) : 2);
      return vs.slice().sort((a, b) => rank(a) - rank(b) || String(a.name).localeCompare(String(b.name)));
    },
    german() { return Voice.voices().filter((v) => /^de/i.test(v.lang)); },
    find(id) {
      if (!id || id === 'auto') return Voice.german()[0] || null;
      return Voice.voices().find((v) => (v.voiceURI || v.name) === id) || Voice.german()[0] || null;
    },
    /** Welche Rolle (0, 1, 2 …) eine Person bekommt: in der Reihenfolge, in der sie zum ersten Mal vorkommt */
    role(who) {
      if (!castMap.has(who)) castMap.set(who, castMap.size);
      return castMap.get(who);
    },
    resetCast() { castMap.clear(); },
    /** Stimme, Tempo und Tonhöhe für eine Rolle (Rolle null = keine Rollen) */
    plan(role) {
      const d = Voice.data;
      let voice = Voice.find(d.voice);
      let rate = d.rate;
      let pitch = d.pitch;
      if (d.cast && role != null) {
        const de = Voice.german();
        if (de.length > 1) voice = de[role % de.length];
        const round = Math.floor(role / Math.max(1, de.length));
        pitch = clamp(d.pitch * PITCH[(de.length > 1 ? round * 3 + (role % de.length ? 1 : 0) : role) % PITCH.length], 0.6, 1.5);
        rate = clamp(d.rate * RATE[role % RATE.length], 0.6, 1.4);
      }
      return { voice, rate, pitch };
    },
    /** Text sprechen. who = Name der Person (für „Rollen“), opts.queue = nicht unterbrechen */
    say(text, who, opts) {
      const s = synth();
      if (!s || !text) return null;
      try {
        if (!(opts && opts.queue)) s.cancel();
        const pl = Voice.plan(Voice.data.cast && who != null ? Voice.role(who) : null);
        const u = new window.SpeechSynthesisUtterance(String(text));
        u.lang = pl.voice ? pl.voice.lang : 'de-DE';
        if (pl.voice) u.voice = pl.voice;
        u.rate = pl.rate;
        u.pitch = pl.pitch;
        s.speak(u);
        return pl;
      } catch (e) { return null; }
    },
    /** Vorhören: mit „Rollen“ sprechen zwei Beispielpersonen nacheinander */
    preview() {
      if (Voice.data.cast) {
        Voice.say('Hallo, ich bin die erste Stimme.', '__probe1');
        Voice.say('Und ich bin die zweite Stimme.', '__probe2', { queue: true });
        castMap.delete('__probe1'); castMap.delete('__probe2');
      } else Voice.say('So klingt der Vorleser.');
    },
    /** Ansage vor dem Text, wenn „Autor ansagen“ an ist */
    lead(name, idx, type) {
      if (!Voice.data.announce) return '';
      return (idx === 0 ? name + ' beginnt: ' : name + (type === 'text' ? ' schreibt: ' : ' sagt: '));
    },

    /** Bedienfeld für Stimme, Tempo, Tonhöhe, Rollen, Ansage. opts.onOff = Schalter „Vorleser an/aus“ mit anzeigen (für die Einstellungen) */
    panel(opts) {
      opts = opts || {};
      const d = Voice.data;
      if (!Voice.ok()) return h('p', { class: 'hint small' }, 'Auf diesem Gerät gibt es keine Sprachausgabe.');
      const sel = h('select', { class: 'input vsel', 'aria-label': 'Stimme', onchange: (e) => Voice.set('voice', e.target.value) });
      const fill = () => {
        const vs = Voice.voices();
        const best = Voice.german()[0];
        const opt = (value, label) => { const o = h('option', { value }, label); if (d.voice === value) o.selected = true; return o; };
        sel.replaceChildren(opt('auto', 'Automatisch' + (best ? ' (' + best.name + ')' : '')), ...vs.map((v) => opt(v.voiceURI || v.name, v.name + ' (' + v.lang + ')' + (v.localService ? '' : ' · online'))));
      };
      fill();
      try { const s = synth(); if (s && s.addEventListener) s.addEventListener('voiceschanged', fill, { once: true }); } catch (e) { /* egal */ }
      const slider = (label, key, min, max, fmt) => {
        const out = h('output', null, fmt(d[key]));
        return h('label', { class: 'ksl vsl' }, h('span', null, label),
          h('input', { type: 'range', min, max, step: 5, value: Math.round(d[key] * 100), 'aria-label': label, oninput: (e) => { Voice.set(key, e.target.value / 100); out.textContent = fmt(Voice.data[key]); } }), out);
      };
      const tog = (label, key, hint) => {
        const b = h('button', { class: 'btn small ' + (d[key] ? '' : 'alt'), 'aria-pressed': String(!!d[key]), title: hint, onclick: () => { Voice.set(key, !Voice.data[key]); b.className = 'btn small ' + (Voice.data[key] ? '' : 'alt'); b.setAttribute('aria-pressed', String(!!Voice.data[key])); } }, label);
        return b;
      };
      const kids = [];
      if (opts.onOff) kids.push(h('div', { class: 'srow' }, h('div', { class: 'st' }, h('b', null, 'Vorleser'), h('small', null, 'Liest in Kritzelpost die Texte der Präsentation vor.')), opts.onOff));
      kids.push(
        h('label', { class: 'vrow' }, h('span', null, 'Stimme'), sel),
        slider('Tempo', 'rate', 60, 140, (x) => Math.round(x * 100) + ' %'),
        slider('Tonhöhe', 'pitch', 60, 150, (x) => Math.round(x * 100) + ' %'),
        h('div', { class: 'vbtns' },
          tog('🎭 Jede Person eine andere Stimme', 'cast', 'Wechselt Stimme oder Tonlage je Autor'),
          tog('📢 Autor ansagen', 'announce', 'Sagt vor jedem Beitrag, wer ihn geschrieben hat'),
          h('button', { class: 'btn small alt', onclick: () => Voice.preview() }, '▶ Vorhören')),
        h('p', { class: 'hint small' }, 'Welche Stimmen es gibt, hängt von deinem Gerät und Browser ab. Mit nur einer Stimme wechselt die Tonlage statt der Stimme.'));
      return h('div', { class: 'vpanel' }, kids);
    },
  };
  PG.Voice = Voice;
})();

'use strict';
/*
 * LocalPeer: Test-Ersatz für PeerJS (nur mit ?test aktiv).
 * Spricht über BroadcastChannel, damit mehrere Tabs im selben Browser ohne Internet
 * miteinander verbunden werden können. Bietet nur die PeerJS-Teile, die die App nutzt.
 */
(function () {
  if (typeof BroadcastChannel === 'undefined') return;
  const bus = new BroadcastChannel('spielstube-test-bus');
  const registry = new Map();

  class Emitter {
    constructor() { this._h = {}; }
    on(e, f) { (this._h[e] = this._h[e] || []).push(f); return this; }
    emit(e, ...a) { (this._h[e] || []).slice().forEach((f) => f(...a)); }
  }

  class LocalConn extends Emitter {
    constructor(peer, remote, cid) {
      super();
      this.peer = peer; this.peerId = remote; this.cid = cid; this.open = false;
    }
    send(d) { bus.postMessage({ t: 'data', from: this.peer.id, to: this.peerId, cid: this.cid, d }); }
    close() {
      if (!this.open) return;
      this.open = false;
      bus.postMessage({ t: 'close', from: this.peer.id, to: this.peerId, cid: this.cid });
      this.emit('close');
    }
  }

  class LocalPeer extends Emitter {
    constructor(id) {
      super();
      this.id = id || 'c' + Math.random().toString(36).slice(2, 10);
      this.conns = new Map();
      this.open = false;
      this._claiming = !!id;
      registry.set(this.id, this);
      if (id) {
        bus.postMessage({ t: 'claim', id });
        this._claimTimer = setTimeout(() => { this._claiming = false; this.open = true; this.emit('open', this.id); }, 120);
      } else {
        setTimeout(() => { this.open = true; this.emit('open', this.id); }, 0);
      }
    }
    _taken() {
      clearTimeout(this._claimTimer);
      this._claiming = false;
      registry.delete(this.id);
      this.emit('error', { type: 'unavailable-id', message: 'ID is taken' });
    }
    connect(id) {
      const cid = Math.random().toString(36).slice(2, 10);
      const conn = new LocalConn(this, id, cid);
      this.conns.set(cid, conn);
      bus.postMessage({ t: 'connect', from: this.id, to: id, cid });
      conn._to = setTimeout(() => this.emit('error', { type: 'peer-unavailable', message: 'Could not connect to peer ' + id }), 1500);
      return conn;
    }
    _recv(m) {
      if (m.t === 'connect') {
        const conn = new LocalConn(this, m.from, m.cid);
        this.conns.set(m.cid, conn);
        this.emit('connection', conn);
        conn.open = true; // sofort offen (Hintergrund-Tabs drosseln Timer; sonst ginge ein früher Datensatz des Clients verloren)
        conn.emit('open');
        bus.postMessage({ t: 'accept', from: this.id, to: m.from, cid: m.cid });
      } else if (m.t === 'accept') {
        const conn = this.conns.get(m.cid);
        if (!conn) return;
        clearTimeout(conn._to);
        conn.open = true;
        conn.emit('open');
      } else if (m.t === 'data') {
        const conn = this.conns.get(m.cid);
        if (conn) conn.emit('data', m.d);
      } else if (m.t === 'close') {
        const conn = this.conns.get(m.cid);
        if (conn) { conn.open = false; this.conns.delete(m.cid); conn.emit('close'); }
      }
    }
    destroy() {
      clearTimeout(this._claimTimer);
      for (const c of [...this.conns.values()]) c.close();
      registry.delete(this.id);
      this.open = false;
      this.emit('close');
    }
  }

  bus.onmessage = (e) => {
    const m = e.data;
    if (m.t === 'claim') {
      const p = registry.get(m.id);
      if (p && p.open) bus.postMessage({ t: 'taken', id: m.id });
      return;
    }
    if (m.t === 'taken') {
      const p = registry.get(m.id);
      if (p && p._claiming) p._taken();
      return;
    }
    const p = registry.get(m.to);
    if (p && p.open) p._recv(m);
  };

  // Seite schließen = Verbindungen sauber trennen (wie ein echtes Netzwerk-Aus)
  addEventListener('pagehide', () => {
    for (const p of registry.values()) for (const c of [...p.conns.values()]) c.close();
  });

  window.LocalPeer = LocalPeer;
})();

'use strict';
/*
 * Netzwerk: Stern-Topologie. Der Host-Browser ist die Zentrale, alle anderen verbinden
 * sich per Raumcode direkt mit ihm (WebRTC über PeerJS). Nachrichten sind JSON-Strings.
 */
(function () {
  const PREFIX = 'spielstube-';
  const MAX_CONNS = 24; // mehr als 10 Spieler, damit Neuverbindungen nach Abbrüchen noch Platz haben
  const BURST = 80; // erlaubte Spitze an Nachrichten
  const RATE = 45; // dauerhaft erlaubte Nachrichten pro Sekunde
  const ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; // ohne I und O
  const CODE_LEN = 5;
  const code4 = () => Array.from({ length: CODE_LEN }, () => ALPHA[Math.floor(Math.random() * ALPHA.length)]).join('');
  const Ctor = () => (window.__TEST ? window.LocalPeer : window.Peer);
  const parse = (raw) => {
    try { return typeof raw === 'string' ? JSON.parse(raw) : raw; } catch (e) { return null; }
  };

  const PEER_URLS = [
    'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js',
    'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js',
  ];
  function loadScript(url) {
    return new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = url;
      if (window.__PEER_SRI) { s.integrity = window.__PEER_SRI; s.crossOrigin = 'anonymous'; } // Integritätsprüfung, falls hinterlegt
      s.onload = res; s.onerror = () => rej(new Error('load ' + url));
      document.head.append(s);
    });
  }
  async function loadPeer() {
    if (PG.TEST || window.Peer) return;
    for (const u of PEER_URLS) {
      try { await loadScript(u); if (window.Peer) return; } catch (e) { /* nächste Quelle */ }
    }
    throw new Error('PeerJS konnte nicht geladen werden');
  }

  class HostLink {
    /** handlers: onMessage(conn, msg), onGone(conn), onPeerError(err) */
    constructor(handlers) { this.h = handlers; this.conns = new Map(); this.all = new Set(); this.peer = null; this.code = null; }
    start() {
      return new Promise((resolve, reject) => {
        let tries = 0;
        const attempt = () => {
          const code = code4();
          const peer = new (Ctor())(PREFIX + code);
          let opened = false;
          peer.on('open', () => { opened = true; this.peer = peer; this.code = code; this._wire(peer); resolve(code); });
          peer.on('error', (err) => {
            if (opened) { if (this.h.onPeerError) this.h.onPeerError(err); return; }
            try { peer.destroy(); } catch (e) { /* egal */ }
            if (err && err.type === 'unavailable-id' && ++tries < 6) attempt();
            else reject(err || new Error('peer'));
          });
        };
        attempt();
      });
    }
    _wire(peer) {
      peer.on('connection', (conn) => {
        // Schutz vor Überflutung: Verbindungen ohne Anmeldung fliegen nach 10 s raus, zu viele Verbindungen werden abgelehnt
        const open = [...this.all].filter((c) => c.open).length;
        if (open >= MAX_CONNS) { try { conn.on('open', () => conn.close()); } catch (e) { /* egal */ } return; }
        this.all.add(conn);
        conn._tokens = BURST;
        conn._last = Date.now();
        conn._drops = 0;
        conn._unbound = setTimeout(() => { if (!conn._pid) { try { conn.close(); } catch (e) { /* egal */ } } }, 10000);
        conn.on('data', (raw) => {
          if (typeof raw !== 'string' || raw.length > 30000) return;
          // Token-Bucket: kurze Spitzen sind erlaubt, Dauerfeuer wird verworfen und führt zum Rauswurf
          const now = Date.now();
          conn._tokens = Math.min(BURST, conn._tokens + ((now - conn._last) / 1000) * RATE);
          conn._last = now;
          if (conn._tokens < 1) {
            if (++conn._drops > 300) { try { conn.close(); } catch (e) { /* egal */ } }
            return;
          }
          conn._tokens -= 1;
          const m = parse(raw);
          if (m && typeof m === 'object') this.h.onMessage(conn, m);
        });
        const gone = () => { clearTimeout(conn._unbound); this.all.delete(conn); this.h.onGone(conn); };
        conn.on('close', gone);
        conn.on('error', gone);
      });
      peer.on('disconnected', () => { try { if (peer.reconnect) peer.reconnect(); } catch (e) { /* egal */ } });
    }
    send(pid, obj) {
      const c = this.conns.get(pid);
      if (c && c.open) { try { c.send(JSON.stringify(obj)); } catch (e) { /* egal */ } }
    }
    drop(pid) {
      const c = this.conns.get(pid);
      this.conns.delete(pid);
      if (c) { try { c.close(); } catch (e) { /* egal */ } }
    }
    close() {
      for (const pid of [...this.conns.keys()]) this.drop(pid);
      try { if (this.peer) this.peer.destroy(); } catch (e) { /* egal */ }
    }
  }

  class ClientLink {
    /** handlers: onMessage(msg), onClose(), onError(err) */
    constructor(handlers) { this.h = handlers; this.peer = null; this.conn = null; this.closed = false; }
    connect(code) {
      return new Promise((resolve, reject) => {
        const peer = new (Ctor())();
        this.peer = peer;
        let settled = false;
        const fail = (e) => {
          if (!settled) { settled = true; reject(e); } else if (this.h.onError) this.h.onError(e);
        };
        peer.on('error', fail);
        peer.on('open', () => {
          const conn = peer.connect(PREFIX + code, { reliable: true });
          this.conn = conn;
          conn.on('open', () => { if (!settled) { settled = true; resolve(); } });
          conn.on('data', (raw) => { const m = parse(raw); if (m && typeof m === 'object') this.h.onMessage(m); });
          conn.on('close', () => { if (!this.closed && this.h.onClose) this.h.onClose(); });
          conn.on('error', fail);
        });
        setTimeout(() => { if (!settled) fail({ type: 'timeout' }); }, 12000);
      });
    }
    send(obj) {
      if (this.conn && this.conn.open) { try { this.conn.send(JSON.stringify(obj)); } catch (e) { /* egal */ } }
    }
    close() {
      this.closed = true;
      try { if (this.peer) this.peer.destroy(); } catch (e) { /* egal */ }
    }
  }

  PG.Net = { HostLink, ClientLink, loadPeer, code4, ALPHA, CODE_LEN };
})();

'use strict';
/*
 * Room: der Spielstand des Raums. Läuft ausschließlich im Browser des Hosts und ist die einzige
 * Instanz, die etwas entscheidet. Alle anderen schicken nur Wünsche (handle) und bekommen
 * auf sie zugeschnittene Ansichten (view) zurück. So sehen Mitspieler nie geheime Infos
 * (z. B. richtige Antworten oder fremde Handkarten) vor der Zeit.
 */
(function () {
  const { GAMES } = PG;
  const COLORS = ['#FF5A4D', '#3AA0FF', '#2DBE9A', '#FFC83D', '#6C4DFF', '#FF8FB1', '#14B8D4', '#8BC34A', '#FF9E3D', '#B07CFF'];
  const MAX_PLAYERS = 10;
  const clean = (s) => String(s || '').replace(/[\u0000-\u001f\u007f<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, 14);

  class Room {
    constructor(code, hostId, hostName, prof) {
      this.code = code;
      this.hostId = hostId;
      this.players = [];
      this.selected = 'quiz';
      this.gameId = null;
      this.game = null;
      this.settings = {
        quiz: { win: 5, time: 20, diff: 'normal' },
        blitz: { n: 10, time: 15, diff: 'normal' },
        guess: { mode: 'solo', kind: 'mix', rounds: 8, time: 30 },
        chain: { mode: 'mix', steps: 0, time: 60, drawTime: 90, present: 'auto', speed: 'normal', seed: 'own', vote: false },
        draw: { rounds: 2, time: 80, pickTime: 15, words: 'mix', mode: 'free' },
        wolf: { theme: 'wolf', narr: 'voice', narrator: null, mode: 'classic', roles: {}, wolves: 0, reveal: 'role', roleList: true, nightTime: 25, dayTime: 90, voteTime: 30, voteOpen: false, tie: 'none', moon: false, calmFirst: false, seer: 'team', deadSee: true },
        chess: { format: 'duel', variant: 'std', c960: false, time: 0, inc: 0, auto: true, out: {} },
        cards: { deal: 7, flip: false, random: false, stack: false, time: 30, rounds: 3, chaos: { swap: true, wave: true, mirror: true, double: true, thief: true, bomb: true, gift: true, tidy: true, freeze: true, wheel: true, brake: true } },
      };
      this.timers = new Set();
      this.usedQ = new Set();
      this.sink = null;
      this.raw = null; // (msg, exceptPid) an alle schicken, ohne die Oberfläche neu aufzubauen
      this.rawTo = null; // (pid, msg) an eine Person
      this._queued = false;
      this._dc = new Map();
      this.locked = false;
      this.photos = {}; // pid -> Daten-URL des Profilfotos (nur im Host)
      this.addPlayer(hostId, hostName, null, false, prof);
    }

    /**
     * secret: geheimer Schlüssel des Spielers. Wer die Spieler-ID kennt (sie steht in jeder Ansicht),
     * darf sich nur mit dem Schlüssel wieder anmelden, den die Person beim ersten Beitritt geschickt hat.
     * remote=false gilt für den Host selbst (lokal, ohne Verbindung).
     */
    addPlayer(id, name, secret, remote, prof) {
      let p = this.players.find((x) => x.id === id);
      if (p) {
        if (remote !== false) {
          if (id === this.hostId) return { ok: false, reason: 'Diese Kennung ist schon vergeben.' };
          if (!p.secret || p.secret !== secret) return { ok: false, reason: 'Diese Kennung ist schon vergeben.' };
        }
        p.connected = true;
        if (prof) this.setProfile(p, prof);
        clearTimeout(this._dc.get(id));
        return { ok: true, player: p };
      }
      if (this.locked) return { ok: false, reason: 'Der Raum ist gesperrt.' };
      if (this.gameId) return { ok: false, reason: 'Das Spiel läuft schon. Tritt nach der Runde bei.' };
      if (this.players.length >= MAX_PLAYERS) return { ok: false, reason: 'Der Raum ist voll.' };
      const base = clean(name) || 'Spieler';
      let nm = base;
      let n = 2;
      while (this.players.some((x) => x.name.toLowerCase() === nm.toLowerCase())) nm = base.slice(0, 11) + ' ' + n++;
      const used = new Set(this.players.map((x) => x.color));
      const color = COLORS.find((c) => !used.has(c)) || COLORS[this.players.length % COLORS.length];
      p = { id, name: nm, color, connected: true, team: this.smallestTeam(), secret: remote === false ? null : secret, e: '', fx: 'none', fr: 'none', phv: 0 };
      this.setProfile(p, prof);
      this.players.push(p);
      return { ok: true, player: p };
    }

    /** Bot hinzufügen (läuft komplett im Host, hat keine Verbindung) */
    addBot(level) {
      if (this.gameId || this.players.length >= MAX_PLAYERS) return null;
      if (!['easy', 'mid', 'hard'].includes(level)) return null;
      const names = ['Rudi-Bot', 'Bella-Bot', 'Max-Bot', 'Zoe-Bot', 'Tom-Bot', 'Lilly-Bot', 'Kai-Bot', 'Nele-Bot', 'Ben-Bot', 'Mia-Bot'];
      const nm = names.find((n) => !this.players.some((x) => x.name === n)) || 'Bot ' + (this.players.length + 1);
      const used = new Set(this.players.map((x) => x.color));
      const color = COLORS.find((c) => !used.has(c)) || COLORS[this.players.length % COLORS.length];
      const p = { id: 'bot' + PG.rid(8), name: nm, color, connected: true, team: this.smallestTeam(), secret: null, bot: level, e: '🤖', fx: 'none', fr: 'none', phv: 0 };
      this.players.push(p);
      return p;
    }

    /** Übernimmt nur erlaubte Profilwerte (Emoji, Namenseffekt, Rahmen); das Foto läuft getrennt über 'photo'. */
    setProfile(p, prof) {
      if (!prof || !PG.Profile) return;
      const c = PG.Profile.sanitize(prof);
      p.e = c.e; p.fx = c.fx; p.fr = c.fr;
    }

    smallestTeam() {
      const n = PG.TEAMS.length;
      const counts = Array(n).fill(0);
      for (const p of this.players) if (p.team != null) counts[p.team]++;
      return counts.indexOf(Math.min(...counts));
    }

    removePlayer(id) {
      delete this.photos[id];
      this.players = this.players.filter((p) => p.id !== id);
      this.changed();
    }

    /** Verbindung eines Spielers ist weg */
    playerGone(id) {
      const p = this.players.find((x) => x.id === id);
      if (!p) return;
      p.connected = false;
      if (!this.gameId) {
        // In der Lobby fliegt weg, wer nicht innerhalb von 8 s zurückkommt (z. B. Seite neu geladen)
        clearTimeout(this._dc.get(id));
        this._dc.set(id, setTimeout(() => {
          const q = this.players.find((x) => x.id === id);
          if (q && !q.connected && !this.gameId) this.removePlayer(id);
        }, 8000));
      } else {
        const G = GAMES[this.gameId];
        if (G && G.gone) G.gone(this, id);
      }
      this.changed();
    }

    after(ms, fn) {
      const id = setTimeout(() => { this.timers.delete(id); fn(); }, ms);
      this.timers.add(id);
      return id;
    }
    cancel(id) { clearTimeout(id); this.timers.delete(id); }
    clearTimers() { for (const t of this.timers) clearTimeout(t); this.timers.clear(); }

    handle(pid, msg) {
      const me = this.players.find((p) => p.id === pid);
      if (!me || !msg || typeof msg !== 'object') return;
      const isHost = pid === this.hostId;
      switch (msg.t) {
        case 'team': {
          if (this.gameId) return;
          const target = isHost && msg.pid ? this.players.find((p) => p.id === msg.pid) : me;
          const t = msg.team | 0;
          if (target && t >= 0 && t < PG.TEAMS.length) target.team = t;
          break;
        }
        case 'shuffle': {
          if (!isHost || this.gameId) return;
          const order = PG.shuffle(this.players);
          order.forEach((p, i) => { p.team = i % PG.TEAMS.length; });
          break;
        }
        case 'prof': {
          this.setProfile(me, msg);
          break;
        }
        case 'photo': {
          const now = Date.now();
          if (me._pt && now - me._pt < 1500) return;
          me._pt = now;
          if (msg.d == null) {
            if (!this.photos[pid]) return;
            delete this.photos[pid];
            me.phv = 0;
            if (this.raw) this.raw({ t: 'ph', pid, v: 0, d: null });
            break;
          }
          const ok = PG.Profile && PG.Profile.sanitize({ ph: msg.d }).ph;
          if (!ok || this.photos[pid] === ok) return;
          this.photos[pid] = ok;
          me.phv = this._phc = (this._phc || 0) + 1;
          if (this.raw) this.raw({ t: 'ph', pid, v: me.phv, d: ok });
          break;
        }
        case 'needphoto': {
          const target = this.players.find((p) => p.id === String(msg.pid));
          if (target && this.photos[target.id] && this.rawTo) this.rawTo(pid, { t: 'ph', pid: target.id, v: target.phv, d: this.photos[target.id] });
          return;
        }
        case 'lock': {
          if (!isHost) return;
          this.locked = !!msg.on;
          break;
        }
        case 'addbot': {
          if (!isHost || this.gameId) return;
          this.addBot(msg.level);
          break;
        }
        case 'select': {
          if (!isHost || this.gameId) return;
          if (GAMES[msg.game] && GAMES[msg.game].ready) this.selected = msg.game;
          break;
        }
        case 'setting': {
          if (!isHost || this.gameId) return;
          const G = GAMES[msg.game];
          if (G && G.setSetting) G.setSetting(this, msg.key, msg.value);
          break;
        }
        case 'start': {
          if (!isHost || this.gameId) return;
          this.start();
          break;
        }
        case 'lobby': {
          if (!isHost) return;
          this.backToLobby();
          break;
        }
        case 'kick': {
          if (!isHost || msg.pid === this.hostId) return;
          if (this.onKick) this.onKick(msg.pid);
          this.players = this.players.filter((p) => p.id !== msg.pid);
          delete this.photos[msg.pid];
          break;
        }
        case 'g': {
          const G = this.gameId && GAMES[this.gameId];
          if (G && G.act(this, pid, msg) === 'quiet') return; // z. B. Zeichenstriche: nichts neu aufbauen
          break;
        }
        default:
          return;
      }
      this.changed();
    }

    start() {
      const G = GAMES[this.selected];
      if (!G || !G.ready || G.canStart(this)) return;
      this.clearTimers();
      this.gameId = G.id;
      this.game = G.init(this);
      if (G.begin) G.begin(this);
    }

    restartGame() {
      const G = GAMES[this.gameId];
      if (!G) return;
      this.clearTimers();
      this.game = G.init(this);
      if (G.begin) G.begin(this);
      this.changed();
    }

    backToLobby() {
      this.clearTimers();
      this.gameId = null;
      this.game = null;
      this.players = this.players.filter((p) => p.connected || p.bot);
    }

    changed() {
      if (this._queued) return;
      this._queued = true;
      queueMicrotask(() => { this._queued = false; if (this.sink) this.sink(this); });
    }

    view(pid) {
      const G = this.gameId && GAMES[this.gameId];
      const S = GAMES[this.selected];
      return {
        code: this.code,
        me: pid,
        host: this.hostId,
        locked: !!this.locked,
        players: this.players.map((p) => ({ id: p.id, name: p.name, color: p.color, team: p.team, connected: p.connected, bot: p.bot || null, e: p.e, fx: p.fx, fr: p.fr, ph: this.photos[p.id] ? p.phv : 0 })),
        selected: this.selected,
        settings: this.settings,
        games: Object.values(GAMES).map((g) => ({ id: g.id, name: g.name, emoji: g.emoji, blurb: g.blurb, ready: !!g.ready, teams: typeof g.teams === 'function' ? !!g.teams(this) : !!g.teams, order: g.order || 0 })).sort((a, b) => a.order - b.order),
        startError: S && S.ready ? S.canStart(this) : 'Dieses Spiel ist noch nicht fertig.',
        gameId: this.gameId,
        game: G ? G.view(this, pid) : null,
      };
    }
  }

  PG.Room = Room;
})();

'use strict';
/*
 * Kategorie-Duell: zwei Teams, 4×4 Kategorienfelder. Pro Runde wird zufällig ein freies Feld gezogen,
 * dazu gibt es 3 Fragen. Alle Spieler antworten auf dem eigenen Handy, im Team zählt die Mehrheit
 * (bei Gleichstand entscheidet der Zufall). Das Team mit mehr richtigen Antworten holt das Feld.
 * Wer zuerst die eingestellte Zahl an Feldern hat, gewinnt.
 * Option „50:50-Joker“: Jedes Team darf einmal pro Spiel bei einer Frage zwei falsche Antworten für das eigene Team ausblenden.
 */
(function () {
  const { h, T, shuffle, pick, TEAMS, GAMES, UI } = PG;
  const QN = 3;
  const SHAPES = ['▲', '●', '■', '◆'];
  const OPT = ['#FF5A4D', '#3AA0FF', '#FFC83D', '#2DBE9A'];

  /* ---------- Logik (nur Host) ---------- */

  const pl = (room, pid) => room.players.find((p) => p.id === pid);
  const teamPlayers = (room, t) => room.players.filter((p) => p.team === t);
  const connectedVoters = (room) => room.players.filter((p) => p.connected && p.team != null);

  /** Mehrheit pro Team; bei Gleichstand der Spitzenreiter entscheidet der Zufall. */
  function majority(counts) {
    const max = Math.max(...counts);
    if (max <= 0) return { choice: null, tie: false };
    const top = counts.map((c, i) => (c === max ? i : -1)).filter((i) => i >= 0);
    return top.length === 1 ? { choice: top[0], tie: false } : { choice: pick(top), tie: true };
  }

  /* ---------- Verlauf: schon gesehene Fragen kommen später wieder (Schutz gegen Auswendiglernen) ---------- */

  const hashQ = (str) => { let x = 5381; for (let i = 0; i < str.length; i++) x = ((x << 5) + x + str.charCodeAt(i)) | 0; return (x >>> 0).toString(36); };
  const History = {
    KEY: 'pg.seenQ', MAX: 1500, map: null,
    load() {
      if (this.map) return this.map;
      try { this.map = JSON.parse(localStorage.getItem(this.KEY) || '{}') || {}; } catch (e) { this.map = {}; }
      return this.map;
    },
    has(q) { return !!this.load()[hashQ(q)]; },
    add(q) {
      const m = this.load();
      m[hashQ(q)] = Date.now();
      const keys = Object.keys(m);
      if (keys.length > this.MAX) keys.sort((a, b) => m[a] - m[b]).slice(0, keys.length - this.MAX).forEach((k) => delete m[k]);
      try { localStorage.setItem(this.KEY, JSON.stringify(m)); } catch (e) { /* egal */ }
    },
    count() { return Object.keys(this.load()).length; },
    clear() { this.map = {}; try { localStorage.removeItem(this.KEY); } catch (e) { /* egal */ } },
  };

  /* ---------- Schwierigkeit: Stufe 1–2 normal, 3–4 schwer, 5 sehr schwer, 6 unmöglich ---------- */

  const DIFFS = [
    { id: 'normal', label: 'Normal', levels: [1, 2], fb: [3], bot: 1, hint: 'Allgemeinwissen, das die meisten kennen' },
    { id: 'schwer', label: 'Schwer', levels: [3, 4], fb: [2, 5], bot: 0.82, hint: 'Hier wird es für Durchschnittsspieler knifflig' },
    { id: 'sehr', label: 'Sehr schwer', levels: [5], fb: [4, 6], bot: 0.62, hint: 'Nur mit echtem Spezialwissen oder gutem Raten' },
    { id: 'unmoeglich', label: 'Unmöglich', levels: [6], fb: [5], bot: 0.42, hint: 'Extrem schwer, Raten ist erlaubt' },
    { id: 'steigend', label: 'Steigend', levels: null, fb: null, bot: 0.75, hint: 'Wird mit jeder Frage schwerer' },
  ];
  const DIFF_IDS = DIFFS.map((d) => d.id);
  const diffOf = (id) => DIFFS.find((d) => d.id === id) || DIFFS[0];
  const levelOf = (q) => q.schwierigkeit || 2;
  const levelLabel = (lvl) => (lvl <= 2 ? 'Normal' : lvl <= 4 ? 'Schwer' : lvl === 5 ? 'Sehr schwer' : 'Unmöglich');
  /** Welche Stufe eine Frage bei Position i von n hat (bei „steigend“ wird es schwerer, sonst immer gleich) */
  function planFor(diffId, n) {
    if (diffId !== 'steigend') return Array.from({ length: n }, () => diffId);
    const order = ['normal', 'schwer', 'sehr'];
    return Array.from({ length: n }, (_, i) => order[Math.min(2, Math.floor((i * 3) / Math.max(1, n)))]);
  }
  /** Erst die passende Stufe, dann Nachbarstufen, zuletzt alles (falls ein Pool zu klein ist) */
  const tiersOf = (d) => [d.levels, d.fb, null];

  /* ---------- Erzeugte Fragen: Kopfrechnen ändert sich bei jedem Spiel und lässt sich nicht auswendig lernen ---------- */

  const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const isPrime = (n) => { if (n < 2) return false; for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; };
  function wrongNums(right, spread) {
    const set = new Set();
    const cand = [right + 1, right - 1, right + 10, right - 10, right + 2, right - 2, right + spread, right - spread, right * 2, Math.round(right / 2) + 1, right + 5, right - 5, right + 100];
    for (const c of shuffle(cand)) if (c !== right && c >= 0 && Number.isInteger(c)) set.add(c);
    let k = 3;
    while (set.size < 3) set.add(right + k++);
    return [...set].slice(0, 3).map(String);
  }
  /** Rechenfragen je Stufe; pro Stufe `per` Stück (Texte werden nicht doppelt erzeugt) */
  function genMath(per) {
    const out = [];
    const seen = new Set();
    const mk = (q, right, spread, lvl) => { if (!seen.has(q)) { seen.add(q); out.push({ q, richtig: String(right), falsch: wrongNums(right, spread), schwierigkeit: lvl }); } };
    const makers = {
      1: [
        () => { const a = ri(11, 49), b = ri(11, 49); mk(`Was ergibt ${a} + ${b}?`, a + b, 10, 1); },
        () => { const a = ri(40, 99), b = ri(11, a - 5); mk(`Was ergibt ${a} − ${b}?`, a - b, 10, 1); },
      ],
      2: [
        () => { const a = ri(3, 12), b = ri(6, 15); mk(`Was ergibt ${a} × ${b}?`, a * b, a, 2); },
        () => { const b = ri(3, 12), r = ri(4, 15); mk(`Was ergibt ${b * r} ÷ ${b}?`, r, 2, 2); },
        () => { const base = ri(2, 20) * 20, pc = [10, 25, 50][ri(0, 2)]; mk(`Wie viel sind ${pc} % von ${base}?`, base * pc / 100, 10, 2); },
        () => { const d = ri(2, 9), st = ri(1, 9); const seq = [0, 1, 2, 3].map((i) => st + d * i); mk(`Wie geht die Reihe weiter? ${seq.join(', ')}, …`, st + d * 4, d, 2); },
      ],
      3: [
        () => { const a = ri(2, 4), st = ri(1, 4); const seq = [0, 1, 2, 3].map((i) => st * a ** i); mk(`Wie geht die Reihe weiter? ${seq.join(', ')}, …`, st * a ** 4, st, 3); },
        () => { const a = ri(13, 25); mk(`Was ergibt ${a} × ${a}?`, a * a, a, 3); },
        () => { const a = ri(12, 19), b = ri(6, 9); mk(`Was ergibt ${a} × ${b}?`, a * b, a, 3); },
      ],
      4: [
        () => { const a = ri(120, 480), b = ri(130, 490); mk(`Was ergibt ${a} + ${b}?`, a + b, 10, 4); },
        () => { const a = ri(21, 49), b = ri(6, 9); mk(`Was ergibt ${a} × ${b}?`, a * b, a, 4); },
        () => { const base = ri(3, 30) * 40, pc = [15, 20, 30, 75][ri(0, 3)]; mk(`Wie viel sind ${pc} % von ${base}?`, base * pc / 100, 10, 4); },
        () => { const a = ri(2, 9), b = ri(3, 9), c = ri(2, 9); mk(`Was ergibt (${a} + ${b}) × ${c} − ${a}?`, (a + b) * c - a, 3, 4); },
      ],
      5: [
        () => { const a = ri(21, 39), b = ri(12, 24); mk(`Was ergibt ${a} × ${b}?`, a * b, 20, 5); },
        () => { const a = ri(26, 39); mk(`Was ergibt ${a} × ${a}?`, a * a, a, 5); },
        () => { const a = ri(1001, 1999), b = ri(300, 899); mk(`Was ergibt ${a} − ${b}?`, a - b, 100, 5); },
        () => { const f = [ri(1, 6), ri(2, 7)]; while (f.length < 5) f.push(f[f.length - 1] + f[f.length - 2]); mk(`Jede Zahl ist die Summe der beiden davor. Wie geht die Reihe weiter? ${f.join(', ')}, …`, f[4] + f[3], f[2], 5); },
      ],
      6: [
        () => { const a = ri(31, 69), b = ri(31, 69); mk(`Was ergibt ${a} × ${b}?`, a * b, 30, 6); },
        () => { const a = ri(101, 199), b = ri(11, 19); mk(`Was ergibt ${a} × ${b}?`, a * b, 100, 6); },
        () => { const n = ri(41, 99); mk(`Wie groß ist die Summe aller Zahlen von 1 bis ${n}?`, n * (n + 1) / 2, 40, 6); },
        () => {
          let p; do { p = ri(101, 499); } while (!isPrime(p));
          const sm = [7, 11, 13, 17, 19, 23];
          const comp = new Set();
          for (const a of shuffle(sm)) for (const b of shuffle(sm)) { const c = a * b; if (c > 100 && c < 520 && !comp.has(c)) comp.add(c); }
          const wrong = shuffle([...comp]).slice(0, 3).map(String);
          out.push({ q: 'Welche dieser Zahlen ist eine Primzahl?', richtig: String(p), falsch: wrong, schwierigkeit: 6 });
        },
      ],
    };
    for (let lvl = 1; lvl <= 6; lvl++) {
      const ms = makers[lvl];
      const before = out.length;
      for (let i = 0, tries = 0; out.length - before < per && tries < per * 6; i++, tries++) ms[i % ms.length]();
    }
    return out;
  }
  /** Alle Kategorien: der feste Pool plus die erzeugte Kategorie (bei jedem Aufruf neu gewürfelt) */
  function categories() {
    const base = (window.QUESTIONS && window.QUESTIONS.kategorien) || [];
    return base.concat([{ id: 'kopf', name: 'Kopfrechnen', emoji: '🧮', gen: true, fragen: genMath(4) }]);
  }

  /** `n` Fragen aus einer Kategorie für die Stufe `diffId`; schon gespielte und schon gesehene Fragen kommen zuletzt */
  function pickQuestions(room, cat, diffId, n) {
    const count = n || QN;
    const key = (i) => cat.id + '|' + i;
    const plan = planFor(diffId, count);
    const chosen = [];
    for (const did of plan) {
      const d = diffOf(did);
      let got = null;
      for (let attempt = 0; attempt < 2 && got == null; attempt++) {
        for (const tier of tiersOf(d)) {
          const idx = cat.fragen.map((_, i) => i).filter((i) => !chosen.includes(i) && !room.usedQ.has(key(i)) && (!tier || tier.includes(levelOf(cat.fragen[i]))));
          if (!idx.length) continue;
          const fresh = idx.filter((i) => !History.has(cat.fragen[i].q));
          got = pick(fresh.length ? fresh : idx);
          break;
        }
        if (got == null) cat.fragen.forEach((_, i) => room.usedQ.delete(key(i)));   // alles schon gespielt: von vorn
      }
      if (got != null) chosen.push(got);
    }
    chosen.forEach((i) => { room.usedQ.add(key(i)); History.add(cat.fragen[i].q); });
    return chosen.map((i) => cat.fragen[i]).sort((a, b) => levelOf(a) - levelOf(b));
  }

  const setDeadline = (g, ms) => { g.deadline = Date.now() + ms; g.total = ms; };

  function startTile(room, g) {
    room.clearTimers();
    const free = g.grid.filter((t) => t.owner === null);
    if (!free.length) return endGame(room, g);
    g.cur = pick(free).i;
    g.qi = 0;
    g.tileScore = TEAMS.map(() => 0);
    g.phase = 'cat';
    g.answers = {};
    g.q = null;
    g.reveal = null;
    g.tileResult = null;
    setDeadline(g, T(3500));
    room.after(T(3500), () => askQ(room, g));
    room.changed();
  }

  function askQ(room, g) {
    if (g.phase !== 'cat' && g.phase !== 'reveal') return;
    room.clearTimers();
    const q = g.grid[g.cur].qs[g.qi];
    const opts = shuffle([{ x: q.richtig, ok: true }, ...q.falsch.map((x) => ({ x, ok: false }))]);
    g.q = { text: q.q, opts: opts.map((o) => o.x), correct: opts.findIndex((o) => o.ok), lvl: levelOf(q) };
    g.answers = {};
    g.hidden = {};
    g.reveal = null;
    g.phase = 'q';
    setDeadline(g, T(g.time * 1000));
    room.after(T(g.time * 1000), () => resolve(room, g));
    botAnswers(room, g);
    room.changed();
  }

  /** Bots antworten nach zufälliger Bedenkzeit, je nach Stärke mit unterschiedlicher Trefferquote */
  function botAnswers(room, g) {
    const B = PG.Bots;
    for (const p of room.players) {
      if (!p.bot || p.team == null) continue;
      const L = B.LEVEL[p.bot];
      const right = Math.random() < Math.max(0.3, L.quiz * diffOf(g.diff).bot);
      const idx = right ? g.q.correct : B.pick([0, 1, 2, 3].filter((i) => i !== g.q.correct));
      room.after(T(g.time * 1000 * B.rnd(L.quizSpeed[0], L.quizSpeed[1])), () => {
        if (g.phase !== 'q' || g.answers[p.id] != null) return;
        g.answers[p.id] = idx;
        if (allAnswered(room, g)) resolve(room, g); else room.changed();
      });
    }
  }

  function resolve(room, g) {
    if (g.phase !== 'q') return;
    room.clearTimers();
    const per = TEAMS.map((_, t) => {
      const members = teamPlayers(room, t);
      const counts = [0, 0, 0, 0];
      const names = [[], [], [], []];
      const silent = [];
      for (const p of members) {
        const a = g.answers[p.id];
        if (a != null) { counts[a]++; names[a].push({ id: p.id, name: p.name, color: p.color }); } else if (p.connected) silent.push(p.name);
      }
      const m = majority(counts);
      const correct = m.choice != null && m.choice === g.q.correct;
      if (correct) g.tileScore[t]++;
      return { choice: m.choice, tie: m.tie, correct, names, silent };
    });
    g.reveal = { per };
    g.phase = 'reveal';
    setDeadline(g, T(9000));
    room.after(T(9000), () => next(room, g));
    room.changed();
  }

  function next(room, g) {
    if (g.phase !== 'reveal') return;
    room.clearTimers();
    g.qi++;
    if (g.qi < QN) askQ(room, g);
    else finishTile(room, g);
  }

  function finishTile(room, g) {
    const ts = g.tileScore;
    const max = Math.max(...ts);
    const top = ts.map((s, i) => (s === max ? i : -1)).filter((i) => i >= 0);
    const tile = g.grid[g.cur];
    if (max > 0 && top.length === 1) { tile.owner = top[0]; g.scores[top[0]]++; } else tile.owner = 'draw';
    g.played++;
    g.tileResult = { owner: tile.owner, tileScore: ts.slice() };
    g.phase = 'tile';
    setDeadline(g, T(5000));
    room.after(T(5000), () => afterTile(room, g));
    room.changed();
  }

  function afterTile(room, g) {
    if (g.phase !== 'tile') return;
    room.clearTimers();
    if (Math.max(...g.scores) >= g.win) return endGame(room, g);
    startTile(room, g);
  }

  function endGame(room, g) {
    room.clearTimers();
    const max = Math.max(...g.scores);
    const top = g.scores.map((s, i) => (s === max ? i : -1)).filter((i) => i >= 0);
    g.winner = top.length === 1 ? top[0] : 'draw';
    g.phase = 'end';
    g.deadline = 0;
    room.changed();
  }

  const allAnswered = (room, g) => connectedVoters(room).every((p) => g.answers[p.id] != null);

  GAMES.quiz = {
    id: 'quiz',
    name: 'Kategorie-Duell',
    emoji: '🧠',
    order: 1,
    ready: true,
    teams: true,
    blurb: 'Zwei Teams, 16 Kategorien. Alle antworten, die Mehrheit im Team zählt. Wer zuerst genug Felder hat, gewinnt.',
    setSetting(room, key, val) {
      const s = room.settings.quiz;
      if (key === 'win' && [4, 5, 6].includes(val)) s.win = val;
      if (key === 'time' && [10, 15, 20, 30, 45, 60].includes(val)) s.time = val;
      if (key === 'diff' && DIFF_IDS.includes(val)) s.diff = val;
      if (key === 'joker' && typeof val === 'boolean') s.joker = val;
    },
    canStart(room) {
      if (!window.QUESTIONS || !window.QUESTIONS.kategorien || window.QUESTIONS.kategorien.length < 9) return 'Der Fragenpool fehlt.';
      if (room.players.filter((p) => p.connected).length < 2) return 'Du brauchst mindestens 2 Spieler.';
      for (let t = 0; t < TEAMS.length; t++) {
        if (!room.players.some((p) => p.connected && p.team === t)) return 'In jedem Team muss mindestens eine Person sein.';
      }
      return null;
    },
    init(room) {
      const cfg = room.settings.quiz;
      const all = categories().filter((c) => c.fragen.length >= QN);
      const n = all.length >= 16 ? 16 : all.length >= 9 ? 9 : 4;
      const grid = shuffle(all).slice(0, n).map((c, i) => ({ i, id: c.id, name: c.name, emoji: c.emoji, owner: null, qs: pickQuestions(room, c, cfg.diff, QN) }));
      return {
        joker: !!cfg.joker, jokerLeft: TEAMS.map(() => (cfg.joker ? 1 : 0)), hidden: {},
        phase: 'cat', grid, cols: Math.sqrt(n), win: cfg.win, time: cfg.time, diff: cfg.diff,
        scores: TEAMS.map(() => 0), cur: null, qi: 0, tileScore: TEAMS.map(() => 0),
        answers: {}, q: null, reveal: null, tileResult: null, winner: null, deadline: 0, total: 0, played: 0,
      };
    },
    begin(room) { startTile(room, room.game); },
    act(room, pid, msg) {
      const g = room.game;
      const isHost = pid === room.hostId;
      if (msg.a === 'ans') {
        const p = pl(room, pid);
        const i = msg.i | 0;
        if (g.phase !== 'q' || !p || p.team == null || !p.connected || g.answers[pid] != null || i < 0 || i > 3) return;
        if (g.hidden && g.hidden[p.team] && g.hidden[p.team].includes(i)) return; // ausgeblendet durch 50:50
        g.answers[pid] = i;
        if (allAnswered(room, g)) resolve(room, g);
      } else if (msg.a === 'joker') {
        const p = pl(room, pid);
        if (!g.joker || g.phase !== 'q' || !p || p.team == null || !p.connected || !(g.jokerLeft[p.team] > 0) || g.hidden[p.team]) return;
        g.jokerLeft[p.team]--;
        g.hidden[p.team] = shuffle([0, 1, 2, 3].filter((i) => i !== g.q.correct)).slice(0, 2).sort();
        room.changed();
      } else if (msg.a === 'skip' && isHost) {
        if (g.phase === 'cat') askQ(room, g);
        else if (g.phase === 'reveal') next(room, g);
        else if (g.phase === 'tile') afterTile(room, g);
      } else if (msg.a === 'again' && isHost && g.phase === 'end') {
        room.restartGame();
      }
    },
    gone(room) {
      const g = room.game;
      if (g && g.phase === 'q' && allAnswered(room, g)) resolve(room, g);
    },
    view(room, pid) {
      const g = room.game;
      const me = pl(room, pid);
      const myTeam = me ? me.team : null;
      const v = {
        phase: g.phase, cols: g.cols, win: g.win, diff: g.diff, scores: g.scores, played: g.played, cur: g.cur, qi: g.qi, myTeam,
        grid: g.grid.map((x) => ({ i: x.i, name: x.name, emoji: x.emoji, owner: x.owner })),
        remaining: Math.max(0, g.deadline - Date.now()), total: g.total, tileScore: g.tileScore,
      };
      if (g.cur != null) v.tile = { name: g.grid[g.cur].name, emoji: g.grid[g.cur].emoji };
      if (g.phase === 'q' || g.phase === 'reveal') {
        v.q = { text: g.q.text, opts: g.q.opts, lvl: g.q.lvl };
        v.myAnswer = g.answers[pid] != null ? g.answers[pid] : null;
        v.mates = room.players.filter((p) => p.team === myTeam && p.connected).map((p) => ({ id: p.id, name: p.name, color: p.color, done: g.answers[p.id] != null }));
        v.answered = TEAMS.map((_, k) => {
          const vs = room.players.filter((p) => p.team === k && p.connected);
          return { done: vs.filter((p) => g.answers[p.id] != null).length, total: vs.length };
        });
      }
      if (g.joker && (g.phase === 'q' || g.phase === 'reveal') && myTeam != null) v.joker = { left: g.jokerLeft[myTeam], hidden: g.hidden[myTeam] || [], lefts: g.jokerLeft.slice() };
      if (g.phase === 'reveal') { v.q.correct = g.q.correct; v.reveal = g.reveal; }
      if (g.phase === 'tile') v.tileResult = g.tileResult;
      if (g.phase === 'end') v.winner = g.winner;
      return v;
    },
  };

  /* Quiz-Design: nur für die eigene Anzeige, wird lokal gemerkt */
  const SKINS = [['bunt', 'Bunt'], ['show', 'Show'], ['retro', 'Retro'], ['pastell', 'Pastell']];
  const skin = () => { try { const v = localStorage.getItem('pg.quizSkin'); return SKINS.some((x) => x[0] === v) ? v : 'bunt'; } catch (e) { return 'bunt'; } };
  const skinClass = () => (skin() === 'bunt' ? '' : ' sk-' + skin());
  const skinSeg = (rerender) => h('div', { class: 'seg skinseg' }, h('b', null, 'Design (nur für dich)'),
    SKINS.map(([id, label]) => h('button', { 'aria-pressed': String(skin() === id), onclick: () => { try { localStorage.setItem('pg.quizSkin', id); } catch (e) { /* egal */ } rerender(); } }, label)));

  /** Auswahl der Schwierigkeit (für Kategorie-Duell und Blitzquiz) */
  const diffSeg = (cfg, isHost, onPick) => h('div', { class: 'seg diffseg' }, h('b', null, 'Schwierigkeit'),
    DIFFS.map((d) => h('button', { 'aria-pressed': String(cfg.diff === d.id), disabled: !isHost, onclick: () => onPick(d.id) }, d.label)),
    h('span', { class: 'hint small' }, diffOf(cfg.diff).hint));

  PG.quizHelpers = { skinSeg, skinClass, majority, History, categories, genMath, hashQ, SHAPES, OPT, DIFFS, DIFF_IDS, diffOf, levelOf, levelLabel, planFor, tiersOf, diffSeg };

  /** Der Fragenpool liegt in fragen.js und wird nur vom Host geladen (nicht von reinen Mitspielern). */
  PG.loadQuestions = () => {
    if (window.QUESTIONS) return Promise.resolve();
    return new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'fragen.js';
      s.onload = () => {
        try {
          const key = 'spielstube-fragen';
          const bin = atob(window.__Q);
          const bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i) ^ key.charCodeAt(i % key.length);
          window.QUESTIONS = JSON.parse(new TextDecoder().decode(bytes));
          delete window.__Q;
          res();
        } catch (e) { rej(e); }
      };
      s.onerror = () => rej(new Error('fragen.js fehlt'));
      document.head.append(s);
    });
  };

  PG.LobbyUI.quiz = (v, isHost, send, rerender) => {
    const cfg = v.settings.quiz;
    const seg = (label, key, values, cur, fmt) => h('div', { class: 'seg' }, h('b', null, label),
      values.map((x) => h('button', { 'aria-pressed': String(cur === x), disabled: !isHost, onclick: () => send({ t: 'setting', game: 'quiz', key, value: x }) }, fmt ? fmt(x) : x)));
    return h('div', { class: 'card', style: { marginTop: '12px' } },
      seg('Siegfelder', 'win', [4, 5, 6], cfg.win),
      diffSeg(cfg, isHost, (x) => send({ t: 'setting', game: 'quiz', key: 'diff', value: x })),
      seg('Bedenkzeit pro Frage', 'time', [10, 15, 20, 30, 45, 60], cfg.time, (x) => x + ' s'),
      h('div', { class: 'seg' }, h('b', null, '50:50-Joker'), [false, true].map((x) => h('button', { 'aria-pressed': String(!!cfg.joker === x), disabled: !isHost, onclick: () => send({ t: 'setting', game: 'quiz', key: 'joker', value: x }) }, x ? '🔀 An' : 'Aus'))),
      cfg.joker ? h('p', { class: 'hint small' }, 'Jedes Team darf einmal pro Spiel bei einer Frage zwei falsche Antworten für das eigene Team ausblenden. Jede Person im Team kann ihn einsetzen.') : null,
      skinSeg(rerender),
      isHost ? h('div', { class: 'seg' }, h('b', null, 'Fragenverlauf'), h('span', { class: 'hint small' }, History.count() + ' Fragen gemerkt, neue kommen zuerst'),
        h('button', { onclick: () => { History.clear(); rerender(); } }, 'Zurücksetzen')) : null);
  };

  /* ---------- Oberfläche (bei allen) ---------- */

  let lastKey = '';
  const tname = (t) => 'Team ' + TEAMS[t].name;

  function scoreBar(v) {
    return h('div', { class: 'scorebar' }, TEAMS.map((tm, t) => h('div', { class: 'tscore' + (v.myTeam === t ? ' mine' : ''), style: { '--tc': tm.color } },
      h('b', null, tname(t) + (v.myTeam === t ? ' (du)' : '')),
      h('span', { class: 'pips', 'aria-label': v.scores[t] + ' von ' + v.win + ' Feldern' }, Array.from({ length: v.win }, (_, i) => h('i', { class: i < v.scores[t] ? 'on' : '' }))))));
  }

  function gridEl(v) {
    return h('div', { class: 'qgrid', style: { '--cols': v.cols } }, v.grid.map((t) => {
      const cls = 'qtile' + (t.owner === 0 ? ' o0' : t.owner === 1 ? ' o1' : t.owner === 'draw' ? ' od' : '') + (v.cur === t.i && v.phase !== 'end' ? ' cur' : '');
