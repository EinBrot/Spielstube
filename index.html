'use strict';
/*
 * Werwolf (auch im Mörder-Thema): Die Nacht wählen die Werwölfe ein Opfer, am Tag stimmt das Dorf ab, wer verbannt wird.
 *
 * Aufbau: Alles entscheidet der Host. Jede Person sieht nur ihre eigene Rolle und das, was sie wissen darf (view).
 * Ablauf: Rollen ansehen (reveal) → Nacht (night, ein Schritt je Rolle) → Morgen (dawn) → Diskussion (day) → Abstimmung (vote)
 *         → Ergebnis (result) → ggf. Schuss des Jägers (shot) → nächste Nacht … → Ende (end).
 * Erzähler: „voice“ = Vorleser (die App liest die Nacht vor, läuft automatisch), „player“ = eine Person erzählt und steuert den Ablauf
 *           (spielt nicht mit, sieht alle Rollen), „off“ = automatisch, nur Text.
 * Rollen: je Rolle Stärke (1 bis 3 Punkte) und Mindest-Gruppengröße. Je nach Gruppengröße gibt es höchstens eine Zahl von Stärke-Punkten,
 *         starken Rollen (3 Punkte), gefährlichen Einzelgängern und Werwölfen (limits/check). Die Rollenwahl ist „klassisch“ (fertig
 *         zusammengestellt), „zufällig“ oder „eigene“ (Host zählt selbst, die Grenzen gelten trotzdem).
 * Nachrichten Client→Host: ready, night (ids, flag, heal, poison), tovote, vote, shoot, next, again.
 */
(function () {
  const { T, shuffle, GAMES } = PG;

  /* ---------- Themen und Rollen ---------- */

  const THEMES = {
    wolf: { id: 'wolf', name: 'Werwölfe', icon: '🐺', killer: 'Werwolf', killers: 'Werwölfe', kd: 'Werwölfen', killerEmoji: '🐺', place: 'Dorf', thePlace: 'das Dorf', ofPlace: 'des Dorfes', inPlace: 'im Dorf', villagers: 'Dorfbewohner', recruit: 'verwandeln', recruited: 'verwandelt', exiled: 'verbannt', team: 'Das Dorf' },
    mord: { id: 'mord', name: 'Mörder', icon: '🔪', killer: 'Mörder', killers: 'Mörder', kd: 'Mördern', killerEmoji: '🗡️', place: 'Stadt', thePlace: 'die Stadt', ofPlace: 'der Stadt', inPlace: 'in der Stadt', villagers: 'Bürger', recruit: 'anwerben', recruited: 'angeworben', exiled: 'verhaftet', team: 'Die Stadt' },
  };
  const theme = (id) => THEMES[id] || THEMES.wolf;

  /**
   * side: dorf, wolf (Werwolf-Seite), solo (kämpft allein); pw = Stärke (Punkte), min = ab so vielen Mitspielenden wählbar,
   * hostile = gefährlicher Einzelgänger (zählt gesondert), n = [Name im Werwolf-Thema, Name im Mörder-Thema], art = Artikel.
   */
  const ROLES = {
    dorf: { side: 'dorf', pw: 0, min: 0, max: 99, emoji: '🧑‍🌾', art: 'der', n: ['Dorfbewohner', 'Bürger'], d: (t) => `Du hast keine Fähigkeit, aber eine Stimme. Finde mit den anderen heraus, wer die ${t.killers} sind.` },
    werwolf: { side: 'wolf', pw: 0, min: 0, max: 99, emoji: '🐺', art: 'der', n: ['Werwolf', 'Mörder'], d: (t) => `Du erwachst jede Nacht mit den anderen ${t.kd} und ihr wählt gemeinsam ein Opfer. Tagsüber tust du unschuldig.` },
    urwolf: { side: 'wolf', pw: 2, min: 6, max: 1, emoji: '👑', art: 'der', n: ['Urwolf', 'Auftraggeber'], d: (t) => `Du bist ${t.killer} und wählst mit den anderen das Opfer. Einmal im Spiel kannst du das Opfer stattdessen ${t.recruit}: Es überlebt und gehört ab jetzt zu euch.` },
    verraeter: { side: 'wolf', pw: 1, min: 7, max: 1, emoji: '🎭', art: 'der', n: ['Verräter', 'Komplize'], d: (t) => `Du gehörst zu den ${t.kd}, kennst sie, aber sie kennen dich nicht. Du wachst nachts nicht auf und gilt für den Seher als harmlos.` },
    seher: { side: 'dorf', pw: 2, min: 4, max: 1, emoji: '🔮', art: 'der', n: ['Seher', 'Detektiv'], d: (t) => `Jede Nacht erforschst du eine Person und erfährst, ob sie zu den ${t.kd} gehört (oder bei „Rolle“ ihre ganze Rolle).` },
    hexe: { side: 'dorf', pw: 3, min: 5, max: 1, emoji: '🧪', art: 'die', n: ['Hexe', 'Apothekerin'], d: () => 'Du hast einen Heiltrank und einen Gifttrank, jeden nur einmal. Du siehst das Opfer der Nacht und entscheidest, ob du es rettest oder jemanden vergiftest.' },
    amor: { side: 'dorf', pw: 2, min: 5, max: 1, emoji: '💘', art: 'der', n: ['Amor', 'Amor'], d: () => 'In der ersten Nacht verliebst du zwei Personen (auch dich selbst). Stirbt eine, stirbt auch die andere. Sind die beiden Gegner, gewinnen sie nur gemeinsam.' },
    jaeger: { side: 'dorf', pw: 2, min: 5, max: 1, emoji: '🏹', art: 'der', n: ['Jäger', 'Sheriff'], d: () => 'Stirbst du, egal wie, schießt du noch einmal und nimmst eine Person mit.' },
    beschuetzer: { side: 'dorf', pw: 2, min: 5, max: 1, emoji: '🛡️', art: 'der', n: ['Beschützer', 'Leibwächter'], d: () => 'Jede Nacht beschützt du eine Person vor einem Angriff, nie zweimal hintereinander dieselbe. Gift wirkt trotzdem.' },
    buergermeister: { side: 'dorf', pw: 2, min: 6, max: 1, emoji: '🎖️', art: 'der', n: ['Bürgermeister', 'Bürgermeister'], d: () => 'Deine Stimme zählt bei der Abstimmung doppelt.' },
    idiot: { side: 'dorf', pw: 1, min: 5, max: 1, emoji: '🤡', art: 'der', n: ['Dorfnarr', 'Stadtnarr'], d: (t) => `Wählt ${t.thePlace} dich bei der Abstimmung aus, überlebst du, darfst aber nie mehr abstimmen.` },
    aeltester: { side: 'dorf', pw: 1, min: 5, max: 1, emoji: '👴', art: 'der', n: ['Ältester', 'Rentner'], d: (t) => `Du überlebst den ersten Angriff der ${t.killers}.` },
    wildkind: { side: 'dorf', pw: 1, min: 6, max: 1, emoji: '🧒', art: 'das', n: ['Wildes Kind', 'Straßenkind'], d: (t) => `In der ersten Nacht wählst du ein Vorbild. Stirbt es, wirst du selbst ${t.killer} und wachst mit den anderen auf.` },
    gaukler: { side: 'solo', pw: 1, min: 5, max: 1, emoji: '🃏', art: 'der', n: ['Gaukler', 'Clown'], d: (t) => `Du gewinnst allein, wenn ${t.thePlace} dich bei der Abstimmung verbannt. Mach dich verdächtig, aber nicht zu sehr!` },
    serienmoerder: { side: 'solo', pw: 3, min: 8, max: 1, hostile: true, emoji: '🔪', art: 'der', n: ['Serienmörder', 'Psychopath'], d: () => 'Du tötest jede Nacht allein eine Person und gewinnst, wenn du als Einziger übrig bleibst. Alle anderen sind deine Gegner.' },
    floetenspieler: { side: 'solo', pw: 3, min: 8, max: 1, hostile: true, emoji: '🎶', art: 'der', n: ['Flötenspieler', 'Hypnotiseur'], d: () => 'Jede Nacht verzauberst du zwei Personen. Du gewinnst, wenn alle anderen Lebenden verzaubert sind.' },
  };
  const ROLE_IDS = Object.keys(ROLES);
  const SPECIAL_IDS = ROLE_IDS.filter((id) => id !== 'dorf' && id !== 'werwolf');
  const roleName = (id, th) => ROLES[id].n[th === 'mord' ? 1 : 0];
  const roleEmoji = (id, th) => (id === 'werwolf' ? theme(th).killerEmoji : ROLES[id].emoji);
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  /** „der Seher“, „die Hexe“, „das wilde Kind“, „Amor“ (für ganze Sätze) */
  const withArt = (id, th) => (id === 'amor' ? 'Amor' : id === 'wildkind' ? (th === 'mord' ? 'das Straßenkind' : 'das wilde Kind') : ROLES[id].art + ' ' + roleName(id, th));

  /** Reihenfolge der Nacht. amor und wildkind nur in der ersten Nacht. */
  const NIGHT_ORDER = ['amor', 'wildkind', 'beschuetzer', 'seher', 'werwolf', 'hexe', 'serienmoerder', 'floetenspieler'];
  const FIRST_ONLY = ['amor', 'wildkind'];
  const WAKES = { werwolf: ['werwolf', 'urwolf'] };

  const NIGHT_TIMES = [15, 20, 30, 45];
  const DAY_TIMES = [0, 60, 90, 120, 180];
  const VOTE_TIMES = [20, 30, 45, 60];
  const NARR = [['voice', 'Vorleser'], ['player', 'Eine Person erzählt'], ['off', 'Nur Text']];
  const MODES = [['classic', 'Klassisch'], ['random', 'Zufall'], ['custom', 'Eigene Auswahl']];
  const MAX_NIGHTS = 30;

  /* ---------- Rollenwahl: Grenzen je Gruppengröße ---------- */

  /**
   * Grenzen für n Mitspielende. points: Stärke-Punkte aller Spezialrollen zusammen, strong: Rollen mit 3 Punkten,
   * hostile: gefährliche Einzelgänger, maxWolves: Werwölfe (inklusive Verräter), autoWolves: Standardzahl.
   */
  function limits(n) {
    return {
      n,
      points: Math.floor(n * 1.1) + 1,
      strong: Math.max(1, Math.floor(n / 4)),
      hostile: n >= 10 ? 2 : 1,
      maxWolves: Math.max(1, Math.ceil(n / 3)),
      autoWolves: Math.max(1, Math.round(n / 4)),
    };
  }

  /**
   * Prüft eine Auswahl. roles: { rollenId: anzahl } für Spezialrollen, wolves: Zahl der aufwachenden Wölfe (0 = automatisch,
   * der Urwolf zählt mit). Liefert Verbrauch und Verstöße.
   */
  function check(roles, wolves, n, opts) {
    const L = limits(n);
    const W = wolves ? wolves : L.autoWolves;
    const s = { n, wolves: W, points: 0, pointsMax: L.points, strong: 0, strongMax: L.strong, hostile: 0, hostileMax: L.hostile, wolvesMax: L.maxWolves, roles: 0, villagers: 0, problems: [] };
    let others = 0;
    let traitors = 0;
    for (const id of SPECIAL_IDS) {
      const c = (roles && roles[id]) | 0;
      if (c <= 0) continue;
      const r = ROLES[id];
      s.points += r.pw * c;
      if (r.pw >= 3) s.strong += c;
      if (r.hostile) s.hostile += c;
      if (id === 'verraeter') traitors += c;
      if (id !== 'urwolf') others += c;
      if (r.min > n) s.problems.push(`${roleName(id)} gibt es erst ab ${r.min} Mitspielenden.`);
      if (c > r.max) s.problems.push(`${roleName(id)} kann es nur ${r.max}-mal geben.`);
    }
    const urwolf = (roles && roles.urwolf) | 0;
    s.roles = W + others;
    s.villagers = n - s.roles;
    if (W > L.maxWolves) s.problems.push(`Bei ${n} Mitspielenden sind höchstens ${L.maxWolves} Werwölfe erlaubt.`);
    else if (W + traitors > L.maxWolves) s.problems.push(`Werwölfe und Verräter zusammen: höchstens ${L.maxWolves} bei ${n} Mitspielenden.`);
    if (urwolf > W) s.problems.push('Der Urwolf zählt zu den Werwölfen: Erhöhe deren Zahl.');
    if (s.roles > n) s.problems.push(`Zu viele Rollen: ${s.roles} Rollen für ${n} Mitspielende.`);
    if (opts && opts.villager && s.villagers < 1) s.problems.push('Es muss mindestens ein normaler Dorfbewohner übrig bleiben.');
    if (s.points > L.points) s.problems.push(`Zu stark für ${n} Mitspielende: ${s.points} Stärke-Punkte, erlaubt sind ${L.points}.`);
    if (s.strong > L.strong) s.problems.push(`Zu viele starke Rollen: ${s.strong}, erlaubt sind ${L.strong} bei ${n} Mitspielenden.`);
    if (s.hostile > L.hostile) s.problems.push(`Zu viele gefährliche Einzelgänger: ${s.hostile}, erlaubt sind ${L.hostile}.`);
    s.ok = s.problems.length === 0;
    return s;
  }

  /** Darf diese Rolle noch dazu? (für die Knöpfe der Oberfläche) */
  function canAdd(roles, wolves, n, id) {
    const r = ROLES[id];
    if (!r || id === 'dorf' || id === 'werwolf' || r.min > n || ((roles && roles[id]) | 0) >= r.max) return false;
    return check(Object.assign({}, roles, { [id]: ((roles && roles[id]) | 0) + 1 }), wolves, n).ok;
  }

  /** Aus Einstellung und Gruppengröße die Rollenzahlen machen: { werwolf, urwolf, …, dorf }. rnd = Zufallsquelle. */
  function compose(cfg, n, rnd) {
    const L = limits(n);
    const wolves = cfg.wolves ? Math.min(cfg.wolves, L.maxWolves) : 0;
    let roles = {};
    if (cfg.mode === 'custom') {
      for (const id of SPECIAL_IDS) {
        const c = (cfg.roles && cfg.roles[id]) | 0;
        if (c > 0 && ROLES[id].min <= n) roles[id] = Math.min(c, ROLES[id].max);
      }
      // Notbremse, falls die Gruppe seit der Wahl kleiner wurde: stärkste Rollen zuerst weglassen
      const order = SPECIAL_IDS.slice().sort((a, b) => ROLES[b].pw - ROLES[a].pw);
      for (const id of order) { if (check(roles, wolves, n).ok) break; delete roles[id]; }
    } else {
      const list = cfg.mode === 'classic' ? ['seher', 'hexe', 'amor', 'jaeger', 'beschuetzer'] : shuffle(SPECIAL_IDS.filter((id) => ROLES[id].min <= n));
      for (const id of list) {
        if (cfg.mode === 'random' && rnd() < 0.3) continue;
        const t = Object.assign({}, roles, { [id]: 1 });
        if (check(t, wolves, n, { villager: true }).ok) roles = t;
      }
    }
    const W = wolves || L.autoWolves;
    const counts = Object.assign({}, roles);
    counts.werwolf = Math.max(0, W - ((roles.urwolf) | 0));
    let rest = n - W;
    for (const id of SPECIAL_IDS) if (id !== 'urwolf') rest -= (roles[id] | 0);
    counts.dorf = Math.max(0, rest);
    return { counts, wolves: W };
  }
  const expand = (counts) => { const a = []; for (const id of ROLE_IDS) for (let i = 0; i < (counts[id] | 0); i++) a.push(id); return a; };

  /* ---------- Sieg ---------- */

  const teamOf = (p) => (ROLES[p.role].side === 'wolf' ? 'wolf' : p.role === 'serienmoerder' ? 'killer' : p.role === 'floetenspieler' ? 'piper' : p.role === 'gaukler' ? 'jester' : 'dorf');
  /** Wer gewinnt gerade? null = Spiel geht weiter. Mindestens p.role, p.alive, p.lover, p.enchanted nötig. */
  function winCheck(pl) {
    const al = pl.filter((p) => p.alive);
    if (!al.length) return { team: 'none' };
    if (al.length === 2 && al[0].lover === al[1].id && al[1].lover === al[0].id && teamOf(al[0]) !== teamOf(al[1])) return { team: 'love' };
    if (al.length === 1) return { team: teamOf(al[0]) };
    const piper = al.find((p) => p.role === 'floetenspieler');
    if (piper && al.every((p) => p === piper || p.enchanted)) return { team: 'piper' };
    const wolves = al.filter((p) => teamOf(p) === 'wolf').length;
    const hostile = al.some((p) => teamOf(p) === 'killer' || teamOf(p) === 'piper');
    if (hostile) return null;
    if (wolves === 0) return { team: 'dorf' };
    if (wolves >= al.length - wolves) return { team: 'wolf' };
    return null;
  }

  /* ---------- Erzähltexte (für Vorleser und für den Erzähler) ---------- */

  const NAR = {
    start: (t) => `Willkommen bei den ${t.killers}. Seht euch jetzt in Ruhe eure Karte an und verratet niemandem, wer ihr seid.`,
    night: () => 'Die Nacht bricht an. Alle schließen die Augen und schlafen ein.',
    open: (role, t) => ({
      amor: 'Amor erwacht. Wähle zwei Menschen, die sich ineinander verlieben.',
      wildkind: `${cap(withArt('wildkind', t.id))} erwacht und wählt sich ein Vorbild.`,
      beschuetzer: `${cap(withArt('beschuetzer', t.id))} erwacht und wählt, wen er in dieser Nacht beschützt.`,
      seher: `${cap(withArt('seher', t.id))} erwacht und darf eine Person erforschen.`,
      werwolf: `Die ${t.killers} erwachen und wählen ihr Opfer.`,
      hexe: `${cap(withArt('hexe', t.id))} erwacht. Sie sieht das Opfer und entscheidet über ihre Tränke.`,
      serienmoerder: `${cap(withArt('serienmoerder', t.id))} erwacht und wählt sein Opfer.`,
      floetenspieler: `${cap(withArt('floetenspieler', t.id))} erwacht und verzaubert zwei Personen.`,
    })[role],
    close: (role, t) => (role === 'werwolf' ? `Die ${t.killers} schlafen wieder ein.` : `${cap(withArt(role, t.id))} schläft wieder ein.`),
    dawn: (dead, t, reveal) => {
      if (!dead.length) return 'Die Sonne geht auf. In dieser Nacht ist niemand gestorben.';
      const names = dead.map((d) => d.name + (reveal ? `, ${withArt(d.role, t.id)}` : ''));
      return `Die Sonne geht auf. ${dead.length === 1 ? 'In dieser Nacht ist' : 'In dieser Nacht sind'} ${names.join(' und ')} gestorben.`;
    },
    day: (t) => `Jetzt wird diskutiert: Wer könnte ${t.killer} sein?`,
    vote: (t) => `Die Abstimmung beginnt. Wer soll ${t.thePlace} verlassen?`,
    result: (r, t, reveal) => {
      if (r.kind === 'idiot') return `${r.name} ist ${withArt('idiot', t.id)} und bleibt, darf aber nie mehr abstimmen.`;
      if (!r.victim) return 'Niemand erhält die meisten Stimmen. Heute wird niemand ausgeschlossen.';
      return `${r.name} ${t.exiled === 'verbannt' ? 'wird verbannt' : 'wird verhaftet'}${reveal ? ` und war ${withArt(r.role, t.id)}` : ''}.`;
    },
    shot: (name) => `${name} war der Jäger und darf noch einmal schießen.`,
    end: (w, t) => ({
      dorf: `${t.team} gewinnt!`, wolf: `Die ${t.killers} gewinnen!`, love: 'Das Liebespaar gewinnt!', killer: `${cap(withArt('serienmoerder', t.id))} gewinnt allein!`,
      piper: `${cap(withArt('floetenspieler', t.id))} gewinnt: Alle sind verzaubert!`, jester: `${cap(withArt('gaukler', t.id))} gewinnt: Er wurde verbannt, genau wie geplant!`, none: 'Niemand überlebt. Niemand gewinnt.',
    })[w.team] || 'Das Spiel ist aus.',
  };

  /* ---------- Hilfen ---------- */

  const P = (g, id) => g.pl.find((p) => p.id === id) || null;
  const alive = (g) => g.pl.filter((p) => p.alive);
  const auto = (g) => g.cfg.narr !== 'player';
  const humans = (g) => g.pl.filter((p) => !p.bot);
  const th = (g) => theme(g.cfg.theme);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const sample = (a, n) => shuffle(a).slice(0, n);
  const ev = (room) => room.changed();
  const tally = (arr) => { const m = {}; for (const x of arr) m[x] = (m[x] || 0) + 1; return m; };
  const topOf = (counts, k) => {
    // die k meistgewählten Ziele, bei Gleichstand entscheidet das Los
    const ids = shuffle(Object.keys(counts));
    ids.sort((a, b) => counts[b] - counts[a]);
    return ids.slice(0, k);
  };
  const say = (g, text) => { g.say = { n: (g.say ? g.say.n : 0) + 1, text }; };
  const teammatesOf = (g, p) => g.pl.filter((q) => q.id !== p.id && ROLES[q.role].side === 'wolf' && q.role !== 'verraeter');
  const wakesFor = (role) => WAKES[role] || [role];

  /* ---------- Ablaufsteuerung (nur Host) ---------- */

  function setPhase(room, g, phase) {
    room.clearTimers();
    g.phase = phase;
    g.key++;
    g.deadline = 0;
    g.total = 0;
  }
  /** Zeitgeber, nur im automatischen Modus (beim Erzähler steuert die Person) */
  function timer(room, g, ms, fn) {
    if (!auto(g) || !ms) return;
    g.total = T(ms);
    g.deadline = Date.now() + g.total;
    const key = g.key;
    room.after(g.total, () => { if (g.key === key) fn(); });
  }
  /** Kurze Verzögerung, die bei jeder Art von Steuerung gilt (z. B. Bots, Nachlauf) */
  function later(room, g, ms, fn) {
    const key = g.key;
    room.after(T(ms), () => { if (g.key === key) fn(); });
  }

  /* ----- Rollen ansehen ----- */

  function startReveal(room, g) {
    setPhase(room, g, 'reveal');
    g.ready = {};
    for (const p of g.pl) if (p.bot) g.ready[p.id] = true;
    say(g, NAR.start(th(g)));
    timer(room, g, 35000, () => startNight(room, g));
    ev(room);
  }
  function maybeAllReady(room, g) {
    if (g.phase !== 'reveal' || !auto(g)) return;
    if (humans(g).every((p) => g.ready[p.id])) later(room, g, 900, () => startNight(room, g));
  }

  /* ----- Nacht ----- */

  const stepExists = (g, role) => {
    if (FIRST_ONLY.includes(role) && g.night > 1) return false;
    if (role === 'werwolf') return true;
    return g.pl.some((p) => p.role === role || p.was === role);
  };
  const actorsOf = (g, role) => g.pl.filter((p) => p.alive && wakesFor(role).includes(p.role));

  function startNight(room, g) {
    g.night++;
    g.nd = { protect: null, victims: [], infect: false, heal: false, poison: null, kill: null, pipe: [] };
    g.steps = NIGHT_ORDER.filter((r) => stepExists(g, r));
    g.stepIdx = -1;
    g.step = null;
    g.dawn = null;
    g.result = null;
    setPhase(room, g, 'night');
    say(g, NAR.night());
    timer(room, g, 4000, () => nextStep(room, g));
    ev(room);
  }
  function nextStep(room, g) {
    if (g.phase !== 'night') return;
    g.stepIdx++;
    if (g.stepIdx >= g.steps.length) return resolveNight(room, g);
    const role = g.steps[g.stepIdx];
    setPhase(room, g, 'night');
    const actors = actorsOf(g, role);
    g.step = { role, actors: actors.map((p) => p.id), picks: {}, done: {}, res: {}, closed: false };
    say(g, NAR.open(role, th(g)));
    for (const p of actors) if (p.bot) botNight(room, g, p);
    // Ist die Rolle schon tot (oder gibt es sie nicht mehr), läuft trotzdem eine ähnlich lange Wartezeit, damit niemand an der Dauer etwas erkennt
    timer(room, g, actors.length ? g.cfg.nightTime * 1000 : rnd(3500, 6500), () => leaveStep(room, g));
    ev(room);
  }
  function maybeStepDone(room, g) {
    const st = g.step;
    if (g.phase !== 'night' || !st || st.closed || !st.actors.length) return;
    if (!st.actors.every((id) => st.done[id] || !P(g, id).alive)) return;
    if (!auto(g)) return; // der Erzähler entscheidet, wann es weitergeht
    later(room, g, st.role === 'seher' ? 3800 : 1400, () => leaveStep(room, g));
  }

  /** Ergebnis des Schritts übernehmen, Schritt beenden */
  function leaveStep(room, g) {
    const st = g.step;
    if (g.phase !== 'night' || !st || st.closed) return;
    st.closed = true;
    applyStep(room, g, st);
    say(g, NAR.close(st.role, th(g)));
    ev(room);
    // kurze Pause, damit der Abschlusssatz gesprochen werden kann
    if (auto(g)) {
      const key = g.key;
      room.clearTimers();
      g.deadline = 0;
      g.total = 0;
      room.after(T(1500), () => { if (g.key === key) nextStep(room, g); });
    }
  }

  function applyStep(room, g, st) {
    const nd = g.nd;
    const picks = Object.values(st.picks);
    const aliveIds = alive(g).map((p) => p.id);
    switch (st.role) {
      case 'amor': {
        const a = P(g, st.actors[0]);
        let ids = (st.picks[st.actors[0]] || {}).ids || [];
        if (ids.length !== 2) ids = sample(aliveIds, 2); // wer nichts wählt, bekommt Zufallspartner
        const [x, y] = ids.map((id) => P(g, id));
        x.lover = y.id; y.lover = x.id;
        x.know.push(`💘 Du bist verliebt in ${y.name}. Stirbt eine von euch, stirbt auch die andere.`);
        y.know.push(`💘 Du bist verliebt in ${x.name}. Stirbt eine von euch, stirbt auch die andere.`);
        if (a && a !== x && a !== y) a.know.push(`💘 Du hast ${x.name} und ${y.name} verliebt gemacht.`);
        break;
      }
      case 'wildkind': {
        const k = P(g, st.actors[0]);
        let id = ((st.picks[st.actors[0]] || {}).ids || [])[0];
        if (!id || id === k.id) id = sample(aliveIds.filter((x) => x !== k.id), 1)[0];
        k.vorbild = id;
        k.know.push(`🧒 Dein Vorbild ist ${P(g, id).name}. Stirbt es, wirst du ${th(g).killer}.`);
        break;
      }
      case 'beschuetzer': {
        const id = ((picks[0] || {}).ids || [])[0] || null;
        nd.protect = id;
        g.lastProtect = id;
        break;
      }
      case 'seher': {
        for (const sid of st.actors) {
          const r = st.res[sid];
          if (!r) continue;
          const s = P(g, sid);
          s.know.push(`🔮 Nacht ${g.night}: ${r.text}`);
          if (s.mem) s.mem.seen[r.id] = r.wolf ? 'wolf' : 'safe';
        }
        break;
      }
      case 'werwolf': {
        const cnt = tally(picks.flatMap((p) => p.ids || []));
        const full = g.cfg.moon && g.night % 3 === 0;
        nd.victims = topOf(cnt, full ? 2 : 1);
        nd.infect = picks.some((p) => p.flag) && !g.urwolfUsed && nd.victims.length > 0;
        break;
      }
      case 'hexe': {
        const h = P(g, st.actors[0]);
        const pk = picks[0] || {};
        if (h && h.potions) {
          if (pk.heal && h.potions.heal && nd.victims.length) { nd.heal = true; h.potions.heal = false; }
          if (pk.poison && h.potions.poison && aliveIds.includes(pk.poison)) { nd.poison = pk.poison; h.potions.poison = false; }
        }
        break;
      }
      case 'serienmoerder': nd.kill = ((picks[0] || {}).ids || [])[0] || null; break;
      case 'floetenspieler': nd.pipe = ((picks[0] || {}).ids || []).filter((id) => aliveIds.includes(id)).slice(0, 2); break;
      default: break;
    }
  }

  /** Nacht auswerten: Opfer, Schutz, Heilung, Gift, Verzauberung, Verwandlung */
  function resolveNight(room, g) {
    const nd = g.nd;
    const dead = [];
    const out = [];
    const T0 = th(g);
    const calm = g.cfg.calmFirst && g.night === 1;
    let infected = null;
    if (!calm) {
      nd.victims.forEach((vid, i) => {
        const v = P(g, vid);
        if (!v || !v.alive) return;
        if (nd.protect === vid) return;
        if (v.role === 'aeltester' && !v.lifeUsed) { v.lifeUsed = true; return; }
        if (i === 0 && nd.heal) return;
        if (i === 0 && nd.infect && !g.urwolfUsed) { g.urwolfUsed = true; infected = v; return; }
        dead.push([vid, 'wolf']);
      });
    }
    if (nd.kill) { const k = P(g, nd.kill); if (k && k.alive && nd.protect !== nd.kill) dead.push([nd.kill, 'killer']); }
    if (nd.poison) dead.push([nd.poison, 'poison']);
    if (infected) {
      infected.was = infected.role;
      infected.role = 'werwolf';
      infected.know.push(`🐺 Du wurdest von den ${T0.kd} ${T0.recruit === 'anwerben' ? 'angeworben' : 'verwandelt'}: Du gehörst jetzt zu ihnen und wachst ab der nächsten Nacht mit ihnen auf.`);
    }
    for (const id of nd.pipe || []) {
      const p = P(g, id);
      if (p && p.alive) { p.enchanted = true; p.know.push('🎶 Du wurdest verzaubert. Der Flötenspieler hat dich in seinen Bann gezogen.'); }
    }
    const seen = new Set();
    for (const [id, cause] of dead) killPlayer(g, id, cause, out, seen);
    g.dawn = { night: g.night, dead: out };
    setPhase(room, g, 'dawn');
    if (!out.length) g.stale++; else g.stale = 0;
    say(g, NAR.dawn(out.map((d) => ({ name: P(g, d.id).name, role: P(g, d.id).role })), T0, g.cfg.reveal === 'role'));
    timer(room, g, 7000 + 1800 * out.length, () => proceed(room, g, 'day'));
    ev(room);
  }

  /** Spieler sterben lassen, mit Folgen: Liebespartner, Jäger, wildes Kind */
  function killPlayer(g, id, cause, out, seen) {
    const p = P(g, id);
    if (!p || !p.alive || seen.has(id)) return;
    seen.add(id);
    p.alive = false;
    p.cause = cause;
    p.diedAt = g.night + (g.phase === 'vote' || g.phase === 'result' ? 0.5 : 0);
    out.push({ id, cause });
    if (p.role === 'jaeger') g.shotQ.push(id);
    for (const q of g.pl) {
      if (q.alive && q.role === 'wildkind' && q.vorbild === id) {
        q.was = 'wildkind';
        q.role = 'werwolf';
        q.know.push(`🐺 Dein Vorbild ${p.name} ist gestorben: Du bist jetzt ${th(g).killer} und wachst ab der nächsten Nacht mit den anderen auf.`);
      }
    }
    if (p.lover) { const l = P(g, p.lover); if (l && l.alive) killPlayer(g, l.id, 'love', out, seen); }
  }

  /** Nach Tod und Abstimmung: erst Schüsse, dann Siegprüfung, dann weiter */
  function proceed(room, g, then) {
    if (g.shotQ.length) return startShot(room, g, then);
    if (g.jesterWin) return endGame(room, g, { team: 'jester' });
    const w = winCheck(g.pl);
    if (w) return endGame(room, g, w);
    if (g.night >= MAX_NIGHTS) return endGame(room, g, { team: 'none' });
    if (then === 'day') startDay(room, g); else startNight(room, g);
  }

  function startShot(room, g, then) {
    const hid = g.shotQ.shift();
    setPhase(room, g, 'shot');
    g.shot = { hunter: hid, then, target: null, over: false };
    say(g, NAR.shot(P(g, hid).name));
    const hp = P(g, hid);
    if (hp.bot) later(room, g, rnd(1500, 3500), () => shoot(room, g, hid, sample(alive(g).filter((p) => p.id !== hid).map((p) => p.id), 1)[0]));
    else if (!room.players.some((x) => x.id === hid && x.connected)) later(room, g, 800, () => endShot(room, g)); // ohne Verbindung kein Schuss
    timer(room, g, 25000, () => endShot(room, g));
    ev(room);
  }
  function shoot(room, g, pid, target) {
    if (g.phase !== 'shot' || g.shot.over || g.shot.hunter !== pid) return;
    const t = P(g, target);
    if (!t || !t.alive || t.id === pid) return;
    g.shot.over = true;
    g.shot.target = t.id;
    const out = [];
    killPlayer(g, t.id, 'shot', out, new Set());
    g.shot.dead = out;
    g.stale = 0;
    say(g, `${P(g, pid).name} schießt auf ${t.name}${g.cfg.reveal === 'role' ? `, ${withArt(t.role, g.cfg.theme)}` : ''}. ${out.length > 1 ? 'Dadurch stirbt noch jemand.' : ''}`.trim());
    room.clearTimers();
    g.deadline = 0;
    g.total = 0;
    if (auto(g)) later(room, g, 4200, () => proceed(room, g, g.shot.then));
    ev(room);
  }
  function endShot(room, g) {
    if (g.phase !== 'shot') return;
    g.shot.over = true;
    proceed(room, g, g.shot.then);
  }

  /* ----- Tag und Abstimmung ----- */

  function startDay(room, g) {
    setPhase(room, g, 'day');
    g.day = g.night;
    g.tovote = {};
    say(g, NAR.day(th(g)));
    timer(room, g, g.cfg.dayTime * 1000, () => startVote(room, g));
    // Bots wollen irgendwann abstimmen
    const base = g.cfg.dayTime ? g.cfg.dayTime * 1000 : 45000;
    for (const p of alive(g)) if (p.bot) later(room, g, base * rnd(0.3, 0.9), () => { g.tovote[p.id] = true; maybeStartVote(room, g); });
    ev(room);
  }
  function maybeStartVote(room, g) {
    if (g.phase !== 'day') return;
    const al = alive(g);
    const n = al.filter((p) => g.tovote[p.id]).length;
    if (n * 2 > al.length) startVote(room, g);
    else ev(room);
  }
  function startVote(room, g) {
    if (g.phase !== 'day') return;
    setPhase(room, g, 'vote');
    g.votes = {};
    say(g, NAR.vote(th(g)));
    timer(room, g, g.cfg.voteTime * 1000, () => endVote(room, g));
    for (const p of voters(g)) if (p.bot) later(room, g, g.cfg.voteTime * 1000 * rnd(0.15, 0.7), () => { if (!(p.id in g.votes)) { g.votes[p.id] = botVote(g, p); maybeVoteDone(room, g); } });
    ev(room);
  }
  const voters = (g) => alive(g).filter((p) => !p.noVote);
  function maybeVoteDone(room, g) {
    if (g.phase !== 'vote') return;
    if (auto(g) && voters(g).every((p) => p.id in g.votes || (!p.bot && !room.players.find((x) => x.id === p.id && x.connected)))) later(room, g, 1200, () => endVote(room, g));
    else ev(room);
  }

  function endVote(room, g) {
    if (g.phase !== 'vote') return;
    const counts = {};
    for (const p of voters(g)) {
      const t = g.votes[p.id];
      const tp = t && P(g, t);
      if (!tp || !tp.alive || tp.id === p.id) continue;
      counts[tp.id] = (counts[tp.id] || 0) + (p.role === 'buergermeister' ? 2 : 1);
    }
    const max = Math.max(0, ...Object.values(counts));
    let tied = Object.keys(counts).filter((id) => counts[id] === max);
    let victim = null;
    if (max > 0) {
      if (tied.length === 1) victim = tied[0];
      else if (g.cfg.tie === 'random' || g.stale >= 3) victim = shuffle(tied)[0];
    }
    if (!victim && g.stale >= 3 && !Object.keys(counts).length) victim = shuffle(alive(g))[0].id; // Notbremse gegen endlose Runden ohne Tote
    const r = { kind: 'none', victim: null, counts, tied: tied.length > 1 ? tied : [], votes: Object.assign({}, g.votes), name: '', role: null };
    const out = [];
    if (victim) {
      const v = P(g, victim);
      r.victim = victim; r.name = v.name; r.role = v.role; r.kind = 'lynch';
      if (v.role === 'idiot' && !v.revealed) { v.revealed = true; v.noVote = true; r.kind = 'idiot'; }
      else {
        if (v.role === 'gaukler') { g.jesterWin = true; r.kind = 'jester'; }
        killPlayer(g, victim, 'lynch', out, new Set());
      }
    }
    r.dead = out;
    g.result = r;
    g.stale = victim ? 0 : g.stale + 1;
    setPhase(room, g, 'result');
    say(g, NAR.result(r, th(g), g.cfg.reveal === 'role' || r.kind === 'idiot'));
    timer(room, g, 6500 + (out.length > 1 ? 1500 : 0), () => proceed(room, g, 'night'));
    ev(room);
  }

  function endGame(room, g, w) {
    setPhase(room, g, 'end');
    const ids = g.pl.filter((p) => {
      if (w.team === 'love') return p.lover && (g.pl.find((q) => q.id === p.lover) || {}).lover === p.id && p.alive;
      if (w.team === 'none') return false;
      return teamOf(p) === w.team;
    }).map((p) => p.id);
    g.win = { team: w.team, ids };
    say(g, NAR.end(w, th(g)));
    ev(room);
  }

  /* ---------- Bots ---------- */

  function botNight(room, g, p) {
    const st = g.step;
    const key = g.key;
    const delay = Math.min(g.cfg.nightTime * 1000 * 0.5, 9000) * rnd(0.25, 1);
    room.after(T(delay), () => {
      if (g.key !== key || g.phase !== 'night' || !g.step || g.step.closed || g.step.done[p.id]) return;
      const al = alive(g);
      const others = al.filter((q) => q.id !== p.id);
      const pk = {};
      switch (st.role) {
        case 'amor': pk.ids = sample(al.map((q) => q.id), 2); break;
        case 'wildkind': pk.ids = sample(others.map((q) => q.id), 1); break;
        case 'beschuetzer': pk.ids = sample(al.filter((q) => q.id !== g.lastProtect).map((q) => q.id), 1); break;
        case 'seher': { const unknown = others.filter((q) => !p.mem.seen[q.id]); pk.ids = sample((unknown.length ? unknown : others).map((q) => q.id), 1); break; }
        case 'werwolf': {
          const mates = al.filter((q) => ROLES[q.role].side === 'wolf' && q.role !== 'verraeter').map((q) => q.id);
          const pool = al.filter((q) => !mates.includes(q.id)).map((q) => q.id);
          const wanted = tally(Object.values(st.picks).flatMap((x) => x.ids || []));
          const lead = topOf(wanted, 1)[0];
          const k = g.cfg.moon && g.night % 3 === 0 ? 2 : 1;
          pk.ids = lead && pool.includes(lead) && Math.random() < 0.75 ? [lead].concat(sample(pool.filter((x) => x !== lead), k - 1)) : sample(pool, k);
          pk.flag = p.role === 'urwolf' && !g.urwolfUsed && Math.random() < 0.4;
          break;
        }
        case 'hexe': {
          pk.heal = !!(p.potions.heal && g.nd.victims.length && Math.random() < 0.55);
          const known = Object.keys(p.mem.seen).filter((id) => p.mem.seen[id] === 'wolf' && P(g, id).alive);
          if (p.potions.poison && (known.length || (g.night >= 2 && Math.random() < 0.18))) pk.poison = known[0] || sample(others.map((q) => q.id), 1)[0];
          break;
        }
        case 'serienmoerder': pk.ids = sample(others.map((q) => q.id), 1); break;
        case 'floetenspieler': pk.ids = sample(others.filter((q) => !q.enchanted).map((q) => q.id), 2); break;
        default: break;
      }
      submitNight(room, g, p, pk);
    });
  }
  function botVote(g, p) {
    const al = alive(g).filter((q) => q.id !== p.id);
    if (!al.length) return null;
    const wolf = ROLES[p.role].side === 'wolf';
    let pool = al;
    if (wolf) pool = al.filter((q) => !(ROLES[q.role].side === 'wolf' && q.role !== 'verraeter'));
    const known = p.mem && al.filter((q) => p.mem.seen[q.id] === 'wolf');
    if (known && known.length) return known[0].id;
    if (p.lover) pool = pool.filter((q) => q.id !== p.lover);
    if (!pool.length) pool = al;
    return Math.random() < 0.08 ? null : shuffle(pool)[0].id;
  }

  /* ---------- Eingaben ---------- */

  /** Nachtaktion einer Person annehmen und prüfen */
  function submitNight(room, g, p, raw) {
    const st = g.step;
    if (g.phase !== 'night' || !st || st.closed || !st.actors.includes(p.id) || !p.alive) return;
    const L = th(g);
    const al = alive(g);
    const okId = (id, f) => typeof id === 'string' && al.some((q) => q.id === id && (!f || f(q)));
    let ids = Array.isArray(raw.ids) ? raw.ids.filter((x, i, a) => typeof x === 'string' && a.indexOf(x) === i).slice(0, 2) : [];
    const pk = {};
    switch (st.role) {
      case 'amor': ids = ids.filter((id) => okId(id)); if (ids.length !== 2) return; pk.ids = ids; break;
      case 'floetenspieler': ids = ids.filter((id) => okId(id, (q) => q.id !== p.id && !q.enchanted)); if (ids.length < 1) return; pk.ids = ids.slice(0, 2); break;
      case 'wildkind': ids = ids.filter((id) => okId(id, (q) => q.id !== p.id)); if (ids.length < 1) return; pk.ids = [ids[0]]; break;
      case 'beschuetzer': ids = ids.filter((id) => okId(id, (q) => q.id !== g.lastProtect)); pk.ids = ids.slice(0, 1); break; // leer = niemanden
      case 'serienmoerder': ids = ids.filter((id) => okId(id, (q) => q.id !== p.id)); pk.ids = ids.slice(0, 1); break;
      case 'seher': {
        ids = ids.filter((id) => okId(id, (q) => q.id !== p.id));
        if (ids.length < 1) return;
        pk.ids = [ids[0]];
        const t = P(g, ids[0]);
        const wolf = t.role === 'werwolf' || t.role === 'urwolf';
        const roleTxt = `${roleEmoji(t.role, g.cfg.theme)} ${roleName(t.role, g.cfg.theme)}`;
        st.res[p.id] = { id: t.id, wolf, text: g.cfg.seer === 'role' ? `${t.name} ist ${withArt(t.role, g.cfg.theme)} (${roleTxt}).` : wolf ? `${t.name} gehört zu den ${L.kd}.` : `${t.name} gehört nicht zu den ${L.kd}.`, role: t.role };
        break;
      }
      case 'werwolf': {
        const mates = g.pl.filter((q) => ROLES[q.role].side === 'wolf' && q.role !== 'verraeter').map((q) => q.id);
        const k = g.cfg.moon && g.night % 3 === 0 ? 2 : 1;
        ids = ids.filter((id) => okId(id, (q) => !mates.includes(q.id))).slice(0, k);
        if (!ids.length) return;
        pk.ids = ids;
        pk.flag = p.role === 'urwolf' && !!raw.flag && !g.urwolfUsed;
        break;
      }
      case 'hexe': {
        pk.heal = !!raw.heal && !!(p.potions && p.potions.heal) && g.nd.victims.length > 0;
        const pz = typeof raw.poison === 'string' && okId(raw.poison, (q) => q.id !== p.id) ? raw.poison : null;
        pk.poison = p.potions && p.potions.poison ? pz : null;
        break;
      }
      default: return;
    }
    st.picks[p.id] = pk;
    st.done[p.id] = true;
    ev(room);
    maybeStepDone(room, g);
  }

  /* ---------- Spiel ---------- */

  const groupSize = (room) => {
    const c = room.settings.wolf;
    const nar = c.narr === 'player' ? room.players.find((p) => p.id === c.narrator && p.connected && !p.bot) : null;
    return room.players.filter((p) => p.connected && (!nar || p.id !== nar.id)).length;
  };

  GAMES.wolf = {
    id: 'wolf',
    name: 'Werwolf',
    emoji: '🐺',
    order: 4.5,
    ready: true,
    teams: false,
    blurb: 'Das Dorf gegen die Werwölfe: Nachts wird gejagt, tagsüber wird abgestimmt. Mit vielen Rollen, Erzähler und Stärke-Grenzen.',
    setSetting(room, key, val) {
      const c = room.settings.wolf;
      if (key === 'theme' && THEMES[val] && Object.prototype.hasOwnProperty.call(THEMES, val)) c.theme = val;
      if (key === 'narr' && NARR.some((x) => x[0] === val)) {
        c.narr = val;
        if (val === 'player' && !room.players.some((p) => p.id === c.narrator && !p.bot)) c.narrator = room.hostId;
      }
      if (key === 'narrator' && typeof val === 'string' && room.players.some((p) => p.id === val && !p.bot)) c.narrator = val;
      if (key === 'mode' && MODES.some((x) => x[0] === val)) c.mode = val;
      if (key === 'role' && val && typeof val === 'object' && typeof val.id === 'string' && Object.prototype.hasOwnProperty.call(ROLES, val.id) && SPECIAL_IDS.includes(val.id)) {
        const n = Math.max(0, Math.min(ROLES[val.id].max, Number.isInteger(val.n) ? val.n : 0));
        const next = Object.assign({}, c.roles);
        if (n > 0) next[val.id] = n; else delete next[val.id];
        if (n < ((c.roles[val.id]) | 0) || check(next, c.wolves, groupSize(room)).ok) c.roles = next; // weniger geht immer, mehr nur innerhalb der Grenzen
      }
      if (key === 'clearRoles') c.roles = {};
      if (key === 'wolves' && Number.isInteger(val) && val >= 0 && val <= 4) {
        const n = groupSize(room);
        if (val === 0 || val <= limits(n).maxWolves) c.wolves = val;
      }
      if (key === 'reveal' && (val === 'role' || val === 'none')) c.reveal = val;
      if (key === 'seer' && (val === 'team' || val === 'role')) c.seer = val;
      if (key === 'tie' && (val === 'none' || val === 'random')) c.tie = val;
      if (key === 'nightTime' && NIGHT_TIMES.includes(val)) c.nightTime = val;
      if (key === 'dayTime' && DAY_TIMES.includes(val)) c.dayTime = val;
      if (key === 'voteTime' && VOTE_TIMES.includes(val)) c.voteTime = val;
      for (const b of ['roleList', 'voteOpen', 'moon', 'calmFirst', 'deadSee']) if (key === b && typeof val === 'boolean') c[b] = val;
    },
    canStart(room) {
      const c = room.settings.wolf;
      if (c.narr === 'player' && !room.players.some((p) => p.id === c.narrator && p.connected && !p.bot)) return 'Wähle eine Person als Erzähler (sie spielt nicht mit).';
      const n = groupSize(room);
      if (n < 4) return `Du brauchst mindestens 4 Mitspielende${c.narr === 'player' ? ' (ohne Erzähler)' : ''}. Bots zählen mit.`;
      if (c.mode === 'custom') { const r = check(c.roles, c.wolves, n, { villager: true }); if (!r.ok) return r.problems[0]; }
      return null;
    },
    init(room) {
      const cfg = JSON.parse(JSON.stringify(room.settings.wolf));
      const nar = cfg.narr === 'player' ? room.players.find((p) => p.id === cfg.narrator && p.connected && !p.bot) : null;
      const ps = room.players.filter((p) => p.connected && (!nar || p.id !== nar.id));
      const n = ps.length;
      const comp = compose(cfg, n, Math.random);
      const list = shuffle(expand(comp.counts));
      const pl = ps.map((p, i) => ({
        id: p.id, name: p.name, color: p.color, bot: !!p.bot, role: list[i], was: null, alive: true, lover: null, enchanted: false, vorbild: null,
        know: [], cause: null, diedAt: null, lifeUsed: false, revealed: false, noVote: false, mem: { seen: {} },
        potions: list[i] === 'hexe' ? { heal: true, poison: true } : null,
      }));
      return {
        cfg, pl, n, gid: PG.rid(4), narrator: nar ? nar.id : null, narratorName: nar ? nar.name : null, comp: comp.counts,
        phase: 'reveal', key: 0, night: 0, day: 0, steps: [], stepIdx: -1, step: null, nd: null, dawn: null, result: null, shot: null,
        ready: {}, tovote: {}, votes: {}, shotQ: [], lastProtect: null, urwolfUsed: false, jesterWin: false, stale: 0, say: null, win: null,
        deadline: 0, total: 0,
      };
    },
    begin(room) { startReveal(room, room.game); },
    act(room, pid, msg) {

'use strict';
/* App: Start, Lobby, Verbindungen und der Rahmen um die einzelnen Spiele. */
(function () {
  const { h, TEAMS, UI, TEST } = PG;

  const ss = {
    get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { /* egal */ } },
    del(k) { try { sessionStorage.removeItem(k); } catch (e) { /* egal */ } },
  };
  const ls = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* egal */ } },
  };
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  const app = {
    mode: 'home', // home | connecting | reconnect | room
    role: null, // host | client
    pid: ss.get('pg.pid') || PG.rid(12),
    sec: ss.get('pg.sec') || PG.rid(32), // geheimer Schlüssel: beweist bei Wiederanmeldung, dass man dieselbe Person ist
    name: '',
    code: '',
    draft: { name: ls.get('pg.name') || '', code: '' },
    room: null,
    hostLink: null,
    client: null,
    view: null,
    err: '',
    statusText: '',
    reconnecting: false,
  };
  ss.set('pg.pid', app.pid);
  ss.set('pg.sec', app.sec);
  if (TEST) window.__pg = { app };

  /* ---------- Profilfotos ---------- */

  /** Foto-Nachricht vom Host (oder lokal beim Host selbst) übernehmen */
  function gotPhoto(m) {
    if (!m || typeof m.pid !== 'string') return;
    const d = m.d == null ? null : (PG.Profile.sanitize({ ph: m.d }).ph);
    if (m.d != null && !d) return;
    if (d) { PG.photos[m.pid] = d; PG.photoV[m.pid] = m.v | 0; } else { delete PG.photos[m.pid]; delete PG.photoV[m.pid]; }
    render();
  }
  PG.photoV = {};
  const photoAsked = {};
  /** Fehlende Fotos beim Host nachfragen (nur ein Mal je Foto-Version) */
  function syncPhotos() {
    if (!app.view) return;
    for (const p of app.view.players) {
      if (!p.ph) continue; // Entfernen kommt als eigene Nachricht (ph mit d: null)
      if (PG.photoV[p.id] === p.ph || photoAsked[p.id] === p.ph) continue;
      photoAsked[p.id] = p.ph;
      if (app.role === 'client' && app.client) app.client.send({ t: 'needphoto', pid: p.id });
    }
  }
  /** Eigene Profiländerung an den Raum melden (im Host direkt, sonst per Nachricht) */
  function profileChanged(d) {
    if (!app.view) return;
    send({ t: 'prof', e: d.e, fx: d.fx, fr: d.fr });
    if (d.ph !== app.sentPh) { app.sentPh = d.ph; send({ t: 'photo', d: d.ph }); }
  }
  const dispatchRaw = (m) => { const f = PG.rawHandlers && Object.prototype.hasOwnProperty.call(PG.rawHandlers, m.t) ? PG.rawHandlers[m.t] : null; if (f) f(m); };
  const localRaw = (msg) => { if (msg.t === 'ph') gotPhoto(msg); else dispatchRaw(msg); };

  /* ---------- Senden ---------- */

  function send(msg) {
    if (app.role === 'host' && app.room) app.room.handle(app.pid, msg);
    else if (app.client) app.client.send(msg);
  }

  /* ---------- Host ---------- */

  function flush(room) {
    if (app.hostLink) {
      for (const p of room.players) {
        if (p.id === app.pid || !p.connected || p.bot) continue;
        app.hostLink.send(p.id, { t: 'view', v: room.view(p.id) });
      }
    }
    app.view = room.view(app.pid);
    render();
  }

  function hostMessage(conn, m) {
    const room = app.room;
    if (!room) return;
    if (m.t === 'hello') {
      const pid = String(m.pid || '');
      const sec = String(m.sec || '');
      const refuse = (reason) => {
        try { conn.send(JSON.stringify({ t: 'refused', reason })); } catch (e) { /* egal */ }
        setTimeout(() => { try { conn.close(); } catch (e) { /* egal */ } }, 300);
      };
      if (!/^[a-z0-9]{8,40}$/.test(pid) || !/^[a-z0-9]{16,64}$/.test(sec)) return refuse('Ungültige Anmeldung.');
      // Eine Verbindung darf nur eine einzige Person sein (sonst könnte man mit neuen Kennungen Plätze blockieren)
      if (conn._pid && conn._pid !== pid) return refuse('Diese Verbindung gehört schon zu einer anderen Person.');
      const known = room.players.some((p) => p.id === pid);
      if (!known) {
        const now = Date.now();
        app.joinLog = (app.joinLog || []).filter((t) => now - t < 10000);
        if (app.joinLog.length >= 6) return refuse('Zu viele Beitritte auf einmal. Versuche es gleich noch einmal.');
        app.joinLog.push(now);
      }
      const r = room.addPlayer(pid, m.name, sec, true, m.prof);
      if (!r.ok) return refuse(r.reason);
      const old = app.hostLink.conns.get(pid);
      if (old && old !== conn) { old._pid = null; try { old.close(); } catch (e) { /* egal */ } }
      app.hostLink.conns.set(pid, conn);
      conn._pid = pid;
      room.changed();
      return;
    }
    const pid = conn._pid;
    if (!pid) return;
    if (m.t === 'leave') {
      conn._pid = null;
      app.hostLink.conns.delete(pid);
      try { conn.close(); } catch (e) { /* egal */ }
      if (!room.gameId) room.removePlayer(pid); else room.playerGone(pid);
      return;
    }
    room.handle(pid, m);
  }

  function hostGone(conn) {
    const pid = conn._pid;
    if (!pid || !app.room || app.hostLink.conns.get(pid) !== conn) return;
    app.hostLink.conns.delete(pid);
    app.room.playerGone(pid);
  }

  async function createRoom() {
    const name = (app.draft.name || '').trim();
    if (!name) return setErr('Gib zuerst deinen Namen ein.');
    ls.set('pg.name', name);
    app.err = '';
    app.mode = 'connecting';
    app.statusText = 'Raum wird erstellt …';
    render();
    try { await PG.Net.loadPeer(); } catch (e) { return backHome('Die Verbindungsbibliothek (PeerJS) konnte nicht geladen werden. Prüfe deine Internetverbindung.'); }
    const link = new PG.Net.HostLink({
      onMessage: hostMessage,
      onGone: hostGone,
      onPeerError: (e) => console.warn('peer', e),
    });
    let code;
    try { code = await link.start(); } catch (e) { return backHome('Der Vermittlungsserver ist gerade nicht erreichbar. Versuche es später noch einmal.'); }
    PG.loadQuestions().catch((e) => console.warn('Fragenpool', e)); // nur der Host braucht ihn
    app.role = 'host';
    app.name = name;
    app.code = code;
    app.hostLink = link;
    const room = new PG.Room(code, app.pid, name, PG.Profile.forSend());
    room.sink = flush;
    // Direktnachrichten (z. B. Zeichenstriche): kein Neuaufbau der Oberfläche
    room.raw = (msg, except) => {
      for (const p of room.players) {
        if (p.id === except || !p.connected || p.bot) continue;
        if (p.id === app.pid) localRaw(msg); else if (app.hostLink) app.hostLink.send(p.id, msg);
      }
    };
    room.rawTo = (pid, msg) => { if (pid === app.pid) localRaw(msg); else if (app.hostLink) app.hostLink.send(pid, msg); };
    room.onKick = (pid) => { link.send(pid, { t: 'kicked' }); setTimeout(() => link.drop(pid), 200); };
    app.room = room;
    app.mode = 'room';
    app.view = room.view(app.pid);
    app.sentPh = null;
    if (PG.Profile.data.ph) { app.sentPh = PG.Profile.data.ph; room.handle(app.pid, { t: 'photo', d: app.sentPh }); }
    render();
    acquireWake();
  }

  /** Alleine gegen Bots: kein Netzwerk, kein Raumcode. Der Raum lebt nur in diesem Browser. */
  async function startSolo() {
    const name = (app.draft.name || '').trim();
    if (!name) return setErr('Gib zuerst deinen Namen ein.');
    ls.set('pg.name', name);
    app.err = '';
    PG.loadQuestions().catch((e) => console.warn('Fragenpool', e));
    app.role = 'host';
    app.solo = true;
    app.name = name;
    app.code = 'SOLO';
    app.hostLink = null;
    const room = new PG.Room('SOLO', app.pid, name, PG.Profile.forSend());
    room.sink = flush;
    room.raw = (msg, except) => { if (except !== app.pid) localRaw(msg); };
    room.rawTo = (pid, msg) => { if (pid === app.pid) localRaw(msg); };
    room.addBot('mid');
    room.addBot('mid');
    app.room = room;
    app.mode = 'room';
    app.sentPh = null;
    if (PG.Profile.data.ph) { app.sentPh = PG.Profile.data.ph; room.handle(app.pid, { t: 'photo', d: app.sentPh }); }
    app.view = room.view(app.pid);
    render();
    acquireWake();
  }

  /* ---------- Client ---------- */

  function clientMessage(m) {
    if (m.t === 'view') { app.view = m.v; app.mode = 'room'; render(); } else if (m.t === 'refused') backHome(m.reason || 'Beitritt nicht möglich.');
    else if (m.t === 'ph') gotPhoto(m); else if (m.t === 'kicked') backHome('Der Host hat dich aus dem Raum entfernt.');
    else if (m.t === 'closed') backHome('Der Host hat den Raum geschlossen.');
    else dispatchRaw(m);
  }

  function clientClosed() {
    if (app.role === 'client' && app.mode === 'room') reconnect();
  }

  async function connectClient(code, name, isRetry) {
    const link = new PG.Net.ClientLink({ onMessage: clientMessage, onClose: clientClosed, onError: (e) => console.warn('peer', e) });
    try { await link.connect(code); } catch (e) {
      link.close();
      if (isRetry) throw e;
      const msg = e && e.type === 'peer-unavailable' ? 'Diesen Raum gibt es nicht. Prüfe den Code.'
        : e && e.type === 'timeout' ? 'Keine Verbindung zum Raum. Prüfe den Code und dein Netzwerk.'
          : 'Die Verbindung hat nicht geklappt. Versuche es noch einmal.';
      return backHome(msg);
    }
    app.client = link;
    app.role = 'client';
    app.code = code;
    app.name = name;
    ss.set('pg.sess', JSON.stringify({ code, name }));
    const prof = PG.Profile.forSend();
    link.send({ t: 'hello', pid: app.pid, sec: app.sec, name, prof: { e: prof.e, fx: prof.fx, fr: prof.fr } });
    app.sentPh = prof.ph;
    if (prof.ph) link.send({ t: 'photo', d: prof.ph });
    app.mode = 'room';
    render();
    acquireWake();
  }

  async function joinRoom() {
    const name = (app.draft.name || '').trim();
    const code = (app.draft.code || '').toUpperCase().replace(/[^A-Z]/g, '');
    if (!name) return setErr('Gib zuerst deinen Namen ein.');
    if (code.length !== PG.Net.CODE_LEN) return setErr('Der Raumcode hat ' + PG.Net.CODE_LEN + ' Buchstaben.');
    ls.set('pg.name', name);
    app.err = '';
    app.mode = 'connecting';
    app.statusText = 'Verbinde mit Raum ' + code + ' …';
    render();
    try { await PG.Net.loadPeer(); } catch (e) { return backHome('Die Verbindungsbibliothek (PeerJS) konnte nicht geladen werden. Prüfe deine Internetverbindung.'); }
    await connectClient(code, name, false);
  }

  async function reconnect() {
    if (app.reconnecting) return;
    app.reconnecting = true;
    app.mode = 'reconnect';
    render();
    try { await PG.Net.loadPeer(); } catch (e) { app.reconnecting = false; return backHome('Die Verbindung ist abgebrochen.'); }
    for (let i = 0; i < 6; i++) {
      await sleep(2500);
      try { await connectClient(app.code, app.name, true); app.reconnecting = false; return; } catch (e) { /* weiter versuchen */ }
    }
    app.reconnecting = false;
    backHome('Die Verbindung zum Raum ist abgebrochen.');
  }

  /* ---------- Beenden ---------- */

  function teardown() {
    if (app.hostLink) { app.hostLink.close(); app.hostLink = null; }
    if (app.room) { app.room.clearTimers(); app.room.sink = null; app.room = null; }
    if (app.client) { app.client.close(); app.client = null; }
    app.role = null;
    app.solo = false;
    app.view = null;
    ss.del('pg.sess');
    releaseWake();
  }

  function backHome(msg) {
    teardown();
    app.mode = 'home';
    app.err = msg || '';
    app.reconnecting = false;
    render();
  }

  function leave() {
    if (app.solo) { backHome(''); return; }
    if (app.role === 'host') {
      if (!confirm('Den Raum für alle schließen?')) return;
      for (const p of app.room.players) if (p.id !== app.pid && !p.bot) app.hostLink.send(p.id, { t: 'closed' });
      setTimeout(() => backHome(''), 250);
    } else {
      if (app.client) app.client.send({ t: 'leave' });
      setTimeout(() => backHome(''), 150);
    }
  }

  function setErr(msg) { app.err = msg; render(); }

  /* ---------- Bildschirm wach halten (wichtig für den Host) ---------- */

  let wake = null;
  async function acquireWake() {
    try {
      if ('wakeLock' in navigator && !wake && document.visibilityState === 'visible') {
        wake = await navigator.wakeLock.request('screen');
        wake.addEventListener('release', () => { wake = null; });
      }
    } catch (e) { /* nicht verfügbar */ }
  }
  function releaseWake() { try { if (wake) wake.release(); } catch (e) { /* egal */ } wake = null; }
  document.addEventListener('visibilitychange', () => { if (app.mode === 'room') acquireWake(); });
  addEventListener('beforeunload', (e) => { if (app.role === 'host' && app.mode === 'room' && !app.solo) { e.preventDefault(); e.returnValue = ''; } });

  /* ---------- Oberfläche ---------- */

  function toast(text) {
    const t = h('div', { class: 'toast', role: 'status' }, text);
    document.body.append(t);
    setTimeout(() => t.remove(), 2200);
  }

  function copyLink() {
    const url = location.origin + location.pathname + '?raum=' + app.code;
    const done = () => toast('Link kopiert');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, () => prompt('Link zum Kopieren:', url));
    else prompt('Link zum Kopieren:', url);
  }

  function homeScreen() {
    const go = (e) => { if (e.key === 'Enter') (app.draft.code ? joinRoom : createRoom)(); };
    return h('div', { class: 'home' },
      h('h1', { class: 'brand' }, 'Spielstube'),
      h('p', { class: 'lead' }, 'Partyspiele für eure Handys. Einer erstellt einen Raum, alle anderen treten mit dem Code bei.'),
      app.err ? h('div', { class: 'err', role: 'alert' }, app.err) : null,
      h('label', { class: 'field' }, h('span', null, 'Dein Name'),
        h('input', { class: 'input', maxlength: 14, autocomplete: 'nickname', value: app.draft.name, oninput: (e) => { app.draft.name = e.target.value; }, onkeydown: go })),
      h('button', { class: 'btn block', onclick: createRoom }, 'Raum erstellen'),
      h('p', { class: 'or' }, 'oder'),
      h('label', { class: 'field' }, h('span', null, 'Raumcode'),
        h('input', {
          class: 'input code', maxlength: PG.Net.CODE_LEN, autocomplete: 'off', autocapitalize: 'characters', spellcheck: 'false', placeholder: 'ABCDE', value: app.draft.code,
          oninput: (e) => { const v = e.target.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, PG.Net.CODE_LEN); e.target.value = v; app.draft.code = v; },
          onkeydown: go,
        })),
      h('button', { class: 'btn alt block', onclick: joinRoom }, 'Beitreten'),
      h('p', { class: 'or' }, 'oder'),
      h('button', { class: 'btn alt block', onclick: startSolo }, '🤖 Alleine gegen Bots'),
      h('div', { class: 'homebtns' },
        h('button', { class: 'btn small alt', onclick: () => { app.helpOpen = true; render(); } }, '📖 Spielerklärungen'),
        h('button', { class: 'btn small alt', onclick: () => { app.settingsOpen = true; render(); } }, '⚙️ Einstellungen'),
        h('button', { class: 'btn small alt profbtn', onclick: () => { app.profileOpen = true; render(); } }, PG.avatarEl({ id: '_me', name: app.draft.name || '?', color: '#FFC83D', e: PG.Profile.data.e, fr: PG.Profile.data.fr, photoUrl: PG.Profile.data.ph }), ' Profil'),
        PG.fullscreenButton(),
        PG.soundButton()),
      h('p', { class: 'foot' }, 'Der Host muss die Seite während des Spiels offen lassen. Alle brauchen eine Internetverbindung.'));
  }

  function statusScreen(emoji, title, text, action) {
    return h('div', { class: 'status' }, h('div', { class: 'bigemoji', 'aria-hidden': 'true' }, emoji), h('h2', null, title), text ? h('p', { class: 'hint', style: { marginTop: '10px' } }, text) : null, action ? h('div', { style: { marginTop: '20px' } }, action) : null);
  }

  function topbar(v, inGame) {
    const isHost = v.me === v.host;
    return h('div', { class: 'topbar' },
      h('span', { class: 'mini', 'aria-label': app.solo ? 'Solo-Modus' : 'Raumcode ' + v.code }, app.solo ? 'SOLO' : v.code),
      h('div', { class: 'row tbtns' },
        PG.fullscreenButton(),
        PG.soundButton(),
        inGame && isHost ? h('button', { class: 'btn small alt', onclick: () => { if (confirm('Das Spiel beenden und zurück zur Lobby?')) send({ t: 'lobby' }); } }, 'Zur Lobby') : null,
        h('button', { class: 'btn small alt', onclick: leave }, app.solo ? 'Beenden' : isHost ? 'Raum schließen' : 'Verlassen')));
  }

  function lobbyScreen() {
    const v = app.view;
    const isHost = v.me === v.host;
    const sel = v.games.find((g) => g.id === v.selected);
    const needTeams = !!(sel && sel.teams);

    return h('div', { class: 'lobby' },
      topbar(v, false),
      app.solo ? h('div', { class: 'card' }, h('p', null, h('b', null, 'Solo-Modus')), h('p', { class: 'hint', style: { marginTop: '6px' } }, 'Du spielst allein gegen Bots. Es wird keine Internetverbindung gebraucht. Wähle unten, wie viele Bots und wie stark.')) :
      h('div', { class: 'card' },
        h('div', { class: 'codeline' },
          h('div', null, h('p', { class: 'hint' }, 'Raumcode'), h('div', { class: 'tiles', role: 'img', 'aria-label': 'Raumcode ' + v.code.split('').join(' ') }, v.code.split('').map((c) => h('span', null, c)))),
          h('button', { class: 'btn small alt', onclick: copyLink }, 'Link kopieren')),
        h('p', { class: 'hint', style: { marginTop: '12px' } }, 'Die anderen öffnen diese Seite und geben den Code ein.'),
        isHost ? h('button', { class: 'btn small alt', style: { marginTop: '10px' }, 'aria-pressed': String(!!v.locked), onclick: () => send({ t: 'lock', on: !v.locked }) }, v.locked ? '🔒 Raum gesperrt (antippen zum Öffnen)' : '🔓 Raum sperren, wenn alle da sind') : (v.locked ? h('p', { class: 'hint small', style: { marginTop: '8px' } }, '🔒 Der Raum ist gesperrt.') : null)),

      h('h2', { class: 'section-title' }, 'Spieler (' + v.players.length + ')', ' ', h('button', { class: 'btn small alt', style: { marginLeft: '8px' }, onclick: () => { app.profileOpen = true; render(); } }, '🎨 Mein Profil'), ' ', h('button', { class: 'btn small alt', 'aria-label': 'Einstellungen', onclick: () => { app.settingsOpen = true; render(); } }, '⚙️'), ' ', h('button', { class: 'btn small alt', 'aria-label': 'Spielerklärungen', onclick: () => { app.helpOpen = true; render(); } }, '📖')),
      h('ul', { class: 'players' }, v.players.map((p) => h('li', { class: 'player' + (p.connected ? '' : ' off') },
        PG.avatarEl(p),
        h('span', { class: 'pname' }, PG.nameEl(p.name, p.fx), ' ', h('small', null, [p.id === v.host ? 'Host' : '', p.id === v.me ? 'du' : '', p.bot ? { easy: 'Leicht', mid: 'Mittel', hard: 'Schwer' }[p.bot] : '', p.connected ? '' : 'offline'].filter(Boolean).join(', '))),
        needTeams ? h('span', { class: 'teamsel', role: 'group', 'aria-label': 'Team von ' + p.name }, TEAMS.map((tm, t) => h('button', {
          style: { '--tc': tm.color }, 'aria-pressed': String(p.team === t), disabled: !(isHost || p.id === v.me), onclick: () => send({ t: 'team', team: t, pid: p.id }),
        }, tm.name))) : null,
        isHost && p.id !== v.me ? h('button', { class: 'kick', 'aria-label': p.name + ' entfernen', onclick: () => send({ t: 'kick', pid: p.id }) }, '✕') : null))),
      isHost ? h('div', { class: 'botrow' }, h('b', null, 'Bot hinzufügen'),
        [['easy', 'Leicht'], ['mid', 'Mittel'], ['hard', 'Schwer']].map(([lv, nm]) => h('button', { class: 'btn small alt', disabled: v.players.length >= 10, onclick: () => send({ t: 'addbot', level: lv }) }, '🤖 ' + nm))) : null,
      isHost && needTeams ? h('div', { style: { marginTop: '10px' } }, h('button', { class: 'btn small alt', onclick: () => send({ t: 'shuffle' }) }, 'Teams mischen')) : null,

      h('h2', { class: 'section-title' }, 'Spiel'),
      h('div', { class: 'games' }, v.games.map((g) => h('button', {
        class: 'gamecard', 'aria-pressed': String(g.id === v.selected), disabled: !isHost || !g.ready, onclick: () => send({ t: 'select', game: g.id }),
      }, h('span', { class: 'ge', 'aria-hidden': 'true' }, g.emoji), h('span', null, h('b', null, g.name), h('span', { class: 't' }, g.ready ? g.blurb : 'Kommt bald.'))))),
      PG.LobbyUI[v.selected] ? PG.LobbyUI[v.selected](v, isHost, send, render) : null,

      h('div', { class: 'startbar' },
        isHost ? h('button', { class: 'btn block', disabled: !!v.startError, onclick: () => send({ t: 'start' }) }, 'Spiel starten') : null,
        h('p', { class: 'hint' }, isHost ? (v.startError || 'Alles bereit.') : 'Der Host wählt das Spiel und startet es.')));
  }

  function gameScreen() {
    const v = app.view;
    const isHost = v.me === v.host;
    const ui = UI[v.gameId];
    const ctx = { isHost, me: v.me, players: v.players, send: (m) => send(Object.assign({ t: 'g' }, m)), sendRoom: send, rerender: render };
    const uiNode = ui ? ui(v.game, ctx) : h('p', null, 'Unbekanntes Spiel.');
    const node = h('div', { class: 'game' }, topbar(v, true), uiNode);
    node.__gid = v.gameId;
    node.__ui = uiNode;
    return node;
  }

  /** Klänge für Ereignisse in der Lobby (Spiel-Klänge kommen aus den Spielen selbst) */
  function cues(a, b) {
    if (!b) return;
    if (!a || a.code !== b.code) return;
    if (!a.gameId && b.gameId) { PG.Audio.sfx('start'); app.helpOpen = app.settingsOpen = app.profileOpen = false; }
    else if (!a.gameId && !b.gameId && b.players.length > a.players.length) PG.Audio.sfx('join');
  }

  function render() {
    const root = document.getElementById('app');
    let node;
    // Spiele mit eigenem „patch“ (z. B. Zeichenfläche) bauen ihre Oberfläche nicht jedes Mal neu auf,
    // damit Eingabefeld, Tastatur und laufende Striche erhalten bleiben.
    if (app.mode === 'room' && app.view && app.view.gameId) {
      const cur = root.firstChild;
      const G = UI[app.view.gameId];
      if (cur && cur.__gid === app.view.gameId && G && G.patch) {
        const isHost = app.view.me === app.view.host;
        const ctx = { isHost, me: app.view.me, players: app.view.players, send: (m) => send(Object.assign({ t: 'g' }, m)), sendRoom: send, rerender: render };
        if (G.patch(cur.__ui, app.view.game, ctx)) { startTimerLoop(); return; }
      }
    }
    if (app.view) { PG.profs = app.view.players; syncPhotos(); }
    PG.Audio.scene(app.mode === 'room' && app.view && app.view.gameId ? app.view.gameId : 'lobby');
    PG.Audio.setIntensity(mood());
    if (app.view !== app.lastView) { cues(app.lastView, app.view); app.lastView = app.view; }
    const panelOk = app.mode === 'home' || (app.mode === 'room' && app.view && !app.view.gameId);
    if (app.helpOpen && panelOk) {
      node = PG.helpScreen({ onDone: () => { app.helpOpen = false; render(); } });
    } else if (app.settingsOpen && panelOk) {
      node = PG.settingsScreen({ rerender: render, onDone: () => { app.settingsOpen = false; render(); }, onProfile: () => { app.settingsOpen = false; app.profileOpen = true; render(); } });
    } else if (app.profileOpen && (app.mode === 'home' || (app.mode === 'room' && app.view && !app.view.gameId))) {
      const inRoom = app.mode === 'room';
      node = PG.profileScreen({
        name: inRoom ? app.name : (app.draft.name || '').trim() || null,
        rerender: render,
        onDone: () => { app.profileOpen = false; render(); },
        onChange: inRoom ? profileChanged : null,
        onImported: () => { if (!inRoom) app.draft.name = ls.get('pg.name') || app.draft.name; },
      });
    } else if (app.mode === 'home') node = homeScreen();
    else if (app.mode === 'connecting') node = statusScreen('📡', app.statusText || 'Verbinde …');
    else if (app.mode === 'reconnect') node = statusScreen('🔄', 'Verbindung unterbrochen', 'Wir versuchen, dich wieder zu verbinden.');
    else if (!app.view) node = statusScreen('📡', 'Lade den Raum …');
    else node = app.view.gameId ? gameScreen() : lobbyScreen();
    const active = document.activeElement;
    const keepFocus = active && active.id ? active.id : null;
    root.replaceChildren(node);
    if (keepFocus) { const el = document.getElementById(keepFocus); if (el) el.focus(); }
    startTimerLoop();
  }

  /** Wie dicht die Musik gerade sein soll (0 ruhig … 1 voll): mehr Spannung bei Zeitnot oder kurz vor Rundenende */
  function mood() {
    const v = app.view;
    if (!v || !v.gameId || !v.game) return 0.4;
    const g = v.game;
    if (v.gameId === 'cards') {
      if (g.phase !== 'play') return 0.4;
      const few = g.players.some((p) => p.n <= 2);
      return few ? 0.95 : g.pending ? 0.8 : 0.55;
    }
    if (v.gameId === 'quiz' || v.gameId === 'blitz' || v.gameId === 'guess') return g.phase === 'q' ? 0.65 : 0.4;
    if (v.gameId === 'chain') return g.phase === 'work' ? 0.45 : 0.3;
    if (v.gameId === 'wolf') return g.phase === 'vote' || g.phase === 'shot' ? 0.8 : g.phase === 'night' ? 0.5 : g.phase === 'end' ? 0.3 : 0.4;
    return 0.5;
  }

  /* Zeitbalken: laufen lokal ab dem Wert, den der Host mitgeschickt hat (keine Uhren-Abgleiche nötig).
     Mit data-tick tickt es in den letzten 5 Sekunden, und die Musik wird dichter. */
  let raf = 0;
  let lastTickSec = -1;
  function startTimerLoop() {
    cancelAnimationFrame(raf);
    const items = [...document.querySelectorAll('.timer[data-remaining]')].map((el) => ({ el, fill: el.firstChild, rem: +el.dataset.remaining, total: Math.max(1, +el.dataset.total), tick: el.hasAttribute('data-tick') }));
    if (!items.length) { lastTickSec = -1; return; }
    const t0 = performance.now();
    const tick = () => {
      const el = performance.now() - t0;
      let live = false;
      for (const it of items) {
        const left = Math.max(0, it.rem - el);
        it.fill.style.transform = 'scaleX(' + (left / it.total) + ')';
        const low = left / it.total < 0.25;
        it.el.classList.toggle('low', low);
        if (left > 0) live = true;
        if (it.tick && left > 0) {
          if (low) PG.Audio.setIntensity(1);
          const sec = Math.ceil(left / 1000);
          if (left <= 5000 && sec !== lastTickSec) { lastTickSec = sec; PG.Audio.sfx('tick'); }
        }
      }
      if (live) raf = requestAnimationFrame(tick);
    };
    tick();
  }

  /* ---------- Start ---------- */

  const params = new URLSearchParams(location.search);
  const preset = (params.get('raum') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, PG.Net.CODE_LEN);
  if (preset) app.draft.code = preset;

  let saved = null;
  try { saved = JSON.parse(ss.get('pg.sess') || 'null'); } catch (e) { saved = null; }
  if (saved && saved.code && saved.name) {
    app.code = saved.code; app.name = saved.name; app.role = 'client';
    reconnect();
  } else render();
})();

</script>
</body>
</html>
